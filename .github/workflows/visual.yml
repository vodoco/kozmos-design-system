name: Visual Regression

# Kozmos's own visual review, run here rather than bought. Every story, in the
# light theme and the dark, is drawn by the Playwright image and compared with
# a baseline committed in the same commit as the code that changed it
# (tests/visual/baselines). A change shows in the pull request's own image
# diff; an unexpected one fails `compare`, whose report shows the baseline,
# the new drawing and the difference. docs/visual-review.md has the whole story.
#
# `record`, run from the Actions tab on a branch, draws new baselines and
# commits them to that branch: the way to accept a change without Docker.
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      record:
        description: "Record new baselines and commit them to this branch"
        type: boolean
        default: false

concurrency:
  # A pull request's older run gives way to its newer push; main's never does,
  # so every commit on main has a finished run. A run cancelled on main left
  # that commit with no green run to release from (release/policy.mjs wants the
  # main-push run's jobs), as #310's and #311's merges were on 20 Oct.
  group: visual-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

# Read-only unless a job says otherwise: `compare` runs a pull request's own
# code, and has no business with a token that can push.
permissions:
  contents: read

jobs:
  compare:
    name: Visual Review
    if: ${{ !inputs.record }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    # The same image `pnpm test:visual` runs locally: one Chromium, one set
    # of fonts, so a baseline drawn in either place matches the other.
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      # No `version`: pnpm/action-setup v4.4 and later refuse to run when the
      # action and package.json's `packageManager` both name one, so pnpm is
      # the manifest's, as in release.yml.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@kozmos-ds/react...' build
      - run: pnpm --filter @kozmos-ds/docs build-storybook
      - name: Compare every story with its baseline
        run: pnpm exec playwright test -c playwright.visual.config.ts
      - name: Say which stories changed
        if: ${{ failure() }}
        run: node scripts/visual/summary.mjs >> "$GITHUB_STEP_SUMMARY"
      - name: Keep the report
        if: ${{ failure() }}
        uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        with:
          name: visual-report
          path: |
            visual-report
            visual-results
          retention-days: 14

  record:
    name: Record visual baselines
    if: ${{ inputs.record && github.ref != 'refs/heads/main' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    container:
      image: mcr.microsoft.com/playwright:v1.58.2-noble
      options: --ipc=host
    # Run only by hand, on a branch someone chose: it commits the baselines
    # it draws to that branch.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter '@kozmos-ds/react...' build
      - run: pnpm --filter @kozmos-ds/docs build-storybook
      # Only a drawing that fails the comparison is redrawn. A baseline that
      # still matches keeps its bytes — redrawing everything committed a few
      # anti-aliased pixels one unit off as "changes" nobody could see — and
      # one whose story is gone is pruned.
      - name: Record new baselines
        run: |
          pnpm exec playwright test -c playwright.visual.config.ts --update-snapshots=changed
          node scripts/visual/prune-baselines.mjs
      - name: Commit the new baselines to this branch
        env:
          RUN_ID: ${{ github.run_id }}
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/visual/baselines
          if git diff --cached --quiet; then
            echo "Every baseline was already current." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          git commit -m "visual: record baselines (run $RUN_ID)"
          git push
          {
            echo "Committed the new baselines: $(git show --stat --format= HEAD | tail -1)."
            echo "A commit pushed by a workflow starts no checks: push again, or re-run them, to see the pull request's checks on it."
          } >> "$GITHUB_STEP_SUMMARY"
