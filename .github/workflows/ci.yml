name: CI

on:
  push:
    branches: ["main"]
    # Documentation-only pushes do not need the matrix. This job set includes a `macos-latest`
    # runner, which GitHub bills at 10x minutes — on 2026-08-28 six of eight pushes to main were
    # markdown-only and each ran the full matrix, which is how the spending limit was reached.
    # Deliberately NOT applied to `pull_request`: a required check that never reports blocks a PR.
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"
  pull_request:
    types: [opened, synchronize]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  web:
    name: Web Build & Test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify Release Safeguards
        run: pnpm test:release

      # The design system gates on its own lint. apps/mapscale-review is a
      # consumer of the library — a place to use the components for real — and
      # its in-flight work should not block a packages/ change. It is still
      # linted, just in a step that reports without failing the job.
      - name: Lint
        run: pnpm lint --filter=!mapscale-review

      - name: Lint Example App (non-blocking)
        continue-on-error: true
        run: pnpm lint --filter=mapscale-review

      - name: Build Web
        run: pnpm build

      - name: Test Web (Unit & A11y)
        run: pnpm test

      - name: Verify Web Contracts (Pact)
        run: pnpm --filter @kozmos-ds/react test:contracts

      - name: Verify Component Contracts
        run: pnpm components:contract:check

      # The three product-contract files are one contract. Nothing compared
      # them until 2026-09-25, and the drift that found was ten fields and
      # types the web had and neither native platform did.
      - name: Verify Product Contract Parity
        run: pnpm contracts:parity:check

      # .ai-skills/ is what an assistant is handed as fact about Kozmos, and
      # nothing verified it: it documented a v3.x with a Modal component and a
      # variant="primary" to "solid" migration, none of which ever existed here.
      - name: Verify The AI-Facing Docs Match The Code
        run: pnpm skills:check

      # Also never run by any workflow until 2026-09-22. It reports the axes a
      # platform is missing, and fails when the analysis it writes is stale, so
      # the record and the code cannot drift apart unnoticed. Its own controls
      # run first: the enum reader lost a whole axis to a doc comment holding
      # commas, and said the platform was missing what it had just been given.
      # The rename to @kozmos-ds was a search and replace recorded as a diff over
      # 247 files, and a diff cannot know about a file written after it. Rebased
      # onto #58 it missed thirteen, seven of them changesets whose frontmatter
      # names the package `changeset version` looks up — a release that would
      # have found nothing to publish. So the rename is verified, not trusted.
      - name: Verify The Packages Are Named @kozmos-ds
        run: node scripts/check-package-scope.mjs

      - name: Verify Component Variant Parity
        run: node --test scripts/skills/variant-parity.test.mjs && pnpm components:variant:check

      - name: Verify Native POI Fixtures Match Storybook
        run: node --import tsx scripts/sync-ios-poi-examples.mjs

      - name: Verify Native Taxonomy Projection Matches the Web Examples
        run: node scripts/sync-ios-taxonomy.mjs

      - name: Verify Token Contrast Contracts
        run: pnpm tokens:contrast:check

      - name: Verify Radius Parity
        run: pnpm tokens:radius:check

      - name: Verify Border Parity
        run: pnpm tokens:border:check

      # Compose reads colours through the generated themed accessor; iOS and
      # the web follow the theme on their own. The build step above wrote the
      # native token files, and the packages must carry them unchanged.
      - name: Verify Theme Parity
        run: pnpm tokens:theme:check

      - name: Verify Native Token Copies Match the Build
        run: pnpm tokens:copies:check

      - name: Verify Elevation Parity
        run: pnpm tokens:elevation:check

      # A ratchet over a known backlog rather than a pass mark. Every other
      # parity check verifies a named list of consumers, which can only confirm
      # what someone already looked at — elevation passed for two days while 44
      # raw shadow classes sat in components it did not name. This one scans
      # everything and fails when a count goes up.
      - name: Verify No New Raw Values
        run: node --test scripts/lib/raw-value-patterns.test.mjs && pnpm tokens:raw:check

      # A layout token is a bare number, and a bare number is not a length: the
      # browser drops `height: var(--primitives-layout-spacing-200)` without a
      # word. The map sheet's handle was 4px tall from the day it shipped.
      # Reads the token values the build step above emits.
      - name: Verify Owned Lengths Convert Their Tokens
        run: node --test scripts/lib/unitless-tokens.test.mjs && pnpm tokens:unitless:check

      # A Tailwind class the build cannot generate is dropped without a word, and
      # a toHaveClass assertion still passes. bg-background/90 left
      # MapControlButton transparent over the map that way. This reads the
      # stylesheet the build step above produced, so it must stay after it.
      - name: Verify No New Classes That Compile To Nothing
        run: pnpm components:classes:check

      # Packs every non-private package, installs the tarballs into an empty
      # project with npm, resolves every export and README import, renders a
      # component and type-checks every README sample. It reads the build above.
      - name: Verify Packages Install From Their Tarballs
        # `test:release:packages` runs `check-package-install.mjs` inside an
        # isolated git fixture as well as proving the release plan's export
        # path, so it supersedes `packages:install:check` rather than replacing
        # the two checks beside it.
        run: pnpm test:declarations && pnpm test:doc-snippets && pnpm test:release:packages

      # A stale stamp means the plugin source changed without the build id
      # following, and the id is the only way to tell which build produced what
      # is in the Figma file.
      - name: Verify Figma Plugin Build Stamp
        run: pnpm figma:stamp:check

      # The importer's painters run against a stand-in for the Plugin API and
      # what they draw is asserted against the component contract — a 64 square,
      # a counter 4 beyond its edge, a paint bound to the category's variable —
      # with no token and no Figma (2026-09-21). The compatibility check keeps
      # the plugin's syntax and runtime surface honest.
      - name: Measure Figma Plugin Painters
        run: pnpm figma:painters:check && pnpm figma:plugin:check

      # Reads the live Figma file, so it needs the token and is skipped without
      # it. Switched to --strict on 2026-09-03, the day the backlog reached
      # zero — a gate that is red on purpose is a gate somebody switches off.
      - name: Verify Nested Radius
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping nested radius check because FIGMA_ACCESS_TOKEN is not configured."
            exit 0
          fi
          pnpm tokens:radius:nesting --strict

      - name: Verify Typography Parity
        run: pnpm tokens:typography:check

      - name: Verify Documentation Snippets
        run: pnpm docs:snippets:check

      - name: Parse React Code Connect
        run: pnpm figma:parse:linked

      - name: Verify React Code Connect
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping React Code Connect dry-run because FIGMA_ACCESS_TOKEN is not configured."
            exit 0
          fi
          pnpm figma:publish:linked:dry

      - name: Install Playwright
        run: pnpm --filter @kozmos-ds/react exec playwright install --with-deps chromium firefox webkit

      - name: Verify Installed Product Consumer (offline, no authentication)
        run: pnpm product:consumer:check --browser

      - name: Verify Browser Selection
        run: |
          pnpm test:browser-selection
          pnpm test:css-build
          pnpm test:token-alpha
          ADAPTIVE_BROWSER=firefox pnpm test:token-alpha
          ADAPTIVE_BROWSER=webkit pnpm test:token-alpha

      - name: Verify Built Adaptive Layout Geometry
        run: |
          pnpm test:adaptive
          ADAPTIVE_BROWSER=webkit pnpm test:adaptive
          ADAPTIVE_BROWSER=firefox pnpm test:adaptive

      - name: Verify Built Overlay Ownership
        run: |
          pnpm test:overlays
          ADAPTIVE_BROWSER=webkit pnpm test:overlays
          ADAPTIVE_BROWSER=firefox pnpm test:overlays
          pnpm test:select-accessibility
          ADAPTIVE_BROWSER=webkit pnpm test:select-accessibility
          ADAPTIVE_BROWSER=firefox pnpm test:select-accessibility

      - name: Verify Module Theme and Stylesheet Isolation
        run: |
          pnpm test:themes
          ADAPTIVE_BROWSER=webkit pnpm test:themes
          ADAPTIVE_BROWSER=firefox pnpm test:themes

      - name: Verify Scoped Runtime Configuration
        run: |
          pnpm test:config
          ADAPTIVE_BROWSER=webkit pnpm test:config
          ADAPTIVE_BROWSER=firefox pnpm test:config

      # Keep the original WebKit form regression and independently test the
      # migrated slice with every native @scope rule removed.
      - name: Verify Built Form Control Compatibility
        run: |
          result=0
          for browser in chromium firefox webkit; do
            ADAPTIVE_BROWSER="$browser" pnpm test:browser-compatibility || result=1
            ADAPTIVE_BROWSER="$browser" pnpm test:owned-css || result=1
            ADAPTIVE_BROWSER="$browser" pnpm test:temporal-css || result=1
          done
          exit "$result"

      - name: Build and Smoke Test Internal Vue Harness
        run: |
          pnpm --filter @kozmos-ds/docs build-storybook:vue
          pnpm --filter @kozmos-ds/docs exec concurrently -k -s first -n "VUE,TEST" \
            "python3 -m http.server 6009 --bind 127.0.0.1 --directory storybook-internal/vue" \
            "bash -lc 'until curl -sf http://127.0.0.1:6009/index.json >/dev/null; do sleep 2; done; VUE_STORYBOOK_URL=http://127.0.0.1:6009 pnpm -w test:storybook-vue-smoke'"

      - name: Preserve Storybook Audit Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: storybook-audit
          path: test-results/storybook-*.json
          if-no-files-found: ignore
          retention-days: 7

      - name: Enforce SDK Assembly & Accessibility Governance
        run: |
          pnpm exec tsx scripts/skills/check-completion.ts --check

      - name: Verify Proof-of-Output (Web & Tokens)
        run: |
          test -s packages/tokens/dist/css/variables-light.css
          test -s packages/vue/dist/index.d.ts
          node -e "
            const light = require('./packages/tokens/src/tokens-light.json');
            const dark = require('./packages/tokens/src/tokens-dark.json');
            const bgLight = light?.Primitives?.Colors?.background?.['0']?.value || light?.Primitives?.Colors?.background?.['0']?.['\$value'];
            const bgDark = dark?.Primitives?.Colors?.background?.['0']?.value || dark?.Primitives?.Colors?.background?.['0']?.['\$value'];
            if (bgLight === bgDark) {
               console.error('❌ Dark mode tokens match Light mode! Propagation failed.');
               process.exit(1);
            }
            console.log('✅ Dark Mode divergence verified cross-platform.');
          "
  # Five Storybook suites were 72% of the Web job: 1933s of 2686s, measured on
  # run 36016744708. Each ran chromium, then firefox, then webkit in sequence,
  # so the same work was done three times over in one queue. Split by browser
  # they run at once. The repository is public, so these runners are free; the
  # only thing spent is wall clock, which was the whole problem.
  #
  # Each shard installs and builds for itself rather than taking an artifact
  # from the web job. That costs ~4 minutes per shard in parallel, and buys
  # independence: a shard is a complete, re-runnable check, and nothing waits
  # on the web job to finish before it can start.
  browsers:
    name: ${{ matrix.shard.name }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      # One red browser must not hide the others: a WebKit-only failure is the
      # kind this repository has shipped before.
      fail-fast: false
      matrix:
        shard:
          - name: Stories & Interactions (chromium)
            port: 6101
            run: STORY_SCOPE=all pnpm -w test:storybook-audit && pnpm -w test:storybook-interactions
          - name: Interactions (firefox)
            port: 6102
            run: ADAPTIVE_BROWSER=firefox pnpm -w test:storybook-interactions
          - name: Interactions (webkit)
            port: 6103
            run: ADAPTIVE_BROWSER=webkit pnpm -w test:storybook-interactions
          - name: Documentation (chromium)
            port: 6104
            run: pnpm -w test:storybook-docs && pnpm -w test:storybook-audit-fixes
          - name: Documentation (firefox)
            port: 6105
            run: ADAPTIVE_BROWSER=firefox pnpm -w test:storybook-audit-fixes
          - name: Documentation (webkit)
            port: 6106
            run: ADAPTIVE_BROWSER=webkit pnpm -w test:storybook-audit-fixes
          - name: POI Reference (chromium)
            port: 6107
            run: pnpm -w test:poi-details
          - name: POI Reference (firefox)
            port: 6108
            run: ADAPTIVE_BROWSER=firefox pnpm -w test:poi-details
          - name: POI Reference (webkit)
            port: 6109
            run: ADAPTIVE_BROWSER=webkit pnpm -w test:poi-details
          - name: Map, Search & Navigation (chromium)
            port: 6110
            run: pnpm -w test:map-sheet && pnpm -w test:search-sheet && pnpm -w test:navigation
          - name: Map, Search & Navigation (firefox)
            port: 6111
            run: ADAPTIVE_BROWSER=firefox pnpm -w test:map-sheet && ADAPTIVE_BROWSER=firefox pnpm -w test:search-sheet && ADAPTIVE_BROWSER=firefox pnpm -w test:navigation
          - name: Map, Search & Navigation (webkit)
            port: 6112
            run: ADAPTIVE_BROWSER=webkit pnpm -w test:map-sheet && ADAPTIVE_BROWSER=webkit pnpm -w test:search-sheet && ADAPTIVE_BROWSER=webkit pnpm -w test:navigation
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm build

      - name: Install Playwright
        run: pnpm --filter @kozmos-ds/react exec playwright install --with-deps

      # Every shard gets its own port. They are separate runners today, but a
      # fixed port is the kind of thing that only breaks once two of these ever
      # share a machine, and the failure then looks like a flaky test.
      - name: ${{ matrix.shard.name }}
        run: |
          pnpm --filter @kozmos-ds/docs exec concurrently -k -s first -n "STATIC,TEST" \
            "python3 -m http.server ${{ matrix.shard.port }} --bind 127.0.0.1 --directory storybook-static" \
            "bash -lc 'until curl -sf http://127.0.0.1:${{ matrix.shard.port }}/index.json >/dev/null; do sleep 2; done; export STORYBOOK_URL=http://127.0.0.1:${{ matrix.shard.port }}; ${{ matrix.shard.run }}'"

      - name: Preserve Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: browser-evidence-${{ strategy.job-index }}
          path: |
            test-results/poi-detail-examples
            test-results/storybook-*.json
          if-no-files-found: ignore
          retention-days: 7

  # The dev-server pipeline and the package-built gallery do not read
  # storybook-static, so they do not fit the matrix above: one needs Storybook
  # running, the other needs no server at all. They are their own job so they
  # stop queueing behind the static suites.
  pipeline:
    name: Core Pipeline & POI Gallery
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Web
        run: pnpm build

      - name: Install Playwright
        run: pnpm --filter @kozmos-ds/react exec playwright install --with-deps

      - name: Core Pipeline - Storybook E2E & A11y Verification
        run: |
          # Chromatic is the required visual-regression gate. Keep local screenshot baselines manual until repaired.
          pnpm --filter @kozmos-ds/docs exec concurrently -k -s first -n "SB,TEST" \
            "pnpm --filter @kozmos-ds/docs storybook:react --ci --host 127.0.0.1" \
            "bash -lc 'until curl -sf http://127.0.0.1:6006 >/dev/null; do sleep 2; done; pnpm --filter @kozmos-ds/react exec playwright test && pnpm -w exec tsx scripts/skills/check-a11y.ts && pnpm -w test:storybook-regressions && ADAPTIVE_BROWSER=firefox pnpm -w test:storybook-regressions && ADAPTIVE_BROWSER=webkit pnpm -w test:storybook-regressions'"

      - name: Verify SDK POI Reference Examples
        # Package-built gallery checks are separate from source-backed Storybook.
        run: |
          pnpm test:poi-gallery
          ADAPTIVE_BROWSER=firefox pnpm test:poi-gallery
          ADAPTIVE_BROWSER=webkit pnpm test:poi-gallery

      - name: Preserve POI Reference Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: poi-gallery
          path: test-results/poi-gallery
          if-no-files-found: ignore
          retention-days: 7

  ios:
    name: iOS Build
    # macos-latest bills at 10x minutes, and this is how the spending limit was
    # reached on 2026-08-28 and again on 2026-09-23. So this runs once per merge
    # rather than once per push: over the last 60 CI runs that is 13 rather than
    # 47, and it used to be all 60.
    #
    # It runs on main and not on the pull request because release/policy.mjs
    # requires a successful "iOS Build" job in the main-push CI run it publishes
    # against, and a merge commit's SHA has never existed on a pull request - it
    # has two parents. Gating this to pull requests left every main push short
    # one job, which is why dispatch 36001027330 refused to publish 0.2.0 with
    # "skipped jobs are not evidence". The guard was right; the gate was wrong.
    #
    # The cost is that a pull request gets no iOS signal from CI. Run
    # `pnpm ci:local --job ios` before merging - it covers 8 of these 12 steps
    # on a Mac that is already paid for.
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: macos-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install JS Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Design Tokens
        run: pnpm --filter @kozmos-ds/tokens build

      - name: Build iOS Package
        working-directory: packages/ios
        run: swift build

      - name: Test iOS Package
        working-directory: packages/ios
        run: swift test

      - name: Test Native POI Rendering on iOS Simulator
        run: node scripts/check-ios-poi.mjs

      - name: Preserve Native POI Render Evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: native-poi-test-results
          path: ${{ runner.temp }}/kozmos-ios-poi-*/TestResults.xcresult
          if-no-files-found: warn

      - name: Parse SwiftUI Code Connect
        run: pnpm figma:parse:ios:linked

      - name: Verify SwiftUI Code Connect
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping SwiftUI Code Connect dry-run because FIGMA_ACCESS_TOKEN is not configured."
            exit 0
          fi
          pnpm figma:publish:ios:linked:dry

      - name: Verify Proof-of-Output (iOS)
        run: test -s packages/tokens/dist/ios/KozmosColors.swift

  android:
    name: Android Build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repo
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v3
        with:
          version: 9

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "pnpm"

      - name: Install JS Dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Design Tokens
        run: pnpm --filter @kozmos-ds/tokens build

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: "zulu"
          java-version: "17"

      - name: Build Android Library
        working-directory: packages/android
        run: ./gradlew assembleDebug

      - name: Test Android Library
        working-directory: packages/android
        run: ./gradlew verifyPaparazziDebug

      # A golden that differs only on Linux cannot be read from the log; the
      # delta images Paparazzi writes show what moved, and by how much.
      - name: Upload Paparazzi Failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: paparazzi-failures
          path: packages/android/build/paparazzi/failures/
          if-no-files-found: ignore
          retention-days: 7

      - name: Parse Compose Code Connect
        run: pnpm figma:parse:android:linked

      - name: Verify Compose Code Connect
        env:
          FIGMA_ACCESS_TOKEN: ${{ secrets.FIGMA_ACCESS_TOKEN }}
        run: |
          if [ -z "$FIGMA_ACCESS_TOKEN" ]; then
            echo "::notice::Skipping Compose Code Connect dry-run because FIGMA_ACCESS_TOKEN is not configured."
            exit 0
          fi
          pnpm figma:publish:android:linked:dry

      - name: Verify Proof-of-Output (Android)
        run: test -s packages/tokens/dist/android/src/main/java/com/kozmos/tokens/KozmosColors.kt
