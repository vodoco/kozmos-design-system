name: Release Kozmos System

# Successful CI never publishes. Dispatch from main, then approve npm-release.
on:
  workflow_dispatch:
    inputs:
      sha:
        description: Full main HEAD commit SHA to publish
        type: string
        required: true
      ci_run_id:
        description: Successful main-push CI run ID for that exact SHA
        type: string
        required: true
      confirmation:
        description: Type publish followed by a space and the full SHA
        type: string
        required: true

permissions:
  contents: read
  actions: read

concurrency:
  group: kozmos-npm-release
  cancel-in-progress: false

env:
  RELEASE_SHA: ${{ inputs.sha }}
  CI_RUN_ID: ${{ inputs.ci_run_id }}
  RELEASE_CONFIRMATION: ${{ inputs.confirmation }}
  NPM_RELEASE_ENABLED: ${{ vars.NPM_RELEASE_ENABLED }}

jobs:
  # Both jobs below are fenced with `if:`, and a dispatch that fails those
  # conditions skips them — leaving a run of skipped jobs, which GitHub
  # concludes as success. A release that published nothing then looks exactly
  # like a release that worked. This job carries no `if:`, so it always runs
  # and turns that silence into a failure. Values reach the shell through the
  # environment, never interpolated into the script.
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: The dispatch must name main HEAD
        env:
          CANDIDATE: ${{ inputs.sha }}
          HEAD_SHA: ${{ github.sha }}
          REF: ${{ github.ref }}
        run: |
          failed=0
          if [ "$REF" != "refs/heads/main" ]; then
            echo "Dispatched from $REF; a release runs from refs/heads/main." >&2
            failed=1
          fi
          if [ "$CANDIDATE" != "$HEAD_SHA" ]; then
            echo "Candidate $CANDIDATE is not main HEAD $HEAD_SHA." >&2
            echo "Dispatch again naming the commit main actually points at." >&2
            failed=1
          fi
          [ "$failed" -eq 0 ] || exit 1
          echo "ok    candidate is main HEAD"

  prepare:
    if: github.ref == 'refs/heads/main' && inputs.sha == github.sha
    runs-on: ubuntu-latest
    timeout-minutes: 30
    outputs:
      artifact_id: ${{ steps.artifact.outputs.artifact-id }}
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      # No `version` here on purpose: pnpm/action-setup refuses to run when the
      # action and package.json's `packageManager` both name a version, and the
      # manifest is the one the whole repository already obeys.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      # setup-node 5 restores a cache of its own when package.json names a
      # package manager. A release installs from the lockfile, never a cache.
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Validate request, CI, release plan and environment protection
        run: node scripts/release/verify-request.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - run: pnpm test:release
      - name: Build public packages without npm credentials
        run: pnpm --filter './packages/*' build
      - name: Test and retain the exact candidate tarballs
        run: pnpm packages:install:check --release-output "$RUNNER_TEMP/kozmos-release" --release-sha "$RELEASE_SHA"
      - uses: actions/upload-artifact@b7c566a772e6b6bfb58ed0dc250532a479d7789f # v6.0.0
        id: artifact
        with:
          name: npm-candidate-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/kozmos-release
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: prepare
    if: github.ref == 'refs/heads/main' && inputs.sha == github.sha
    runs-on: ubuntu-latest
    # Each package waits up to ten minutes for npm's read path to catch up with
    # its own write (publisher.mjs). Four packages must fit inside this, with
    # room for checkout and install, or the runner kills the job before the
    # assertion can report which package the registry never showed.
    timeout-minutes: 45
    environment: npm-release
    # npm provenance (Olcay's decision 32): this job, and only this job, may
    # mint an OIDC token, so npm can attest that each package was built from
    # this repository's commit by this workflow. It was off while the
    # repository was private; npm attests public repositories only. Nothing
    # gains write access to the repository.
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0
        with:
          ref: ${{ inputs.sha }}
          persist-credentials: false
      # No `version` here on purpose: pnpm/action-setup refuses to run when the
      # action and package.json's `packageManager` both name a version, and the
      # manifest is the one the whole repository already obeys.
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false
      - run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Revalidate inside the environment before any npm write
        run: node scripts/release/verify-request.mjs
        env:
          GH_TOKEN: ${{ github.token }}
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          artifact-ids: ${{ needs.prepare.outputs.artifact_id }}
          merge-multiple: true
          path: ${{ runner.temp }}/kozmos-release
      - name: Publish only the tested and approved tarballs
        run: node scripts/release/publish.mjs
        env:
          GH_TOKEN: ${{ github.token }}
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
