name: Lighthouse CI

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"

concurrency:
  # A pull request's older run gives way to its newer push; main's never does,
  # so every commit on main has a finished run. A run cancelled on main left
  # that commit with no green run to release from (release/policy.mjs wants the
  # main-push run's jobs), as #310's and #311's merges were on 20 Oct.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 20
          # setup-node v5 caches by itself when package.json names a
          # packageManager, and pnpm is not installed yet at this step. This job
          # has never cached; it still does not.
          package-manager-cache: false

      # No `version`: pnpm/action-setup v4.4 and later refuse to run when the
      # action and package.json's `packageManager` both name one, so pnpm is
      # the manifest's, as in release.yml.
      - name: Install pnpm
        uses: pnpm/action-setup@v5

      - name: Install dependencies
        run: pnpm install

      - name: Build workspace topology
        run: pnpm turbo run build --filter=@kozmos-ds/docs

      - name: Run Lighthouse CI
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: ./lighthouserc.json
