name: Bundle Size Analysis

on:
  pull_request:
    branches:
      - main
  push:
    branches:
      - main
    paths-ignore:
      - "**.md"
      - "docs/**"
      - ".vscode/**"
      - "LICENSE"

concurrency:
  # A pull request's older run gives way to its newer push; main's never does,
  # so every commit on main has a finished run. A run cancelled on main left
  # that commit with no green run to release from (release/policy.mjs wants the
  # main-push run's jobs), as #310's and #311's merges were on 20 Oct.
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  analyze-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.1.0

      - name: Setup Node
        uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444 # v5.0.0
        with:
          node-version: 20
          # setup-node v5 caches by itself when package.json names a
          # packageManager, and pnpm is not installed yet at this step. This job
          # has never cached; it still does not.
          package-manager-cache: false

      # No `version`: pnpm/action-setup v4.4 and later refuse to run when the
      # action and package.json's `packageManager` both name one, so pnpm is
      # the manifest's, as in release.yml.
      - name: Install pnpm
        uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v5.0.0

      - name: Install dependencies
        run: pnpm install

      - name: Run Bundle Size Analyzer
        run: pnpm tsx scripts/performance/bundle-analyzer.ts
