<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "fonts.dtd">
<!--
  The visual review's fonts. The Playwright image resolves system-ui and
  sans-serif to WenQuanYi Zen Hei, a Chinese face with no bold, so every
  baseline drew Latin text in it and a weight of 700 like 400 (measured
  2026-11-13). Roboto, Android's system face and one Kozmos's stack names,
  is put first instead: a variable font, so 500, 600 and 700 each draw as
  themselves. The image's own fonts still follow, for scripts Roboto has
  no glyphs for. The suite hands this file to Chromium through
  FONTCONFIG_FILE (playwright.visual.config.ts).
-->
<fontconfig>
  <include ignore_missing="no">/etc/fonts/fonts.conf</include>
  <dir prefix="relative">.</dir>
  <match target="pattern">
    <test qual="any" name="family"><string>sans-serif</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Roboto</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>sans</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Roboto</string></edit>
  </match>
  <match target="pattern">
    <test qual="any" name="family"><string>system-ui</string></test>
    <edit name="family" mode="prepend" binding="strong"><string>Roboto</string></edit>
  </match>
</fontconfig>
