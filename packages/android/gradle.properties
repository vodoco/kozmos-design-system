android.useAndroidX=true
android.enableJetifier=true
android.jetifier.ignorelist=common
# Heap for the Gradle daemon and the Kotlin compiler. Gradle's default (512 MB)
# left compileDebugKotlin borderline: on CI it ran out of memory in the IR
# lowering of the generated KozmosThemeTokens.kt once a pull request added a
# few hundred lines of Kotlin (#234, "GC overhead limit exceeded"). GitHub's
# ubuntu-latest runners have 16 GB.
org.gradle.jvmargs=-Xmx4g -XX:MaxMetaspaceSize=1g -Dfile.encoding=UTF-8
kotlin.daemon.jvmargs=-Xmx3g
