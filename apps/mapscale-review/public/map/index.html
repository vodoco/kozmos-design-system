         * How many features are selected *besides* this one — so `selected + 1` is what the toast
         * and the panel count. Reported rather than assumed by the app: the app knows which fids it
         * asked for, but only this side knows which of them the map could actually find.
         */
        picked: GEOM.pick.length,
        /**
         * Whether Combine can run on the current selection, and the sentence to show when it
         * cannot. Computed here because only this side has the outlines — see `geomCombinable`.
         */
        combinable: can.ok,
        combineWhy: can.why,
        /**
         * **What the combines in this session did**, so the panel's list can say it rather than
         * only counting (Olcay, 2026-08-16: *"we should update the selected items section for
         * combination results - what's joined for what's removed"*).
         *
         * Two different fates and they must not be conflated: a **joined** feature's floor is part
         * of this shape now, while a **removed** one was standing between two of them and has been
         * taken off the map. Both still exist in Pointr Cloud — the count is a report, not a claim
         * that anything was deleted.
         */
        absorbed: GEOM.absorbed.length,
        joined: GEOM.absorbed.slice(),
        /**
         * Can a member still be taken back out? False once the shape has been hand-edited, because
         * recomputing from fewer members would discard that work — the panel disables the row's ✕
         * and says why rather than doing it silently.
         */
        recomposable: !!GEOM.combine,
        removed: GEOM.hidden.labels.slice(),
        // A point has no outline and a network has no ring: the toolbar drops every tool that
        // would be a lie on either.
        kind: GEOM.kind,
        /** How many nodes the network being edited has, for the toolbar to say so. */
        nodes: GEOM.nodes ? GEOM.nodes.length : 0,
        /** Is the pointer on an edge? Then Delete unlinks it, and the caption should say so. */
        onEdge: !!(GEOM.cut && GEOM.kind === "network"),
        selected: GEOM.sel.size,
        /**
         * How many whole EDGES the corner selection amounts to — an edge counts when **both** of
         * its ends are selected, which is the whole of what edge selection is here. So a marquee
         * that happens to catch two adjacent corners reports the edge between them, correctly and
         * for free, and the toolbar can say "3 edges" where that is the more useful sentence.
         */
        selectedEdges: geomSelectedEdges(),
      }
    : { editing: false };
}

/** Snapshot before a change. Redo is dropped, as it is in every editor that has ever felt right. */
function geomPush() {
  if (!GEOM) return;
  /**
   * ⚠️ **Any change dissolves a combine's composition**, and this is the one place that can say so
   * for all of them. Once a corner has been dragged the rings are no longer a function of the
   * members, so recomputing from a smaller set would quietly throw that work away. Combine sets it
   * again immediately after its own push — see `geomApplyCombine`.
   */
  GEOM.combine = null;
  GEOM.history.push(geomSnap());
  if (GEOM.history.length > 50) GEOM.history.shift();
  GEOM.future = [];
}

function geomUndo() {
  if (!GEOM || !GEOM.history.length) return;
  GEOM.future.push(geomSnap());
  geomRestore(GEOM.history.pop());
  geomDraw(); post("geomstate", geomState());
}

function geomRedo() {
  if (!GEOM || !GEOM.future.length) return;
  GEOM.history.push(geomSnap());
  geomRestore(GEOM.future.pop());
  geomDraw(); post("geomstate", geomState());
}

function geomReset() {
  if (!GEOM) return;
  geomPush();
  geomRestore(GEOM.original);
  geomDraw(); post("geomstate", geomState());
}

/**
 * Changing mode always abandons a half-laid cut — a dangling anchor is a trap on the next click.
 *
 * ⚠️ **It does NOT touch the selection.** It did for a few hours, while Combine was an armed mode
 * and the picks belonged to it. They belong to the user now: which features you are working on is
 * not a fact about whether you are reshaping or transforming, and dropping four selected rooms
 * because somebody glanced at Transform would be indefensible.
 */
function geomSetMode(mode) {
  if (!GEOM) return;
  GEOM.mode = mode;
  GEOM.cutA = GEOM.cutB = null;
  GEOM.cutRefs = null;
  GEOM.cutBases = null;
  GEOM.guides = GEOM.guideAt = null;
  geomDraw(); post("geomstate", geomState());
}
function geomToggleSnap() { if (GEOM) { GEOM.snap = !GEOM.snap; post("geomstate", geomState()); } }

/* ── snapping ──────────────────────────────────────────────────────────────────
   Screen distance throughout, never ground distance: snapping is about what the eye reads as
   touching, and a metre is a lot zoomed out and nothing zoomed in.

   ⚠️ **Corners were the only thing you could snap to** until 2026-08-16 (Olcay: *"snap should also
   snap to lines of other features' geometries"*). A room shares a WALL with its neighbour far more
   often than it shares a corner, so the one case snapping existed for was the case it could not do.

   It is indexed rather than scanned because of where it is now used: the whole-shape move tests
   every one of the dragged feature's vertices on every frame, and a linear pass over every rendered
   feature per vertex per frame is thousands of times more work than a frame has. The index is built
   once per gesture — the map cannot move mid-drag, so screen coordinates stay valid for its life. */

/* SNAP-ENGINE-START — extracted and tested by scratch/geometry.test.mjs; keep DOM- and map-free. */

/** Nearest point on the segment `1→2` to `p`, clamped to the segment's ends. */
function segClosest(px, py, x1, y1, x2, y2) {
  const dx = x2 - x1, dy = y2 - y1;
  const L2 = dx * dx + dy * dy;
  if (L2 < 1e-12) return [x1, y1];
  let t = ((px - x1) * dx + (py - y1) * dy) / L2;
  t = t < 0 ? 0 : t > 1 ? 1 : t;
  return [x1 + dx * t, y1 + dy * t];
}

/**
 * A uniform grid over the snap candidates. `cell` must be ≥ the snap radius, so a query only ever
 * has to look at its own cell and the eight around it.
 */
function buildSnapIndex(verts, segs, cell) {
  const g = new Map();
  const add = (gx, gy, item) => {
    const k = gx + ":" + gy;
    const a = g.get(k);
    if (a) a.push(item); else g.set(k, [item]);
  };
  for (const v of verts) add(Math.floor(v[0] / cell), Math.floor(v[1] / cell), { v });
  for (const s of segs) {
    // Walked in cell-sized steps rather than bucketed by bounding box: a long diagonal's box covers
    // a great many cells it never passes through, and every one of those is a wasted query later.
    const len = Math.hypot(s[2] - s[0], s[3] - s[1]);
    const steps = Math.max(1, Math.ceil(len / cell));
    let last = "";
    for (let i = 0; i <= steps; i++) {
      const t = i / steps;
      const gx = Math.floor((s[0] + (s[2] - s[0]) * t) / cell);
      const gy = Math.floor((s[1] + (s[3] - s[1]) * t) / cell);
      const k = gx + ":" + gy;
      if (k !== last) { add(gx, gy, { s }); last = k; }
    }
  }
  return { g, cell };
}

/**
 * How much nearer an edge must be than a corner before it wins, in pixels.
 *
 * ⚠️ **This was `Infinity` in effect** — the first version returned a corner whenever one was in
 * range at all, on the reasoning that a corner is a place somebody meant. That reasoning is right
 * and the rule built from it was wrong: floor-plan outlines are dense enough that *some* corner is
 * nearly always within the radius too, so the edge was found, then always lost. Edge snapping was
 * unreachable in exactly the geometry it was built for (Olcay, 2026-08-16: *"snap to edge of other
 * features doesn't work … surprising that we can snap to other features nodes but not edges"* —
 * and the surprise is the tell: it was never the data, both came from the same loop).
 *
 * A bias keeps the intent without the flaw: a corner still wins ties and near-ties, so meeting one
 * stays easy, but an edge that is *clearly* closer is what you were aiming at and takes it.
 */
const SNAP_CORNER_BIAS = 5;

/**
 * The best snap for a screen point, or `null`. Corners are preferred, but only by
 * `SNAP_CORNER_BIAS` — see the note there for why an absolute preference was a bug.
 */
function snapQuery(idx, px, py, radius) {
  if (!idx) return null;
  const c = idx.cell;
  const gx = Math.floor(px / c), gy = Math.floor(py / c);
  let bv = null, bvd = radius, be = null, bed = radius;
  for (let i = -1; i <= 1; i++) for (let j = -1; j <= 1; j++) {
    const arr = idx.g.get((gx + i) + ":" + (gy + j));
    if (!arr) continue;
    for (const it of arr) {
      if (it.v) {
        const d = Math.hypot(it.v[0] - px, it.v[1] - py);
        if (d < bvd) { bvd = d; bv = it.v; }
      } else {
        const q = segClosest(px, py, it.s[0], it.s[1], it.s[2], it.s[3]);
        const d = Math.hypot(q[0] - px, q[1] - py);
        if (d < bed) { bed = d; be = q; }
      }
    }
  }
  if (bv && (!be || bvd <= bed + SNAP_CORNER_BIAS))
    return { x: bv[0], y: bv[1], kind: "corner", d: bvd };
  if (be) return { x: be[0], y: be[1], kind: "edge", d: bed };
  return null;
}
/* SNAP-ENGINE-END */

/* ── guides ────────────────────────────────────────────────────────────────────
   Olcay, 2026-08-16: *"we should have guidelines (like split) for angles and tracking guides
   towards the next destination following cursor."*

   Two different things, and they answer two different questions:

   **Angle guides** answer *"is this edge straight?"* — a ray from the anchor at every 15°, so a wall
   can be laid at exactly 90° or 45° instead of 89.4°.

   **Tracking guides** answer *"does this line up with that?"* — a dashed line to another feature's
   corner when the cursor shares its x or y. This is the one that makes a new room agree with the
   one next door, and it is worth more than the angles on a real floor plan.

   ⚠️ **Both can apply at once and that is the good case**: x from one corner, y from another, and
   the cursor lands exactly on their intersection — a point neither guide could have given alone. */

/* GUIDE-ENGINE-START — extracted and tested by scratch/geometry.test.mjs; keep DOM- and map-free. */

/**
 * ⚠️ **Two tiers, and putting them on one was the bug** (Olcay, 2026-08-16: *"still ignores less
 * then 15 and tags them as 90 or 0. we should be more fine here."*).
 *
 * The previous round widened the magnet on 90° so that 85° and 95° would catch it — but it widened
 * the **free** tolerance, so *any* corner within 6° of square was dragged onto 90 and then labelled
 * `90°`. A corner at 86° is not a right angle, and a tool that says it is has stopped reporting and
 * started deciding. Olcay's words the time before were *"when pressing **shift**"* — the coarse
 * snapping was always meant to live under the modifier, and I put it on the wrong tier.
 *
 * **Free: fine and quiet.** Guides every 5°, and caught only when you are all but *on* one — under
 * a degree for an ordinary angle. A 5° grid with a generous magnet would pull nearly half of all
 * angles onto a round number, which is the same fault in smaller clothing; free mode should
 * **confirm** that you are square, never decide it for you. So 85°, 87° and 90° are three different
 * answers, and the readout tells the truth about which one you are at.
 *
 * **Shift/⌥: coarse and decisive.** Guides every 15° with half a step of pull, so square is
 * unmissable and 85° or 95° lands on 90° — which is what the modifier is *for*.
 */
const GUIDE_STEP_FREE = 5;
const GUIDE_STEP_SNAP = 15;
/**
 * ⚠️ **Not every guide deserves the same magnet** (Olcay, 2026-08-16: *"sometimes we miss 90 when
 * it's 95 or 85"*). Measured: at 2.5° flat, a corner sitting at 85° or 95° is 5° from the guide and
 * misses it — and 85–95° is exactly where a traced or auto-extracted floor plan lands. The one
 * angle everybody is reaching for was the one hardest to catch.
 *
 * **90° and 0° are not like 75°.** Square, and carries-straight-on, are what a building is made of;
 * 75° is a number you would have had to mean. So the important ones get a wider magnet and the
 * incidental ones stay tight — which is also what keeps the wide ones from being noise.
 *
 * Nothing may exceed half a step: past that a guide starts stealing from its neighbour.
 */
const GUIDE_TOLS = { cardinal: 1.2, half: 1, other: 0.8 };
/** With Shift/⌥ every guide gets the maximum — half a step, so the nearest cannot be missed. */
const GUIDE_WIDE_DEG = GUIDE_STEP_SNAP / 2;
const GUIDE_WIDE_TOLS = {
  cardinal: GUIDE_WIDE_DEG, half: GUIDE_WIDE_DEG, other: GUIDE_WIDE_DEG,
};

/**
 * How much slack this particular angle gets: square and straight-on earn the most.
 *
 * Still graded on the free tier — 90° is worth more than 85° even when both are guides — but the
 * spread is now small enough that it never swallows a neighbouring 5° guide.
 */
function guideTolFor(relDeg, tols) {
  const q = Math.abs(((relDeg % 90) + 90) % 90);
  if (Math.min(q, 90 - q) < 1e-9) return tols.cardinal;
  const h = Math.abs(((relDeg % 45) + 45) % 45);
  if (Math.min(h, 45 - h) < 1e-9) return tols.half;
  return tols.other;
}
/** How near an alignment has to be, in pixels. */
const GUIDE_ALIGN_PX = 6;

/**
 * The cursor projected onto the nearest ray of `stepDeg` **measured from `baseDeg`**, if within
 * `tolDeg`.
 *
 * ⚠️ **`baseDeg` is the whole point** (Olcay, 2026-08-16: *"the angles should show based on the
 * previous and next nodes and edges not relative to the screen"*). The first version snapped to
 * multiples of 15° from screen east, which is only useful for a building that happens to face the
 * monitor. A wall meets its neighbour at a right angle **to that neighbour** — so the reference is
 * the edge already there, and 90° means "square to this wall", not "square to your screen". It is
 * the same reasoning that makes Straighten square to the shape's own grid rather than to north.
 *
 * Perpendicular projection rather than "same distance, new angle" — the point should slide onto the
 * guide from where it is, not jump along it.
 */
function angleGuide(ax, ay, px, py, stepDeg, tolDeg, baseDeg) {
  const base = baseDeg || 0;
  const dx = px - ax, dy = py - ay;
  if (Math.hypot(dx, dy) < 1e-6) return null;
  const deg = Math.atan2(dy, dx) * 180 / Math.PI;
  const rel = deg - base;
  const snappedRel = Math.round(rel / stepDeg) * stepDeg;
  let diff = (rel - snappedRel) % 360;
  if (diff > 180) diff -= 360;
  if (diff <= -180) diff += 360;
  if (Math.abs(diff) > tolDeg) return null;
  const abs = base + snappedRel;
  const a = abs * Math.PI / 180, ca = Math.cos(a), sa = Math.sin(a);
  const t = dx * ca + dy * sa;
  return {
    x: ax + ca * t, y: ay + sa * t,
    deg: ((abs % 360) + 360) % 360,          // absolute, for drawing the ray
    rel: ((snappedRel % 360) + 360) % 360,   // relative to the reference, for the label
    base, from: [ax, ay], off: Math.abs(diff),
  };
}

/**
 * The best guide across several reference bearings — the edge before, the edge after, the shape's
 * own grid. Whichever the cursor is nearest to wins, so the guides that appear are the ones the
 * geometry actually justifies.
 *
 * An empty `bases` falls back to `[0]`, i.e. screen axes. That is only right when there is no
 * geometry to refer to — the first edge of a shape being drawn from nothing.
 */
function bestAngleGuide(ax, ay, px, py, stepDeg, tols, bases) {
  const list = bases && bases.length ? bases : [0];
  // A number still means a flat tolerance — the engine stays usable at one fixed value.
  const t = typeof tols === "number" ? { cardinal: tols, half: tols, other: tols } : tols;
  const ceiling = Math.max(t.cardinal, t.half, t.other);
  let best = null;
  for (const b of list) {
    // Found at the widest any guide may claim, then held to what THIS angle has earned.
    const g = angleGuide(ax, ay, px, py, stepDeg, ceiling, b);
    if (!g || g.off > guideTolFor(g.rel, t)) continue;
    if (!best || g.off < best.off) best = g;
  }
  return best;
}

/**
 * Reference points the cursor shares an axis with — at most one per axis, the nearest.
 *
 * Returned separately rather than resolved, because x and y are independent: catching both is how
 * you land on the corner of a room that does not exist yet.
 */
function alignGuides(px, py, refs, tolPx) {
  let bx = null, bxd = tolPx, by = null, byd = tolPx;
  for (const r of refs) {
    const dx = Math.abs(r[0] - px);
    if (dx < bxd) { bxd = dx; bx = r; }
    const dy = Math.abs(r[1] - py);
    if (dy < byd) { byd = dy; by = r; }

/**
 * Where two rays cross, or `null` if they are too near parallel to trust.
 *
 * The tolerance is on the cross product of the directions: as two rays approach parallel their
 * meeting point runs away to infinity, and a "snap" that teleports the corner off the floor is
 * worse than no snap.

  if (Math.abs(den) < 0.05) return null;             // ~3° apart or less
  const t = ((a2[0] - a1[0]) * d2[1] - (a2[1] - a1[1]) * d2[0]) / den;

/** How far from the cursor an intersection may land before it stops being a snap. */

/**
 * Where the point should actually go, and what to draw to explain it.
 *
 * `anchors` is a list of `{ at, bases }` — a corner to measure from, and the wall bearings to
 * measure against. **Two of them is the interesting case** (Olcay, 2026-08-16: *"snapping and
 * highlighting to the next node's 90 degree … Before and after 90 degree?"*): the corner before the
 * one being dragged, and the corner after it. Each offers a ray; when both catch, the point goes to
 * **where the two rays cross** — the single position that squares the outline at *both* ends at
 * once, which neither guide could have found alone and no amount of aiming would reliably hit.
 *

 * alignment is preferred — on a floor plan, agreeing with the room next door matters more than a
 * round number of degrees — and a tight angle guide is the fallback when nothing lines up.

  const asGuide = a => ({ kind: "angle", deg: a.deg, rel: a.rel, from: a.from });
  // One anchor may still be passed as a bare point, with its bases alongside — the cut does that.
  const list = !anchors ? []
    : Array.isArray(anchors[0]) || typeof anchors[0] === "number"
      ? [{ at: anchors, bases }]
      : anchors;

    const hits = list
      .map(an => bestAngleGuide(an.at[0], an.at[1], px, py, GUIDE_STEP_SNAP, GUIDE_WIDE_TOLS, an.bases))
      .filter(Boolean);
    if (hits.length >= 2) {
      const dir = g => [Math.cos(g.deg * Math.PI / 180), Math.sin(g.deg * Math.PI / 180)];
      const X = rayIntersect(hits[0].from, dir(hits[0]), hits[1].from, dir(hits[1]));
      if (X && Math.hypot(X[0] - px, X[1] - py) <= GUIDE_CROSS_PX)
        return { x: X[0], y: X[1], guides: hits.map(asGuide), crossed: true };
    }
    if (hits.length) return { x: hits[0].x, y: hits[0].y, guides: [asGuide(hits[0])] };
  }
  const al = alignGuides(px, py, refs, GUIDE_ALIGN_PX);
  for (const g of al) {
    if (g.axis === "x") out.x = g.ref[0]; else out.y = g.ref[1];
    out.guides.push({ kind: "align", axis: g.axis, ref: g.ref });
  }
  if (!al.length && list.length) {
    // Unmodified, the same two-ray crossing is still allowed — it just has to be earned at the
    // tight tolerance rather than handed over by the modifier.
    const hits = list
      .map(an => bestAngleGuide(an.at[0], an.at[1], px, py, GUIDE_STEP_FREE, GUIDE_TOLS, an.bases))
      .filter(Boolean);
    if (hits.length >= 2) {
      const dir = g => [Math.cos(g.deg * Math.PI / 180), Math.sin(g.deg * Math.PI / 180)];
      const X = rayIntersect(hits[0].from, dir(hits[0]), hits[1].from, dir(hits[1]));
      if (X && Math.hypot(X[0] - px, X[1] - py) <= GUIDE_CROSS_PX)
        return { x: X[0], y: X[1], guides: hits.map(asGuide), crossed: true };
    }
    if (hits.length) { out.x = hits[0].x; out.y = hits[0].y; out.guides.push(asGuide(hits[0])); }
  }
  return out;
}
/* GUIDE-ENGINE-END */

/** Screen bearing of a→b, in degrees, or null for a degenerate edge. */
function geomBearing(a, b) {
  if (!a || !b) return null;
  const dx = b[0] - a[0], dy = b[1] - a[1];
  if (Math.hypot(dx, dy) < 1e-6) return null;
  return Math.atan2(dy, dx) * 180 / Math.PI;
}

/**
 * The two anchors a dragged corner is guided from: **the corner before it and the corner after it**,
 * each measured against the wall that meets it.
 *
 * ⚠️ Both, not one. The first version put every ray on the *previous* corner and merely used the
 * next wall as a bearing — which offers "square to the wall behind you" and can never offer "square
 * to the wall ahead", because that right angle lives at the *other* corner. A ray from each is what
 * makes both reachable, and what lets `resolveGuides` cross them: the one position that squares the
 * outline at both ends at once.
 *

 * has something to square to.

function geomVertexAnchors(ring, ci, gridDeg) {

  const at = i => ring[((i % n) + n) % n];
  const grid = typeof gridDeg === "number" ? [gridDeg] : [];
  const out = [];
  // Before: a ray from the previous corner, square to the wall arriving at it.
  const before = geomBearing(at(ci - 2), at(ci - 1));
  out.push({ at: at(ci - 1), bases: (before === null ? [] : [before]).concat(grid) });
  // After: a ray from the next corner, square to the wall leaving it.
  const after = geomBearing(at(ci + 1), at(ci + 2));
  out.push({ at: at(ci + 1), bases: (after === null ? [] : [after]).concat(grid) });

/**
 * Corners worth lining up with: every other feature's, from the snap index, plus this feature's own.
 *
 * Read back out of the index rather than collected again — it already holds exactly these points,
 * and gathering them twice is two chances to disagree.
 */
function geomGuideRefs(idx, ownScreen) {
  const out = [];
  if (idx) for (const arr of idx.g.values()) for (const it of arr) if (it.v) out.push(it.v);
  for (const ring of ownScreen || []) for (const p of ring) out.push(p);
  return out;
}

/** Every other feature's corners AND edges on screen, indexed. Built once per gesture. */
function geomSnapIndex() {
  if (!GEOM || !GEOM.snap) return null;
  const verts = [], segs = [];
  const seen = new Set();
  try {
    for (const f of map.queryRenderedFeatures()) {
      const fid = f.properties && f.properties.fid;
      // The same feature comes back once per tile it touches; indexing it twice is pure cost.
      if (!fid || fid === GEOM.fid || seen.has(fid) || !f.geometry) continue;
      seen.add(fid);
      for (const r of ringsOuter(f)) {
        let prev = null;
        for (const c of r) {
          const p = map.project(c);
          verts.push([p.x, p.y]);
          if (prev) segs.push([prev.x, prev.y, p.x, p.y]);
          prev = p;
        }
      }
    }

  // One line per gesture. If `edges` is ever 0 while `corners` is not, the fault is in the geometry
  // this reads, not in the index — they are built in the same loop from the same rings.
  console.info("[snap] index:", seen.size, "features,", verts.length, "corners,", segs.length, "edges");
  return buildSnapIndex(verts, segs, Math.max(SNAP_PX, 24));
}

/* ── transform: rotate and scale by handle ─────────────────────────────────────
   Replaced four stepped toolbar buttons (⟲ ⟳ ±5%) on 2026-08-16 — Olcay: *"Instead of adding
   multiple rotation and scale buttons use control points and shortcuts … if shift or option is
   pressed while rotating it snaps to every 5 deg. otherwise free."*

   The buttons could only ever offer the increments somebody had guessed in advance; a handle offers
   every angle, and the modifier gives the repeatable ones back on demand. Note the polarity: FREE is
   the default and the modifier CONSTRAINS, which is the way round Olcay asked for — the opposite of
   tools that snap unless told otherwise. */

/**
 * The transform box, in SCREEN space — **oriented to the shape's own grid, not to the screen's**.
 *
 * Olcay, 2026-08-16: *"Can we hug the geometry much better instead of putting the control points
 * relative to the view?"* It was an axis-aligned bounding box, which is fine for a room that
 * happens to sit square to north and badly wrong for every other one: a floor plan rotated 30° gets
 * a box far larger than itself, and its handles sit out in the corridor with nothing under them.
 * The corner you reach for should be *on the shape*.
 *
 * The angle is `dominantAngle` — the very measure Straighten squares onto — so the box lines up
 * with the walls rather than with a guess.
 *
 * Returns the four corners in order, plus the centre, which is all the rest of the transform needs:
 * rotate and scale both work about that centre and are indifferent to how the box is turned.
 */
function geomBox() {
  if (!GEOM || GEOM.kind !== "area" || !GEOM.rings.length) return null;
  const rings = GEOM.rings.map(r => r.map(c => { const p = map.project(c); return [p.x, p.y]; }));
  const pts = [].concat(...rings);
  if (!pts.length) return null;

  const raw = dominantAngle(rings.map(r => (r.length && r[0] !== r[r.length - 1]) ? r.concat([r[0]]) : r));
  const th = unwrapGrid(raw, GEOM.boxTheta);
  GEOM.boxTheta = th;

}

/* BOX-ENGINE-START — extracted and tested by scratch/geometry.test.mjs; keep DOM- and map-free. */

/**
 * Keep a grid angle on the same branch as the one before it.
 *
 * ⚠️ **Without this the transform box flips 90° mid-rotation.** `dominantAngle` is a *grid* angle —
 * modulo 90°, because a rectangle's edges are. Turn a room past 45° and the raw answer jumps to the
 * other side of zero. The rectangle it describes is the same one, but its width and height swap, so
 * the rotate knob teleports to a different edge while you are still dragging it. Choosing the
 * representative nearest the previous angle is continuous through the wrap and costs nothing.
 */
function unwrapGrid(raw, prev) {
  if (typeof prev !== "number") return raw;
  return raw + Math.round((prev - raw) / (Math.PI / 2)) * (Math.PI / 2);
}

/**
 * The smallest box **at angle `th`** containing `pts`, padded, as four corners and a centre.
 *
 * The padding is applied in the box's own frame, so it is even around the *shape* rather than even
 * around the screen — which is the whole difference between a box that hugs and a box that merely
 * contains.
 */
function orientedBox(pts, th, pad, stem) {
  const cos = Math.cos(th), sin = Math.sin(th);
  let u0 = Infinity, v0 = Infinity, u1 = -Infinity, v1 = -Infinity;
  for (const p of pts) {
    const u = p[0] * cos + p[1] * sin, v = -p[0] * sin + p[1] * cos;
    if (u < u0) u0 = u;
    if (u > u1) u1 = u;
    if (v < v0) v0 = v;
    if (v > v1) v1 = v;

  if (!isFinite(u0)) return null;
  u0 -= pad || 0; v0 -= pad || 0; u1 += pad || 0; v1 += pad || 0;
  const back = (u, v) => [u * cos - v * sin, u * sin + v * cos];
  const mid = (u0 + u1) / 2;
  const c = back(mid, (v0 + v1) / 2);
  return {
    th,
    cx: c[0], cy: c[1],
    w: u1 - u0, h: v1 - v0,
    // Clockwise from the box's own top-left, in its own frame — the order the handles are drawn in.
    corners: [back(u0, v0), back(u1, v0), back(u1, v1), back(u0, v1)],
    // The midpoint of the box's top edge, and the knob out along that edge's own outward normal.
    topMid: back(mid, v0),
    knob: back(mid, v0 - (stem || 0)),

/**
 * The resize cursor that actually points along a handle's direction.
 *
 * Once the box can be turned, `nwse` on the top-left is a lie for most angles — the handle sits
 * where the shape put it, and the cursor should agree with the eye rather than with the box's
 * abstract corner names. Symmetric about 180°, because a resize arrow is double-headed.

function geomResizeCursor(dx, dy) {

  if (a < 67.5) return "nwse";
  if (a < 112.5) return "ns";
  return "nesw";

/** How far the box's furniture sits outside the outline, so a handle never covers a corner. */
const BOX_PAD = 12;
/** The rotate knob's stem length above the top edge. */
const BOX_STEM = 26;
/** What the modifier snaps to: whole degrees of turn, and whole percents of size. */
const SNAP_DEG = 5;
const SNAP_PCT = 0.05;

const geomSnapping = e => !!(e && (e.shiftKey || e.altKey));

  let x = d % 360;
  if (x > 180) x -= 360;
  if (x <= -180) x += 360;
  return x;
}

/**
 * Straighten — drop vertices that already sit (nearly) on the line between their neighbours.
 *
 * Perpendicular distance in SCREEN space against a fixed tolerance, so "nearly straight" means what
 * it looks like rather than what it measures in degrees of longitude. Never takes a ring below
 * three points.
 */
/* ── combine: bridge and stitch ────────────────────────────────────────────────
   Olcay, 2026-08-16: *"user selects two or more features to combine, edge case is we should fill
   the small gaps like walls"*.

   ⚠️ **A general polygon union is not what this needs, and reaching for one would be the hack.**
   Two rooms separated by a wall are **disjoint** — there is nothing to union. What is wanted is to
   bridge the wall and make one room, and that is a different and much better-conditioned problem:
   find the pair of facing edges within the gap, cut both rings at the bridge feet, and walk
   A → bridge → B → bridge → home. Exact, and it avoids the degeneracies — shared edges, vertices
   lying on edges — that make Greiner-Hormann treacherous in exactly the geometry adjacent rooms
   occupy.

   **The limit, stated rather than discovered:** one bridge per pair. Two rooms facing each other
   across *two* separate openings join along the widest. Genuinely overlapping polygons would need a
   real union; walled rooms are not that. */

/* COMBINE-ENGINE-START — extracted and tested by scratch/geometry.test.mjs; DOM- and map-free.
   Depends on `ringOpen`, `ringClose` and `ringSignedArea` from the split engine. */


/** How finely an edge is sampled to find where it faces another. 1/48 of an edge is under 2%. */
const BRIDGE_SAMPLES = 48;

/**
 * Where two rings should be bridged, or `null` if nothing is near enough.
 *
 * Every edge of A against every edge of B. The **widest** facing pair wins rather than the nearest:
 * a doorway and a wall may both be within the threshold, and joining through the doorway is what
 * somebody meant.
 *
 * ⚠️ It returns the **span** `t0…t1` along A's edge that faces B, not just the closest point.
 * That span is the doorway, and the whole difference between a join that *fills* the gap and one
 * that merely touches across it — see `bridgeRings`.
 */
function findBridge(ringA, ringB, maxGap) {
  const A = ringOpen(ringA), B = ringOpen(ringB);
  let best = null;
  for (let i = 0; i < A.length; i++) {
    const a1 = A[i], a2 = A[(i + 1) % A.length];
    const ax = a2[0] - a1[0], ay = a2[1] - a1[1];
    const alen = Math.hypot(ax, ay);
    if (alen < 1e-9) continue;
    for (let j = 0; j < B.length; j++) {
      const b1 = B[j], b2 = B[(j + 1) % B.length];
      // How much of the edge pair runs side by side at less than the gap — the opening's width.
      let t0 = null, t1 = null;
      for (let k = 0; k <= BRIDGE_SAMPLES; k++) {
        const t = k / BRIDGE_SAMPLES;
        const px = a1[0] + ax * t, py = a1[1] + ay * t;
        const q = segClosest(px, py, b1[0], b1[1], b2[0], b2[1]);
        if (Math.hypot(q[0] - px, q[1] - py) > maxGap) continue;
        if (t0 === null) t0 = t;
        t1 = t;
      }
      if (t0 === null) continue;
      /**
       * ⚠️ **A doorway is never allowed to be zero-width.** Two rooms meeting only at a corner
       * produce a single sample, and a bridge with no width is exactly the seam this rewrite
       * exists to remove — the join would be a slit rather than a room. Widened to the gap
       * threshold about its own middle, and clipped to the edge.
       */
      const least = Math.min(1, maxGap / alen);
      if (t1 - t0 < least) {
        const mid = Math.min(1 - least / 2, Math.max(least / 2, (t0 + t1) / 2));
        t0 = mid - least / 2;
        t1 = mid + least / 2;
      }
      const width = (t1 - t0) * alen;
      if (!best || width > best.width) best = { i, j, t0, t1, width };

}

/**
 * Join two disjoint rings into one, bridging the gap between them.
 *
 * Returns a single closed ring, or `null` when there is nothing close enough to bridge — which the
 * caller must report rather than silently returning one of the inputs.
 *
 * The stitch inserts the bridge feet as real corners, walks the rest of A forward from its foot,
 * crosses to B, walks all of B, and crosses back. Winding is normalised first so the two rings are
 * traversed the same way round; mixing them produces a figure-of-eight.

   * ⚠️ **Winding is normalised BEFORE the bridge is found, not after.** The first version searched
   * the originals, reversed them, and searched again so the indices would still line up — twice the
   * work, and two chances for the two searches to disagree about which opening was widest. Reverse
   * first and there is one search and one answer.

  const sameWinding = r =>
    ringSignedArea(ringOpen(r)) < 0 ? ringOpen(r).slice().reverse() : ringOpen(r).slice();
  const A = sameWinding(ringA), B = sameWinding(ringB);
  const br = findBridge(ringClose(A), ringClose(B), maxGap);
  if (!br) return null;
  const { i, j, t0, t1 } = br;

  /**
   * The doorway's two feet on each side. **Both ends, not the nearest point** — this is the change
   * that made Combine produce one room instead of two rooms joined by a seam (Olcay, 2026-08-16:
   * *"Combine should make 1 geometry by filling in between neatly"*).
   *
   * With both rings wound the same way, two facing edges necessarily run in *opposite* directions,
   * so walking B forward from `Q0` arrives back at `Q1` — which is what makes the walk below one
   * simple loop rather than a figure-of-eight.
   */
  const a1 = A[i], a2 = A[(i + 1) % A.length];
  const at = t => [a1[0] + (a2[0] - a1[0]) * t, a1[1] + (a2[1] - a1[1]) * t];
  const b1 = B[j], b2 = B[(j + 1) % B.length];

  for (let k = 1; k <= A.length; k++) out.push(A[(i + k) % A.length].slice());
  out.push(P0.slice());                         // …up to the doorway's near jamb
  out.push(Q0.slice());                         // across the gap onto B
  for (let k = 1; k <= B.length; k++) out.push(B[(j + k) % B.length].slice());
  out.push(Q1.slice());                         // back along B's edge to the far jamb
  out.push(P1.slice());                         // and across again; the ring closes along A's edge

  // Drop any point that repeats its predecessor — a jamb often lands exactly on a corner.
  const clean = out.filter((p, k) => k === 0 ||

  while (clean.length > 1 &&

  return ringClose(clean);

 *

 * until nothing is close enough. Whatever could not be reached comes back separately — three rooms
 * where one is across the building should give two results, not one impossible one.
 */

  let joined = 0;

    let best = null;
    for (let a = 0; a < pool.length; a++) {

  // edges. Checking one direction only is the classic way to miss a T-junction.
  const scan = (P, Q) => {
    for (const p of P) {
      for (let i = 0; i + 1 < Q.length; i++) {

 * dependence on the order the features happened to be clicked in, which is invisible afterwards.
 * Ties go to the earlier set, which is the feature already open.

/**
 * Does this feature lie **between** the features being combined?
 *
 * ⚠️ Deliberately NOT "is it inside the combined ring". The stitch bridges through the *nearest*
 * facing points, so the joined outline swallows a wedge of the gap rather than the whole of it —
 * a wall in the opening is only partly enclosed, and a point-in-polygon test would answer "no" for
 * exactly the walls this is for.
 *
 * Between is the thing that is actually meant, and it is directly testable: anything that comes
 * within the gap threshold of **two or more** of the combined features is standing between two of
 * them. Something on the outside edge touches one and stays.
 *
 * ⚠️ Named for the test, not for walls. It judged only `mainType === "wall"` until 2026-08-16, and
 * the old name outlived that by long enough to be misleading — a threshold or a strip of
 * circulation space between two rooms is just as much in the way.
 */
function liesBetween(wallRings, sets, maxGap) {
  let touching = 0;
  for (const set of sets) {
    let near = false;
    for (const w of wallRings) {
      for (const r of set) if (ringGap(w, r) <= maxGap) { near = true; break; }
      if (near) break;
    }
    if (near && ++touching >= 2) return true;
  }
  return false;
}
/* COMBINE-ENGINE-END */

/* ── straighten: square the shape up ───────────────────────────────────────────
   Olcay, 2026-08-16: *"Straighten should normalize should rectangularize or circularize or similar
   shapefy drawings."*

   Rooms are rectilinear. A traced or auto-extracted floor plan is not — its corners land at 88° and
   91°, and every one of those is visible once the plan is drawn over a real building. This pulls a
   shape onto its OWN grid: it finds the direction the shape is already mostly built on, and brings
   the edges that are nearly aligned with it exactly onto it.

   ⚠️ **It squares to the shape's own angle, not to north.** A concourse at 23° to the compass is
   still a rectilinear concourse, and snapping it to the screen axes would be vandalism.

   ⚠️ **Edges that are genuinely diagonal are left alone.** Only edges within `tolDeg` of the grid
   are moved, so a chamfered corner or an angled wall survives — squaring must not invent a
   right angle the building does not have. Circularize is a different operation on a different kind
   of shape and is deliberately not folded in here; see the hand-off. */

/* SQUARE-ENGINE-START — extracted and tested by scratch/geometry.test.mjs; keep DOM- and map-free.
   Depends on `ringOpen` from the split engine, which the harness extracts alongside it. */

/**
 * The direction the shape is mostly built on, folded into a quarter turn and weighted by length.
 *
 * Multiplying by 4 is what does the folding: edges 90° apart land on the same bearing once the
 * circle has been gone round four times, so opposite walls of a room reinforce each other instead
 * of cancelling out. Weighted by length because a long wall says more about a building's grid than
 * a 20cm jog does.
 */
function dominantAngle(rings) {
  let sx = 0, sy = 0;
  for (const r of rings) {
    const open = ringOpen(r);
    for (let i = 0; i < open.length; i++) {
      const a = open[i], b = open[(i + 1) % open.length];
      const dx = b[0] - a[0], dy = b[1] - a[1];
      const len = Math.hypot(dx, dy);
      if (len < 1e-9) continue;
      const ang = Math.atan2(dy, dx) * 4;
      sx += Math.cos(ang) * len;
      sy += Math.sin(ang) * len;
    }
  }
  if (!sx && !sy) return 0;
  return Math.atan2(sy, sx) / 4;
}

/**
 * Square every near-axis edge onto the shape's own grid.
 *
 * Relaxation rather than one pass: a corner belongs to two edges, and satisfying one by moving the
 * corner would break the other. Each pass moves both ends of an edge HALF way onto the line they
 * should share, so the two demands on a corner meet in the middle and converge instead of fighting.
 */
function squareRings(rings, tolDeg, passes) {
  const theta = dominantAngle(rings);
  const rot = (p, c, s) => [p[0] * c - p[1] * s, p[0] * s + p[1] * c];
  const ci = Math.cos(-theta), si = Math.sin(-theta);
  const work = rings.map(r => ringOpen(r).map(p => rot(p, ci, si)));
  const tol = Math.tan(Math.max(0, tolDeg) * Math.PI / 180);
  for (let pass = 0; pass < passes; pass++) {
    for (const ring of work) {
      const n = ring.length;
      for (let i = 0; i < n; i++) {
        const a = ring[i], b = ring[(i + 1) % n];
        const dx = Math.abs(b[0] - a[0]), dy = Math.abs(b[1] - a[1]);
        if (dx < 1e-12 && dy < 1e-12) continue;
        if (dy <= dx * tol) {                    // near-horizontal in the local frame
          const m = (a[1] + b[1]) / 2;
          a[1] += (m - a[1]) * 0.5;
          b[1] += (m - b[1]) * 0.5;
        } else if (dx <= dy * tol) {             // near-vertical
          const m = (a[0] + b[0]) / 2;
          a[0] += (m - a[0]) * 0.5;
          b[0] += (m - b[0]) * 0.5;
        }
      }
    }
  }
  const cb = Math.cos(theta), sb = Math.sin(theta);
  return work.map(r => {
    const out = r.map(p => rot(p, cb, sb));
    out.push(out[0].slice());
    return out;
  });
}
/* SQUARE-ENGINE-END */

/** Square the feature up, in screen space so "nearly aligned" means what it looks like. */
function geomSquare() {
  if (!GEOM || GEOM.kind !== "area" || !GEOM.rings.length) return;
  const scr = GEOM.rings.map(r => r.map(c => { const p = map.project(c); return [p.x, p.y]; }));
  const out = squareRings(scr, 20, 60);
  geomPush();
  GEOM.rings = out.map(r => r.map(([x, y]) => {
    const q = map.unproject([x, y]);
    return [q.lng, q.lat];
  }));
  // Corner count is unchanged, so the selection still points at the same corners.
  geomDraw(); post("geomstate", geomState());
}

function geomSimplify() {
  if (!GEOM || GEOM.kind !== "area") return;
  const TOL = 2.5;
  geomPush();
  GEOM.rings = GEOM.rings.map(r => {
    const open = r.slice(0, -1);            // the closing point is the first one again
    if (open.length <= 3) return r;
    /**
     * ⚠️ **Every vertex is tested, including the first.** This used to skip `i === 0` and
     * `i === r.length - 1` outright — which is right for the *closing* point but wrong for the
     * first, whose neighbours are the last real vertex and the second. A redundant corner that
     * happened to be vertex 0 could never be straightened away, and since a ring's start is
     * arbitrary, which corner that was is pure luck.
     */
    const n = open.length;
    const keep = open.filter((c, i) => {
      const a = map.project(open[(i - 1 + n) % n]);
      const b = map.project(c);
      const d = map.project(open[(i + 1) % n]);
      const len = Math.hypot(d.x - a.x, d.y - a.y) || 1;
      const dist = Math.abs((d.x - a.x) * (a.y - b.y) - (a.x - b.x) * (d.y - a.y)) / len;
      return dist > TOL;
    });
    if (keep.length < 3) return r;
    return keep.concat([keep[0].slice()]);
  });
  // Dropping corners renumbers the rest — see geomClearSel for why pruning would be worse.
  geomClearSel();
  geomDraw(); post("geomstate", geomState());
}

/* ── split ─────────────────────────────────────────────────────────────────────────────────── */

/**
 * Cut a feature's rings with a straight line.
 *
 * This is the operation that was recorded as unbuilt until 2026-08-15, on the grounds that a
 * convex-only version silently mangles a real floor plan. The bar was: walk the ring, insert every
 * intersection, and re-assemble valid rings — **for concave shapes, with multiple crossings**. That
 * is what this does, and `scratch/split-engine.test.mjs` extracts this exact code out of this file
 * and proves it on a U cut across both arms, an L, a cut through a vertex, a tangent touch, a cut
 * that misses, and a multi-ring feature.
 *
 * **A straight cut, not a freehand polyline.** A floor is divided by walls, and a wall is straight;
 * a polyline cut buys generality nobody asked for and brings self-intersection with it. Two clicks.
 *
 * **Holes are already gone before we get here.** `ringsOuter()` takes `coordinates[0]` only, so
 * every ring in `GEOM.rings` is a simple outer ring and each can be cut independently. If interior
 * rings ever reach the editor this needs revisiting — a hole straddling the cut belongs to both
 * halves and neither of them is a simple ring any more.
 *
 * Everything here is plane arithmetic in SCREEN pixels, like `geomRotate`/`geomScale`/
 * `geomStraighten` — the caller projects on the way in and unprojects on the way out. Doing it in
 * lng/lat would make "the same distance" mean two different things along the two axes.
 */
/* SPLIT-ENGINE-START — the harness extracts everything between these markers and runs it in node,
   so the code under test is literally the code that ships. Keep it free of `map` and of the DOM. */
function ringSignedArea(pts) {
  let s = 0;
  for (let i = 0; i < pts.length; i++) {
    const p = pts[i], q = pts[(i + 1) % pts.length];
    s += p[0] * q[1] - q[0] * p[1];
  }
  return s / 2;
}

/** A ring with its closing point dropped — the arithmetic below wants each vertex exactly once. */
function ringOpen(ring) {
  const pts = ring.slice();
  while (pts.length > 1 &&
         pts[0][0] === pts[pts.length - 1][0] && pts[0][1] === pts[pts.length - 1][1]) pts.pop();
  return pts;
}

/** …and back, closed the way every other ring in this file is. */
function ringClose(pts) {
  const out = pts.map(p => p.slice());
  out.push(out[0].slice());
  return out;
}

/**
 * Split ONE ring by the line through `a`→`b`.
 *
 * Returns `{ left, right }` of open point arrays; `null` when the line simply does not cut this
 * ring (the caller then keeps it whole); or `{ tangent: true }` when the line both cuts the ring
 * AND touches it somewhere without crossing — see the refusal note in step 2.
 */
function splitOneRing(ring, a, dx, dy, len) {
  const pts = ringOpen(ring);
  const n = pts.length;
  if (n < 3) return null;

  // Distance-from-the-line, scaled by `len` so the tolerance below reads in pixels.
  const cross = p => dx * (p[1] - a[1]) - dy * (p[0] - a[0]);
  const ON = 1e-6 * len;
  const sideOf = p => { const c = cross(p); return Math.abs(c) <= ON ? 0 : (c > 0 ? 1 : -1); };

  /* 1. Augment the ring: every strict crossing becomes a real vertex sitting on the line. A vertex
        that is already on the line needs no insertion — it is its own node. */
  const nodes = [];
  for (let i = 0; i < n; i++) {
    const p = pts[i], q = pts[(i + 1) % n];
    const sp = sideOf(p), sq = sideOf(q);
    nodes.push({ p: p.slice(), s: sp });
    if (sp !== 0 && sq !== 0 && sp !== sq) {
      const cp = cross(p), cq = cross(q);
      const t = cp / (cp - cq);
      nodes.push({ p: [p[0] + (q[0] - p[0]) * t, p[1] + (q[1] - p[1]) * t], s: 0 });
    }
  }
  const nn = nodes.length;

  /* 2. Which on-line nodes are genuine CROSSINGS? A vertex that touches the line and goes back the
        way it came is not one, and counting it would pair the chords wrongly and shred the shape.
        Consecutive on-line nodes (an edge lying along the cut) are one run, judged as a whole by
        the sides either end of it. */
  const isCross = new Array(nn).fill(false);
  let touches = false;
  if (!nodes.some(nd => nd.s !== 0)) return null;      // the whole ring lies on the line
  for (let i = 0; i < nn; i++) {
    if (nodes[i].s !== 0) continue;
    if (nodes[(i - 1 + nn) % nn].s === 0) continue;    // not the first node of its run
    let last = i;
    while (nodes[(last + 1) % nn].s === 0) last = (last + 1) % nn;
    const before = nodes[(i - 1 + nn) % nn].s;
    const after = nodes[(last + 1) % nn].s;
    // The run's LAST node carries the crossing; the earlier ones stay ordinary boundary points.
    // They sit on the line, so whichever face they land in they add no area to it.
    if (before !== after) isCross[last] = true;
    else touches = true;
  }

  const crossIdx = [];
  for (let i = 0; i < nn; i++) if (isCross[i]) crossIdx.push(i);
  // A simple closed ring meets a straight line an even number of times. An odd count means the
  // tolerance has swallowed something; refusing beats returning a shape nobody can trust.
  if (crossIdx.length < 2 || crossIdx.length % 2) return null;
  /**
   * ⚠️ **A cut that also grazes the shape is refused, not guessed at.**
   *
   * Step 4 pairs crossings by assuming they alternate inside/outside along the line. A point where
   * the ring merely TOUCHES the line breaks that alternation without announcing itself: lay a cut
   * exactly along the inner edge of a U and the pairing joins the two arms straight through the
   * notch, producing a ring that touches itself — area-correct, and complete nonsense as a room.
   * Handling every tangency exactly is a lot of machinery for a case a user hits by accident,
   * about one pixel wide. Refusing costs them a nudge and can never mangle a floor plan.
   */
  if (touches) return { tangent: true };
  const K = crossIdx.length;

  /* 3. Arcs — the ring path from one crossing to the next. Each is used exactly once below. */
  const arcAt = new Map();
  crossIdx.forEach((idx, k) => arcAt.set(idx, k));
  const arcs = [];
  for (let k = 0; k < K; k++) {
    const start = crossIdx[k], end = crossIdx[(k + 1) % K];
    const run = [];
    let i = start;
    do { run.push(nodes[i].p); i = (i + 1) % nn; } while (i !== end);
    arcs.push(run);
  }

  /* 4. Chords — the stretches of the cut line that lie INSIDE the ring. Sorted along the line the
        crossings alternate in/out, so consecutive pairs are exactly the inside stretches. This is
        the step that makes concave shapes work: a U cut across both arms has four crossings and
        two chords, and pairing them any other way would join the wrong arms. */
  const along = i => (nodes[i].p[0] - a[0]) * dx + (nodes[i].p[1] - a[1]) * dy;
  const order = crossIdx.slice().sort((i, j) => along(i) - along(j));
  const mate = new Map();
  for (let k = 0; k + 1 < order.length; k += 2) {
    mate.set(order[k], order[k + 1]);
    mate.set(order[k + 1], order[k]);
  }

  /* 5. Trace the faces: follow an arc, hop its end across the chord, follow the arc that starts on
        the far side, and keep going until the arcs bring you home. */
  const used = new Array(K).fill(false);
  const faces = [];
  for (let k0 = 0; k0 < K; k0++) {
    if (used[k0]) continue;
    const face = [];
    let k = k0, guard = 0, ok = true;
    while (!used[k]) {
      used[k] = true;
      for (const p of arcs[k]) face.push(p);
      const end = crossIdx[(k + 1) % K];
      face.push(nodes[end].p);
      const m = mate.get(end);
      const next = m === undefined ? undefined : arcAt.get(m);
      if (next === undefined || ++guard > K) { ok = false; break; }
      k = next;
    }
    if (ok && face.length >= 3) faces.push(face);
  }

  /* 6. Which side did each face land on? Read it off the vertex furthest from the line — the ones
        sitting ON it say nothing, and every face has at least one that does not. */
  const left = [], right = [];
  for (const face of faces) {
    if (Math.abs(ringSignedArea(face)) < 1e-6) continue;   // a sliver on the line, not a piece
    let far = 0;
    for (const p of face) { const c = cross(p); if (Math.abs(c) > Math.abs(far)) far = c; }
    if (Math.abs(far) <= ON) continue;
    (far > 0 ? left : right).push(face);
  }
  if (!left.length || !right.length) return null;          // touched, not cut
  return { left, right };
}

/**
 * Split every ring of a feature by the line through `a`→`b`.
 *
 * Returns `{ ok: false, reason }` — `"miss"` if the cut does not separate the feature, `"tangent"`
 * if it does but also grazes it, and the fix for that is a nudge — or, on success:
 *
 *     { ok: true, left, right, leftFrom, rightFrom, wasCut }
 *
 * `left`/`right` are closed rings either side of the line. `leftFrom[i]` / `rightFrom[i]` say which
 * INPUT ring each came from, and `wasCut[j]` whether input ring `j` was actually cut — the caller
 * needs both to keep track of which pieces are new, and it cannot reconstruct them from two
 * flattened lists.
 *
 * Rings the line misses entirely are not lost: they travel whole to whichever side they are on,
 * which is what makes this correct for a feature that is already several pieces.
 */
function splitRingsByLine(rings, a, b) {
  const dx = b[0] - a[0], dy = b[1] - a[1], len = Math.hypot(dx, dy);
  if (!(len > 0)) return { ok: false, reason: "miss" };
  const left = [], right = [], leftFrom = [], rightFrom = [], wasCut = [];
  let anyCut = false;
  rings.forEach((ring, j) => {
    const r = splitOneRing(ring, a, dx, dy, len);
    if (r && r.tangent) { wasCut[j] = "tangent"; return; }
    if (r) {
      anyCut = true;
      wasCut[j] = true;
      for (const f of r.left) { left.push(ringClose(f)); leftFrom.push(j); }
      for (const f of r.right) { right.push(ringClose(f)); rightFrom.push(j); }
      return;
    }
    // Untouched — whole, to the side it is on. Judged on its furthest vertex for the same reason
    // as a face: a ring resting a corner on the line is still entirely on one side of it.
    wasCut[j] = false;
    let far = 0;
    for (const p of ringOpen(ring)) {
      const c = dx * (p[1] - a[1]) - dy * (p[0] - a[0]);
      if (Math.abs(c) > Math.abs(far)) far = c;
    }
    if (far > 0) { left.push(ringClose(ringOpen(ring))); leftFrom.push(j); }
    else { right.push(ringClose(ringOpen(ring))); rightFrom.push(j); }
  });
  if (wasCut.some(c => c === "tangent")) return { ok: false, reason: "tangent" };
  if (!anyCut || !left.length || !right.length) return { ok: false, reason: "miss" };
  return { ok: true, left, right, leftFrom, rightFrom, wasCut };
}
/* SPLIT-ENGINE-END */

/**
 * Apply a cut, in lng/lat, and leave the feature holding every piece it now consists of.
 *
 * ⚠️ **No piece inherits the feature's identity, because nothing here can decide which should.**
 * A split says "this is two rooms", and a room needs a name, a type and a row in the tree — but
 * `edits` is keyed by `fid` and every fid comes from Pointr Cloud, so there is no second identity
 * to hand out. An earlier version of this marked one side "part A" and dashed the other; that was
 * the editor quietly answering a product question by which side of the line got clicked first.
 * It now reports the piece COUNT and claims nothing about which is which. The question — does a
 * split create a second feature, or reshape one feature into two parts? — is in the hand-off.
 *
 * Every face out of a cut ring becomes a NEW piece. Not "left keeps its identity": cut a U across
 * both arms and the left side is two separate rooms, so side is not piece and never was.
 */
function geomApplyCut(a, b) {
  if (!GEOM) return false;
  const toScreen = c => { const p = map.project(c); return [p.x, p.y]; };
  const res = splitRingsByLine(GEOM.rings.map(r => r.map(toScreen)),
                               toScreen(a), toScreen(b));
  if (!res.ok) {
    post("geomerror", {
      fid: GEOM.fid,
      message: res.reason === "tangent"
        ? "that cut runs along an edge — move it a little and try again"
        : "that cut does not divide the shape in two",
    });
    return false;
  }
  geomPush();
  const rings = [], pieceOf = [];
  const take = (list, from) => list.forEach((r, i) => {
    const src = from[i];
    rings.push(r.map(([x, y]) => { const q = map.unproject([x, y]); return [q.lng, q.lat]; }));
    // A ring the cut missed carries on being the piece it already was.
    pieceOf.push(res.wasCut[src] ? GEOM.nextPiece++ : GEOM.pieceOf[src]);
  });
  take(res.left, res.leftFrom);
  take(res.right, res.rightFrom);
  GEOM.rings = rings;
  GEOM.pieceOf = pieceOf;
  geomClearSel();                    // the rings are wholly rebuilt; every old index is meaningless
  return true;
}

/**
 * The two clicks that lay a cut.
 *
 * `mouseup` + `isTap`, like every other selection on this map — see the note on the document
 * handler. A press that travelled was a pan, and panning while you line a cut up is exactly what
 * you want to be able to do.
 */
function geomCutClick(lngLat) {
  if (!GEOM || GEOM.mode !== "split") return;
  if (!GEOM.cutA) {
    GEOM.cutA = [lngLat.lng, lngLat.lat];
    GEOM.cutB = [lngLat.lng, lngLat.lat];
    // Gathered once per cut, for the same reason the snap index is: the map holds still between
    // the two clicks, so these screen positions stay true for as long as they are needed.
    const own = GEOM.rings.map(r => r.map(c => { const p = map.project(c); return [p.x, p.y]; }));
    GEOM.cutRefs = geomGuideRefs(geomSnapIndex(), own.map(r => r.slice(0, -1)));
    /**
     * A cut is guided against **the walls it is cutting through**, so it can be laid square to the
     * room rather than square to the screen. Every distinct edge bearing of the shape, plus its
     * dominant grid — a wall you are cutting perpendicular to is usually one you can see.
     */
    const seenB = new Set();
    GEOM.cutBases = [];
    for (const r of own) {
      for (let i = 0; i + 1 < r.length; i++) {
        const b = geomBearing(r[i], r[i + 1]);
        if (b === null) continue;
        const k = Math.round(b * 2) / 2;              // half a degree is as fine as this needs
        if (!seenB.has(k)) { seenB.add(k); GEOM.cutBases.push(b); }
      }
    }
    GEOM.cutBases.push(dominantAngle(own) * 180 / Math.PI);
    geomDraw(); post("geomstate", geomState());
    return;
  }
  const a = GEOM.cutA, b = [lngLat.lng, lngLat.lat];
  GEOM.cutA = GEOM.cutB = null;
  GEOM.cutRefs = null;
  GEOM.cutBases = null;
  GEOM.guides = GEOM.guideAt = null;
  // A refused cut stays in split mode, because the message it just posted says "try again" — being
  // dropped back into Points would contradict it. A cut that landed goes to Points, where the new
  // outlines can be tidied up.
  if (geomApplyCut(a, b)) GEOM.mode = "vertices";
  geomDraw(); post("geomstate", geomState());
}

/** Abandon a half-laid cut, leaving split mode armed for another go. */
function geomCancelCut() {
  if (!GEOM || !GEOM.cutA) return false;
  GEOM.cutA = GEOM.cutB = null;
  GEOM.cutRefs = null;
  GEOM.cutBases = null;
  GEOM.guides = GEOM.guideAt = null;
  geomDraw(); post("geomstate", geomState());
  return true;
}

/* ── combine: the interaction ──────────────────────────────────────────────────
   The geometry is above, behind the COMBINE-ENGINE markers, and was built and tested first. This
   is the half a person touches: arming the mode, picking features, and what happens on Enter.

   Olcay, 2026-08-16: *"user selects two or more features to combine, edge case is we should fill
   the small gaps like walls and remove the combined walls from wall type."* Four decisions were put
   to him before any of it was built, and all four are honoured here — armed selection like Split,
   the largest by area keeps the identity, the interior walls are hidden for the session, and the
   gap threshold is a fixed distance in metres. */

/**
 * ⚠️ **A guess, and the only number in the editor that is one.**
 *
 * 0.6 m is a plausible interior wall. The right way to set it is to hover a real wall on this floor
 * and read its thickness, which needs the signed-in map — see the open question in the hand-off. It
 * is a constant rather than a literal precisely so that answer costs one line when it arrives.
 */
const COMBINE_GAP_M = 0.6;

/**
 * How many screen pixels a metre of ground is, here and now.
 *
 * The engine works in screen space like every other operation in this file, so a threshold given in
 * metres has to be converted per gesture. Measured rather than derived from the zoom: one metre due
 * north of the shape itself, projected, which stays true under rotation and is close enough under
 * pitch for a threshold that is itself a judgement call.
 */
function geomPxPerMetre(anchor) {
  const c = anchor || (() => { const m = map.getCenter(); return [m.lng, m.lat]; })();
  const a = map.project(c), b = map.project([c[0], c[1] + 1 / 111320]);
  const px = Math.hypot(b.x - a.x, b.y - a.y);
  return px > 1e-6 ? px : 1;
}

/**
 * The layer filters a combine has rewritten, so they can be put back exactly.
 *
 * Module-level rather than on `GEOM`, because the restore has to be able to run *after* the editor
 * is gone — `geomEnd` clears the shape and the filters in the same breath.
 */
const HIDDEN_FILTERS = new Map();

/**
 * Rebuild every wall filter from `GEOM.hidden`, from scratch.
 *
 * Restore-then-reapply rather than patch: undo, redo and reset all move `hidden` wholesale, and a
 * function that only ever composes deltas would need to know which direction it was going in. This
 * one is idempotent and needs to know nothing.
 *
 * ⚠️ **The SDK owns these layers.** `MapViewController.updateLayersForCurrentLevel()` rewrites the
 * filter of everything whose id contains `_ptr`, so a hidden wall reappears on a level switch. That
 * is survivable — the level switch closes the editor anyway — but it is why this is composed onto
 * the SDK's own filter rather than replacing it: losing the level filter would draw every floor's
 * walls at once for as long as the editor stayed open.
 */
function geomApplyHiddenFilter() {
  if (!map) return;
  try {
    for (const [id, orig] of HIDDEN_FILTERS)
      if (map.getLayer(id)) map.setFilter(id, orig === undefined ? null : orig);
    HIDDEN_FILTERS.clear();
    /**
     * ⚠️ **TWO sources, one composer** (2026-08-25). Combine hides what stood between the rooms it
     * joined; the review preview hides what the finalised floor will not contain. Both compose onto
     * the SDK's own filters, and giving each its own restore-and-reapply pass would mean whichever
     * ran last silently undid the other. So the fids are unioned here and this stays the only
     * function in the file that touches these filters.
     */
    const g = (GEOM && GEOM.hidden) || { fids: [], layers: [] };
    const h = {
      fids: [...new Set(g.fids.concat(PREVIEW_HIDDEN.fids))],
      layers: [...new Set(g.layers.concat(PREVIEW_HIDDEN.layers))],
    };
    if (!h.fids.length) return;
    /**
     * ⚠️ **`any` of `==`, not `["in", …]`.** `in` is fussy about its needle: a feature in one of
     * these layers with no `fid` at all evaluates it against `null`, which is a type error rather
     * than a miss — and an expression that throws takes the *whole layer* down, so the fix for one
     * hidden wall would be a floor with no walls on it. `==` against null is simply false. There
     * are only ever a handful of walls in here, so the longer expression costs nothing.
     */
    const hide = ["!", ["any", ...h.fids.map(f => ["==", ["get", "fid"], f])]];
    const byId = new Map(map.getStyle().layers.map(l => [l.id, l]));
    for (const id of h.layers) {
      const l = byId.get(id);
      if (!l) continue;
      // Read AFTER the restore above, so what is stored is the SDK's filter and never one of ours.
      HIDDEN_FILTERS.set(id, l.filter);
      map.setFilter(id, l.filter ? ["all", l.filter, hide] : hide);
    }
  } catch (e) {}
}

/**
 * **Whatever is standing between the features being combined**, and the layers drawing it.
 *
 * ⚠️ **Not only walls** (Olcay, 2026-08-16: *"If there is something in between this should remove
 * the item in between."*). It was `mainType === "wall"`, which was the common case and not the
 * rule: a doorway, a threshold, a strip of circulation space between two rooms is just as much in
 * the way, and leaving it behind inside the joined room is the same wrong answer.
 *
 * The test is unchanged and does the work — within the gap threshold of **two or more** of the
 * combined features. At 0.6 m that is a genuinely narrow claim: a POI sitting in the middle of
 * either room comes nowhere near qualifying.
 *
 * ⚠️ **The combined features must be excluded by name.** Each of them is within zero of itself and
 * near at least one other, so it satisfies "between" perfectly — and would hide itself the instant
 * this stopped being restricted to walls.
 *
 * Both halves of the return are needed and only one is obvious: once a feature is filtered out it
 * stops being a rendered feature, so the layer that drew it can never be found again. They are
 * collected together, in the one pass where both are still visible.
 *
 * ⚠️ A feature spanning a tile boundary arrives once per tile with a different piece of its
 * geometry. The verdict is taken from the first piece seen and memoised — enough for something
 * sitting in a wall's width, which is short and lives inside one tile far more often than not.
 */
function geomInteriorFeatures(sets, gapPx, exclude) {
  const skip = new Set(exclude || []);
  const verdict = new Map();
  const named = new Map();
  const layers = new Set();
  try {
    for (const f of map.queryRenderedFeatures()) {
      const p = f.properties;
      if (!p || !p.fid || skip.has(p.fid)) continue;
      if (!verdict.has(p.fid)) {
        const rings = ringsOuter(f)
          .map(r => r.map(c => { const q = map.project(c); return [q.x, q.y]; }));
        verdict.set(p.fid, rings.length ? liesBetween(rings, sets, gapPx) : false);
        /**
         * ⚠️ **Named here or never.** The app has no properties for these — it never clicked them,
         * they are walls and thresholds it was not even offering to select. And the moment they are
         * hidden they stop being rendered features, so this is the last frame in which anything can
         * ask them what they are called.
         */
        named.set(p.fid, { fid: p.fid, name: p.name || "", type: prettyType(p) });
      }
      if (verdict.get(p.fid) && f.layer && f.layer.id) layers.add(f.layer.id);
    }
  } catch (e) {}
  const fids = [], labels = [];
  for (const [fid, yes] of verdict) if (yes) { fids.push(fid); labels.push(named.get(fid)); }
  return { fids, labels, layers: [...layers] };
}

/**
 * Move the editor onto a different feature, and take the panel with it. Returns whether it happened.
 *
 * The app is *told*, not asked. This is not the user switching feature — that path guards against
 * unsaved work, and would greet a combine with "you have unsaved changes", which is both true and
 * completely beside the point. The editor already holds the merged shape; the panel is simply
 * catching up with whose it now is.
 *
 * ⚠️ **The properties travel WITH the identity, in one message, and the switch is refused without
 * them.** They cannot follow in a second message: the app decides the panel is open by testing that
 * its properties and its focus name the same feature, so an identity that arrived first would leave
 * one render where they disagree — and the effect watching that would read it as "no feature is
 * open" and send `end`, destroying the very combine that caused this. One message is one React
 * update. Refusing is the safe failure: the panel stays where it was and the shape is still merged.
 *
 * `skipFocus` stops the camera moving: the app repointing the panel changes `focusFeature`, which
 * would otherwise centre the surviving feature's *published* bounds — moving the map out from under
 * a gesture that has only just finished, to fit a shape that no longer exists.
 */
function geomTakeIdentity(fid) {
  if (!GEOM || GEOM.fid === fid) return false;
  let props = GEOM.propsOf[fid];
  if (!props) { const hit = scanFeature(fid); props = (hit && hit.props) || null; }
  if (!props) return false;
  GEOM.propsOf[fid] = props;
  GEOM.fid = fid;
  GEOM.skipFocus = true;
  post("geomidentity", { fid, props });
  return true;
}

/**
 * The features selected alongside the one being edited, told to the map by the app.
 *
 * ⚠️ **The app owns the selection, not this file** (Olcay, 2026-08-16: *"I should be able to press
 * shift and multi select features"*). It has to: the selection drives the properties panel, the
 * count indicator and the toast, all of which live in React, and a second copy of the truth here
 * would be one more thing to keep in step. This side is asked *"here are the fids"* and answers
 * with what only it can know — their outlines, and whether they can actually be joined.
 *
 * This **replaced Combine's armed pick mode**, built earlier the same day. Arming a mode and then
 * clicking features was a second selection mechanism sitting beside the one the map already had,
 * and it could only ever feed Combine. Shift-click selects features for *everything*; Combine is
 * now simply an act you can perform on a selection, which is why it is a button and not a mode.
 */
function geomSetSelection(fids) {
  if (!GEOM) return;
  const want = (fids || []).filter(f => f && f !== GEOM.fid);
  const have = new Map(GEOM.pick.map(p => [p.fid, p]));
  GEOM.pick = want.map(fid => {
    // Kept rather than re-read: the outline in hand is the one the user has been looking at, and
    // re-querying on every selection change would let a tile reload change it underneath them.
    if (have.has(fid)) return have.get(fid);
    const g = geomFind(fid);
    return {
      fid,
      /**
       * ⚠️ **`kind` is carried, and `null` is a third answer.** A point feature and a feature whose
       * tiles have not loaded both arrive with no rings, and they are not the same problem — one
       * cannot be combined at all, the other merely cannot be combined *yet*. Told apart by name,
       * because Combine's refusal is read by a person deciding what to do next, and "this is a
       * single point" about a room they can see is worse than saying nothing.
       *
       * The outline is kept rather than re-read on every selection change: it is the one the user
       * has been looking at, and re-querying would let a tile reload change it underneath them.
       */
      kind: g ? g.kind : null,
      rings: g && g.kind === "area" ? g.rings : [],
      point: g && g.kind === "point" ? g.point.slice() : null,
    };
  });
  geomDraw();
  post("geomstate", geomState());
}

/**
 * Can everything selected actually be joined, and if not, **why not in words a person can act on**?
 *
 * Olcay, 2026-08-16: *"Combine should activate if there are more than one item selected that are
 * combinable ... If disabled ... Combine should show a custom tooltip explaining why."* A control
 * that is simply grey invites you to work out what you did wrong; the reason is the whole point of
 * disabling it rather than letting it fail.
 *
 * The test is the operation itself — run the engine and see whether one ring comes out. Anything
 * cheaper would be a second, approximate answer that could disagree with the real one, and the
 * disagreement would show up as a button that was enabled and then refused.
 */
function geomCombinable() {
  if (!GEOM) return { ok: false, why: null };
  /**
   * ⚠️ These sentences live in a **tooltip**, which is 244px wide — so they are kept to two or
   * three lines. The first draft ran to five, and a five-line explanation of a greyed-out button is
   * something people dismiss rather than read. Each says the state, the rule, and the number.
   */
  if (!GEOM.pick.length) {
    return { ok: false, why: "Shift-click another feature on the map to combine this one with it." };
  }
  if (GEOM.pick.some(p => p.kind === null)) {
    return { ok: false,
      why: "One of these has not loaded yet — pan so it is on screen, then try again." };
  }
  if (GEOM.kind !== "area" || GEOM.pick.some(p => p.kind !== "area")) {
    return { ok: false, why: "One of these is a single point — a point has no outline to join." };
  }
  try {
    const toScreen = c => { const p = map.project(c); return [p.x, p.y]; };
    const sets = [GEOM.rings].concat(GEOM.pick.map(p => p.rings))
      .map(rs => rs.map(r => r.map(toScreen)));
    const gapPx = COMBINE_GAP_M * geomPxPerMetre(GEOM.rings[0] && GEOM.rings[0][0]);
    const res = combineRings([].concat(...sets), gapPx);
    if (res.rings.length === 1) return { ok: true, why: null };
    /**
     * The engine hands back whatever it could not reach, so the count is exact rather than a guess
     * — and saying the threshold is what turns "no" into something the user can do about it: move
     * the shapes, or pick the neighbour instead of the room across the corridor.
     */
    return {
      ok: false,
      why: "Too far apart. Combine bridges gaps up to " + COMBINE_GAP_M +
           " m — a wall's width — and these fall into " + res.rings.length + " separate groups.",
    };
  } catch (e) {
    return { ok: false, why: "The outlines could not be read just now — try again in a moment." };
  }
}

/**
 * Combine the subject with everything picked.
 *
 * The pieces, in the order they matter:
 *
 * 1. **Everything into screen space**, and the gap threshold with it.
 * 2. **The engine**, which is greedy and order-independent — it joins the widest opening it can
 *    find, over and over, and hands back whatever could not be reached as separate rings.
 * 3. **Refuse a combine that joined nothing**, rather than quietly returning the shape unchanged.
 * 4. **The largest by area keeps the identity**, measured on the shapes as they went in.
 * 5. **The walls between them go**, for the session.
 */
function geomApplyCombine() {
  if (!GEOM) return;
  /**
   * Asked again here rather than trusted from the toolbar's disabled state. The button is one way
   * in and the app's state is a copy that can lag by a frame; the refusal has to live where the
   * operation does, or a stale `combinable` would run a combine the map had already ruled out.
   */
  const can = geomCombinable();
  if (!can.ok) {
    post("geomerror", { fid: GEOM.fid, message: can.why });
    return;
  }
  const toScreen = c => { const p = map.project(c); return [p.x, p.y]; };
  const sets = [GEOM.rings].concat(GEOM.pick.map(p => p.rings))
    .map(rs => rs.map(r => r.map(toScreen)));
  const gapPx = COMBINE_GAP_M * geomPxPerMetre(GEOM.rings[0] && GEOM.rings[0][0]);
  const res = combineRings([].concat(...sets), gapPx);
  if (!res.joined) {
    post("geomerror", { fid: GEOM.fid,
      message: "nothing was close enough to join — they must be within " + COMBINE_GAP_M + " m" });
    return;                                        // still armed: the message says to try again
  }
  geomPush();
  /**
   * ⚠️ **The members are remembered, and that is what makes the result editable afterwards**
   * (Olcay, 2026-08-16: *"removing from the selected list it should update the geometry"*).
   *
   * A combine used to be a one-shot mutation: it produced rings and forgot what they were made of,
   * so the only way back was Undo, all of it at once. Kept as a **composition** — the members and
   * the threshold — the result can be recomputed from a smaller set, which is exactly what taking
   * one row out of the list means.
   *
   * Set *after* `geomPush`, because `geomPush` clears it. That is the whole mechanism for "the
   * shape has been hand-edited since": every other mutation goes through `geomPush` too, so the
   * composition dissolves the moment the rings stop being a function of its members — and the
   * panel's ✕ goes quiet with a reason rather than silently discarding the edit.
   */
  GEOM.combine = {
    members: [{ fid: GEOM.fid, rings: JSON.parse(JSON.stringify(GEOM.rings)) }].concat(
      GEOM.pick.map(p => ({ fid: p.fid, rings: JSON.parse(JSON.stringify(p.rings)) }))),
  };

  /**
   * Measured on the inputs, not on the result. After the stitch there is one ring holding all of
   * them, so there is nothing left to be largest — the question has to be asked before the answer
   * is destroyed.
   */
  const all = [GEOM.fid].concat(GEOM.pick.map(p => p.fid));
  const want = all[largestSet(sets)];
  // `all` is excluded by name: every combined feature is "between" the others by construction.
  const between = geomInteriorFeatures(sets, gapPx, all);

  GEOM.rings = res.rings.map(r =>
    r.map(([x, y]) => { const q = map.unproject([x, y]); return [q.lng, q.lat]; }));
  // One id per surviving ring. Everything that joined is one ring and therefore one piece; anything
  // too far to reach comes back as its own, which is exactly what the piece count should say.
  GEOM.pieceOf = GEOM.rings.map((_, i) => i);
  GEOM.nextPiece = GEOM.rings.length;
  const alreadyHidden = new Set(GEOM.hidden.fids);
  GEOM.hidden = {
    fids: [...new Set(GEOM.hidden.fids.concat(between.fids))],
    labels: GEOM.hidden.labels.concat(between.labels.filter(x => !alreadyHidden.has(x.fid))),
    layers: [...new Set(GEOM.hidden.layers.concat(between.layers))],
  };
  geomApplyHiddenFilter();
  // The switch can decline — see geomTakeIdentity. `GEOM.fid` afterwards is the truth either way,
  // so the absorbed list is built from THAT and never from what was merely wanted; a list that
  // included the feature the panel is actually on would be a lie in the one place it matters.
  geomTakeIdentity(want);
  GEOM.absorbed = [...new Set(GEOM.absorbed.concat(all.filter(f => f !== GEOM.fid)))];

  GEOM.pick = [];
  geomClearSel();                                  // the rings are wholly rebuilt, as after a cut
  /**
   * ⚠️ **The app's selection has to collapse with the map's.** The absorbed features are part of
   * this shape now — leaving them selected would keep them in the panel's "3 features selected"
   * list and in the next metadata edit, writing properties to rows that no longer have an outline
   * of their own. The survivor is the whole selection, and the app is told so.
   */
  post("selectclear", { fid: GEOM.fid });
  // A combine that landed goes back to Reshape, where the new outline can be tidied up — the same
  // place a cut that landed leaves you.
  GEOM.mode = "vertices";
  geomDraw(); post("geomstate", geomState());
  if (res.rings.length > 1) {
    post("geomerror", { fid: GEOM.fid,
      message: res.rings.length + " pieces — some of them were too far apart to join" });
  }
}

/**
 * Rebuild the combined shape from whatever members remain.
 *
 * The composition is the source of truth here, not the rings: recomputing is how removing one row
 * from the list changes the geometry (Olcay, 2026-08-16). One member left is not a combine at all —
 * the shape becomes that feature's own outline again and the composition dissolves.
 */
function geomRecombine() {
  if (!GEOM || !GEOM.combine || !GEOM.combine.members.length) return false;
  const ms = GEOM.combine.members;
  const toScreen = c => { const p = map.project(c); return [p.x, p.y]; };
  const back = ([x, y]) => { const q = map.unproject([x, y]); return [q.lng, q.lat]; };

  if (ms.length === 1) {
    GEOM.rings = JSON.parse(JSON.stringify(ms[0].rings));
    GEOM.pieceOf = GEOM.rings.map((_, i) => i);
    GEOM.nextPiece = GEOM.rings.length;
    GEOM.absorbed = [];
    geomTakeIdentity(ms[0].fid);
    GEOM.combine = null;                 // one feature is not a composition
    return true;
  }

  const sets = ms.map(m => m.rings.map(r => r.map(toScreen)));
  const gapPx = COMBINE_GAP_M * geomPxPerMetre(ms[0].rings[0] && ms[0].rings[0][0]);
  const res = combineRings([].concat(...sets), gapPx);
  GEOM.rings = res.rings.map(r => r.map(back));
  GEOM.pieceOf = GEOM.rings.map((_, i) => i);
  GEOM.nextPiece = GEOM.rings.length;
  // Identity is re-decided, not carried: take the biggest member away and the largest is a
  // different room, so keeping the old winner would leave the panel on a feature that is no longer
  // the one this shape mostly is.
  geomTakeIdentity(ms[largestSet(sets)].fid);
  GEOM.absorbed = ms.map(m => m.fid).filter(f => f !== GEOM.fid);
  return true;
}

/**
 * Take one feature back out of a combined shape.
 *
 * ⚠️ Only while the combine is still a composition. Once the shape has been hand-edited `combine`
 * is null (see `geomPush`) and this refuses rather than recomputing — recomputing would silently
 * discard the edit, and Undo is the honest way back from there.
 */
function geomUncombine(fid) {
  if (!GEOM) return;
  if (!GEOM.combine) {
    post("geomerror", { fid: GEOM.fid,
      message: "The shape has been edited since it was combined — undo to take a feature back out." });
    return;
  }
  const left = GEOM.combine.members.filter(m => m.fid !== fid);
  if (left.length === GEOM.combine.members.length) return;
  geomPush();                              // …which clears `combine`, so it is put back next line
  GEOM.combine = { members: left };
  geomRecombine();
  geomClearSel();
  geomDraw(); post("geomstate", geomState());
}

/**
 * Put back something a combine took off the map.
 *
 * Olcay, 2026-08-16: *"removing the wall removal should bring the wall back. Meaning the user wants
