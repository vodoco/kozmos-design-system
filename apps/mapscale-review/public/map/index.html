<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- This page is an IFRAME: it inherits nothing from the app, so the DS font has to be loaded
     here too. Without it every "Readex Pro" in this file silently fell back — and the SVG
     cluster badges, which ask for `font-family: inherit`, fell all the way to the SVG
     default: serif. -->
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Readex+Pro:wght@400;500;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="https://pointr-websdk.azureedge.net/10.7.1/css/pointr.css" />
<style>
  html, body { margin: 0; height: 100%; width: 100%; background: #eef0f2; overflow: hidden;
               font-family: "Readex Pro", system-ui, sans-serif; }
  #map { position: absolute; inset: 0; }
  /* live greyscale of the WebGL base; highlights live in the SVG overlay on top (kept colour) */
  #map canvas.grey { filter: grayscale(1); }
  /* clean map pane: hide the SDK's own UI chrome (search / level selector / exit / welcome).
     Keep #pointr-loading (the pane's loading state) and the Pointr watermark (licence). */
  #pointr-top, #pointr-bottom, #pointr-welcome-overlay, #pointr-promote-app-overlay,
  #pointr-rating-overlay, #pointr-info-view { display: none !important; }
  /* explicit width/height: an absolutely positioned <svg> with only `inset:0` falls back to its
     300x150 intrinsic size (replaced element), which silently clips every highlight. */
  #hl { position: absolute; top: 0; left: 0; width: 100%; height: 100%; pointer-events: none; z-index: 5; }
  /* the overlay ignores the pointer, but the change shapes themselves take it back so they're
     clickable without stealing pan/zoom anywhere else */
  /* ⚠️ While a geometry gesture is running the pointer is hidden and we draw a crosshair instead.
     It has to be `!important` on a body class covering DESCENDANTS: seven SVG elements (handles,
     midpoints, the rotate knob, the transform face, edge hit-targets) set `cursor:` INLINE, and
     during a drag the pointer is over one of them — so setting the canvas's cursor, which is what
     this first tried, never won. */
  body.geom-drag, body.geom-drag * { cursor: none !important; }
  #hl .hit { pointer-events: auto; cursor: pointer; }
  /* A cluster is clickable too, and `#hl` is `pointer-events: none` — so like `.hit` it has to opt
     back in, or the bubble is painted but nothing can ever hit it (2026-08-11: it silently didn't
     zoom, exactly the trap `#tip` hit before it). */
  #hl .cluster { pointer-events: auto; cursor: zoom-in; }

  /* The card takes the pointer, because it carries the decision control (Olcay, 2026-08-11:
     "how do we change the flags?" — it used to be `pointer-events: none`, so a hover card could
     only ever *report* the decision and the control was unreachable without pinning first). */
  /* Peer cursors. The transition is the whole trick: positions arrive ~20/s, and interpolating
     between them is what turns a stutter into a glide. `will-change` keeps it on the compositor. */
  .peer { position: absolute; top: 0; left: 0; will-change: transform;
          transition: transform .12s linear; display: flex; align-items: flex-start; gap: 4px; }
  .peer-name { transform: translateY(12px); font-size: 10.5px; line-height: 1; color: #fff;
               padding: 3px 6px; border-radius: 999px; white-space: nowrap;
               font-family: 'Readex Pro', system-ui, sans-serif; }
  #tip { position: absolute; z-index: 6; display: none; pointer-events: auto; min-width: 168px; max-width: 260px;
    transform: translate(-50%, calc(-100% - 16px)); background: #fff; color: #1F2328;
    font: 13px/1.45 "Readex Pro", system-ui, sans-serif; border: 1px solid #E7E9EE;
    border-radius: 10px; box-shadow: 0 6px 20px rgba(0,0,0,.16); padding: 10px 12px; }
  #tip::after { content: ""; position: absolute; left: 50%; bottom: -7px; width: 12px; height: 12px;
    margin-left: -6px; background: #fff; border-right: 1px solid #E7E9EE;
    border-bottom: 1px solid #E7E9EE; transform: rotate(45deg); }
  /* Invisible bridge across the 16px the card is offset by. Without it, travelling from the shape
     to the card crosses bare map for a few pixels, the container-level mousemove sees a move that
     is neither on a shape nor on the card, and the hover clears before you arrive — the control
     would retreat every time you reached for it. A pseudo-element hits as its host, so the
     `tip.contains(ev.target)` test passes the whole way across. */
  #tip::before { content: ""; position: absolute; left: 0; right: 0; bottom: -18px; height: 18px; }
  /* A pinned card doesn't need the bridge — it survives whatever the cursor does — and keeping it
     would swallow the click just under the card, which is one of the places you'd naturally click
     to dismiss it. */
  #tip.pinned::before { display: none; }
  /* flipped under the shape when there's no room above */
  #tip.below { transform: translate(-50%, 16px); }
  #tip.below::after { bottom: auto; top: -7px; border: none; border-left: 1px solid #E7E9EE;
    border-top: 1px solid #E7E9EE; }
  #tip.below::before { bottom: auto; top: -18px; }
  #tip .t-type { display: flex; align-items: center; gap: 6px; font-size: 10px; letter-spacing: 1px;
    font-weight: 600; color: #9AA0A6; }
  #tip .t-dot { width: 9px; height: 9px; border-radius: 3px; }
  /* the ✕ is the one interactive part of a pinned card — the card itself stays click-through */
  #tip .t-close { position: absolute; top: 6px; right: 8px; pointer-events: auto; cursor: pointer;
    font-size: 12px; line-height: 1; color: #9AA0A6; padding: 4px; }
  #tip .t-close:hover { color: #1F2328; }
  #tip .t-name { font-weight: 600; margin: 3px 0 1px; }
  #tip .t-detail { color: #6B7280; }
  #tip .t-decision { display: flex; align-items: center; gap: 6px; margin-top: 8px;
    padding-top: 8px; border-top: 1px solid #EEF0F3; font-size: 11.5px; }
  /* What YOU put in place of the suggestion — the changelog row's own treatment, so the two
     surfaces read as one thing seen twice. */
  #tip .t-mine { margin-top: 6px; padding-left: 8px; border-left: 3px solid #6D28D9;
    color: #6D28D9; font-size: 11.5px; line-height: 1.45; }

  /* Decide from the map (Olcay, 2026-08-11: "click on the markers, see all options and change to
     something else"). The badge at the centroid already SAYS the decision; this is where you set
     it. Only a PINNED card gets it — hover stays a preview, and a control that appears under a
     moving cursor is one you can't hit. Interactive, so like the ✕ it opts back into pointer
     events; the card itself stays click-through so it never blocks the map beneath.
     The icon-only segmented control is the list's, deliberately: same three marks, same neutral
     ink, same order (§3 — a decision is its own axis and never recolours the feature). */
  #tip .t-actions { display: flex; gap: 4px; margin-top: 8px; padding-top: 8px;
    border-top: 1px solid #EEF0F3; pointer-events: auto; }
  #tip .t-actions button { flex: 1; display: grid; place-items: center; height: 28px;
    border: 1px solid #E7E9EE; border-radius: 6px; background: #fff; cursor: pointer; padding: 0;
    color: #1F2328; }
  #tip .t-actions button:hover { background: #F4F5F7; }
  #tip .t-actions button[aria-pressed="true"] { background: #EEF0F3; border-color: #C7CAD1; }
  #tip .t-actions button:focus-visible { outline: 2px solid #0b369c; outline-offset: 1px; }

  /* zoom control, bottom-right (Figma 2103:22178): two white squares, + over −. Sibling of #map
     on purpose — #map swallows clicks in the capture phase (see below), so buttons inside it
     would never hear their own click. */
  #zoomctl { position: absolute; right: 16px; bottom: 16px; z-index: 6;
    display: flex; flex-direction: column; gap: 6px; }
  /* 44×44 / radius 12 / same shadow as the Map Settings trigger — every over-map button one size
     (Olcay, 2026-08-10 evening) */
  #zoomctl button { width: 44px; height: 44px; border: none; border-radius: 12px; background: #fff;
    box-shadow: 0 2px 6px rgba(0,0,0,.16); color: #1F2328; font: 20px/1 "Readex Pro", system-ui, sans-serif;
    cursor: pointer; display: grid; place-items: center; padding: 0; }
  #zoomctl button:hover { background: #f2f3f5; }

  /* drop veil — v9's Dropzone look (dashed theme border on a light tint); purely visual, the
     document handles the events, so the veil never steals the drop */
  #dropveil { position: absolute; inset: 12px; z-index: 7; display: none; pointer-events: none;
    border: 2px dashed #346df1; border-radius: 12px; background: rgba(241,245,254,.88);
    align-items: center; justify-content: center; }
  #dropveil.on { display: flex; }
  #dropveil .dz { text-align: center; font: 600 15px/1.5 "Readex Pro", system-ui, sans-serif; color: #0d44c2; }
  #dropveil .dz small { display: block; font-weight: 400; font-size: 12px; color: #5d626f; }
</style>
<script src="https://pointr-websdk.azureedge.net/10.7.1/pointrwebsdk.js"></script>
</head>
<body>
<div id="map"></div>
<svg id="hl" xmlns="http://www.w3.org/2000/svg"></svg>
<div id="tip"></div>
<div id="zoomctl">
  <button id="zoomin" type="button" aria-label="Zoom in" title="Zoom in">+</button>
  <button id="zoomout" type="button" aria-label="Zoom out" title="Zoom out">&minus;</button>
</div>
<div id="dropveil"><div class="dz">Drop to upload a floor-plan<small>GeoJSON · DWG/DXF · PDF (experimental)</small></div></div>
<script>
const SVGNS = "http://www.w3.org/2000/svg";

/**
 * The Pointr connection, handed over on the query string by the parent app (see
 * src/mock/pointrConfig.ts). Nothing is hardcoded here any more: this file lives in `public/`,
 * which Vite copies verbatim into the deployment, so anything written here ships to production —
 * credentials included. The app reads them from env (`.env.local` locally, Vercel's project vars
 * for the deployed build) and passes them in.
 *
 * Opening /map/index.html standalone therefore needs them too:
 *   /map/index.html?baseUrl=…&client=…&licence=…&site=…&building=…&level=-2
 * Without them the page says so rather than failing silently inside the SDK.
 */
const CFG = new URLSearchParams(location.search);

// Dubai International Airport · Terminal 3 and B Gates · Departures - Terminal 3 ("B2").
// Passing site+building+level as SDK Options boots straight into the level (the SDK otherwise only
// hydrates/opens a building on user selection). siteInternalIdentifier is REQUIRED alongside
// buildingInternalIdentifier — Options.validateBuilding() rejects the building on its own.
const TARGET = {
  site:     CFG.get("site") || "",
  building: CFG.get("building") || "",
  level:    CFG.has("level") ? Number(CFG.get("level")) : -2,
};
const CONN = {
  baseUrl: CFG.get("baseUrl") || "",
  client:  CFG.get("client")  || "",
  licence: CFG.get("licence") || "",
  // The map persona — see src/mock/pointrConfig.ts for what the SDK does with it. NOT in
  // missingConfig(): omitting it is legitimate (the SDK then applies the client's default
  // persona), unlike the five values without which the map cannot boot at all.
  persona: CFG.get("persona") || "",
};

/** Say what's missing, in the pane, instead of dying inside the SDK's constructor. */
function missingConfig() {
  return [
    ["baseUrl", CONN.baseUrl], ["client", CONN.client], ["licence", CONN.licence],
    ["site", TARGET.site], ["building", TARGET.building],
  ].filter(([, v]) => !v).map(([k]) => k);
}

// Four colours, six keys: the app splits the report's "updated" into geometry vs metadata (they
// want different review treatment), but to the eye both are the one "updated" blue. `updated`
// stays as an alias so this page still works standalone off its own seed below.
// ⚠️ The ONE deliberate copy of the diff palette. Everywhere else in the app these are DS tokens
// (`--semantics-diff-*`, added 2026-08-11) — but this page is a standalone iframe that never loads
// the DS stylesheet, so `var()` here would resolve to nothing and every shape would draw black.
// The values must stay in step with `Semantics/Diff` in @kozmos-ds/tokens and CHANGE_COLORS in diff.ts.
// (Making the map theme-aware means posting the resolved values in `prefs` — a real follow-up.)
const COLORS = { new:"#2FBF71", updated:"#3B82F6", geometry:"#3B82F6", metadata:"#3B82F6", deleted:"#EF4444", preserved:"#9C6EFF" };

/* INK-START — extracted and tested by scratch/geometry.test.mjs. NOT an engine: two colour
   constants. They live in a marked block because `WF_COLOUR` sits inside GJSWAP-ENGINE and
   reads EDIT_INK, so the harness must see the real value rather than a restated copy in its
   PRELUDE — a stub here would drift silently the day one of these changes. */
/**
 * ⚠️ **The tool ink — one colour for guides, snap marks and the degree readouts**, because they
 * are one promise: *the tool is holding you to something*. Never the edit navy, which is spoken
 * for by the shape itself.
 *
 * **Off green as of 2026-08-18** (Olcay): in this design system green is the SUCCESS semantic and
 * amber is ALERT, and both meanings are on screen at the same time as the editor — Map Content
 * shows level status tags (`Auto-published` green, `Publishes in 6d` amber) in the tree while you
 * drag a corner on the map beside it. A guide that borrows success green is saying something it
 * does not mean.
 *
 * **Value: `Colors/theme/1000` (#051c4f)** — Olcay, 2026-08-18: use the tokens we already have,
 * the theme ramp's darker end. There is no `accent` family published (checked: neither
 * `packages/tokens` nor any Figma variable collection has one) and theme variants are not in use,
 * so the only families left were the meaning-bearing ones. ⚠️ The cost is that the tool ink and
 * the shape being edited (`theme/800`) now differ in SHADE, not hue — the one thing this file has
 * learned twice not to rely on. Dash pattern and stroke weight carry the distinction instead.
 */
const TOOL_INK = "#051c4f";   // Colors/theme/1000

/**
 * **The edit ink** — the shape you are editing, its handles, the transform box, the marquee and
 * the cut. `Colors/theme/800`. Paired with `TOOL_INK` above and deliberately a different value:
 * the tool and the thing being worked on must never be the same colour.
 *
 * ⚠️ Hoisted 2026-08-18 from **21 scattered literals**. Two occurrences are deliberately left as
 * text: the one in `<style>` (CSS cannot read a JS constant) and the one inside the WF_COLOUR
 * note, which is prose about history rather than a value in use.
 */
const EDIT_INK = "#0b369c";   // Colors/theme/800

/**
 * **The review map is a PREVIEW of the finalised floor** (Olcay, 2026-08-25) — mirrored from
 * `src/mock/diff.ts`, which this page never loads.
 *
 * `DECISION_INK` is muted rather than green/red because the shape already says the answer: a
 * confirmed change is simply the map, a rejected one falls back to a muted ghost, and an edit
 * paints `OVERRIDE_INK`. Colouring the marks as well would spend the traffic light twice on one
 * map, which was the original objection to the `COLOURED_DECISIONS` experiment this replaces.
 *
 * ⚠️ Change these here **and** in `diff.ts`, or the list and the map will disagree.
 *
 * ⚠️ **`#5d626f`, not `#737373` — ruled 2026-08-27.** Figma's tray drew `background-600` while the
 * app drew `--review-muted`, and the two greys had been a hair apart since the marks were built.
 * Olcay chose Figma's. It is also the better one: **6.10:1** on white against 4.74:1, which matters
 * for an 18px glyph and for the ghost's dashed hairline, and it sits closer to the ✎'s 7.10 so the
 * tray reads as one family rather than as two weights.
 */
const DECISION_INK = "#5d626f";   // Colors/background/600
/** An edit is your override about to be carried through — the same purple `preserved` wears. */
const OVERRIDE_INK = "#6D28D9";
/* INK-END */
// A decision (✓ / ✗) is state, not identity: it never recolours the feature. Badges are therefore
// neutral, distinct from every type colour.
const INK = "#000000";

// Floor-plan outline = source_ptr wall/space polygons, minus the big grouping layers
// (see memory `map-settings-v9`: outline linework under the change highlights).
const FP_SKIP = { section:1, transition:1, transportationspace:1 };

const TYPE_LABEL = { new:"NEW", updated:"UPDATED", geometry:"GEOMETRY CHANGED", metadata:"DETAILS CHANGED",
                     deleted:"REMOVED", preserved:"PRESERVED" };
const DECISION_LABEL = { confirm:"Confirmed", reject:"Rejected", edited:"Edited by you" };

// The app owns the diff and pushes it in ({type:"changes"}); this seed only keeps the page usable
// on its own (open /map/index.html directly) and is merged by feature name, never replaced.
const CHANGES = [
  { name:"Costa Coffee",              type:"new",       decision:"confirm" },
  { name:"Burger King",               type:"updated",   decision:"confirm" },
  { name:"Subway",                    type:"updated",   override:{ details:["Type: “Cafe” → “Quick Service Restaurant”"] } },
  { name:"DDF Pharmacy",              type:"deleted",   decision:"reject"  },
  { name:"Marhaba Reception",         type:"preserved", decision:null      },
];

let pw, map, svg = document.getElementById("hl"), tip = document.getElementById("tip");
// hover previews a change, a click pins it (so you can pan around with the details still up)
let SELECTED = null, HOVERED = null;
/**
 * The active change the app last named, held so it can be applied again once geometry resolves.
 * A row is clickable the instant the panel paints, which is routinely before `resolveChanges()`
 * has found that feature in the tiles — without this, an early click would select nothing and
 * silently do nothing.
 */
let PENDING_ACTIVE = null;
/**
 * Where the press landed, so a release can tell a tap from a pan.
 *
 * Recorded from a **document-level capture** listener rather than from the shape, because the
 * mousedown does not reliably target the shape — MapLibre's drag-pan handler is in the way, and
 * `redraw()` may have replaced the path between the pointer arriving and the button going down.
 * We don't care what it targeted; we only care where it was.
 */
let DOWN_AT = null;

/** A release counts as a tap if the pointer barely moved since the press. Shapes sit over a
    draggable map, so pressing on a unit to pan must not select it. */
function isTap(ev) {
  return !!DOWN_AT && Math.hypot(ev.clientX - DOWN_AT[0], ev.clientY - DOWN_AT[1]) <= 4;
}
const shown = () => SELECTED || HOVERED;
let RESOLVED = [];                 // [{ change, rings:[[lnglat,…]], centroid:[lng,lat] }]
// Greyscale is the *review* mode — a level being edited or simply viewed stays in full colour.
// The screen that shows changes turns it on; nothing else does.
// `geojsonFloor` is the render swap (see the GJ block): draw the floor from the level's GeoJSON
// with the SDK's tiles off. Defaults to ON, and costs nothing on a screen that never sends any
// GeoJSON — `gjWanted()` also requires features to draw.
const prefs = { greyscale: false, hidePoiLabels: false, floorplan: true, floorplanTransparency: 0.5, basemap: "vector", geojsonFloor: true };

function post(type, extra) { try { parent.postMessage(Object.assign({ source:"mapscale-map", type }, extra||{}), "*"); } catch(e){} }
function el(tag, attrs){ const e=document.createElementNS(SVGNS, tag); for(const k in attrs) e.setAttribute(k, attrs[k]); return e; }

/* ── map handle ─────────────────────────────────────────────────────────── */

function getMap() {
  try { return pw.uiController.mapViewController.view.map; } catch(e) { return null; }
}

// MapLibre reports style/tile/sprite failures on its own `error` event; nothing in the SDK surfaces
// them, so a broken style just looks like a blank pane. Keep the last few for debugging.
let errHooked = false;
function hookMapErrors() {
  if (errHooked || !map) return;
  errHooked = true;
  window.__mapErrs = [];
  map.on("error", ev => {
    const err = ev && ev.error;
    const msg = (err && err.message) || (ev && ev.message) || "map error";
    window.__mapErrs.push({ msg, stack: err && err.stack ? String(err.stack).split("\n").slice(0, 4) : null });
    if (window.__mapErrs.length < 4) post("error", { message: "map: " + msg });
  });
}

// What the pane is actually showing, straight from the SDK — the app labels the map with it so the
// floor is never in doubt. (levelIndex 2 = short "L2", "Departures - Concourse B". Careful: this
// building's short titles are per-terminal — "B2" is levelIndex -2, Departures · Terminal 3.)
function levelInfo() {
  try {
    const uc = pw.getUiController();
    const b = uc.getCurrentBuilding();
    // Resolve from mvc.levelIndex — the index the *layer filters* use, i.e. what is actually on
    // screen — rather than pw.getCurrentLevel(). handleLevelObject() can set the current-level
    // object while updateLayersForCurrentLevel() fails to stick, and getCurrentLevel() then names
    // a floor the map isn't rendering. Reporting that is how a level selector ends up lying.
    const idx = uc.getMapViewController().levelIndex;
    const l = (b && (b.levels || []).find(x => x.levelIndex === idx)) || pw.getCurrentLevel();
    return { index: l.levelIndex, short: l.levelShortTitle, long: l.levelLongTitle,
      building: b && b.buildingTitle };
  } catch(e) { return null; }
}

// Every building on the active site, with its levels — the Map Content tree is built from this
// rather than from a hard-coded list, so the tree, the breadcrumb and the map always agree.
function siteBuildings() {
  try {
    return pw.getSiteBuildingManager().getAllBuildings()
      .filter(b => b.siteInternalIdentifier === TARGET.site)
      .map(b => ({
        id: b.buildingInternalIdentifier,
        name: b.buildingTitle,
        levels: (b.levels || [])
          .map(l => ({ index: l.levelIndex, short: l.levelShortTitle, long: l.levelLongTitle }))
          .sort((a, z) => z.index - a.index),          // top floor first, as the dashboard lists them
      }));
  } catch(e) { return []; }
}

// `onTimeout` matters: a poll that gives up used to just post an error, so anything holding state
// for the duration (the level-switch latch) was left holding it. Every wait now has a losing branch.
function poll(test, cb, label, onTimeout) {
  let tries = 0;
  (function tick() {
    if (test()) return cb();
    if (++tries > 120) {                                  // 120 × 250ms = 30s
      post("error", { message: "timed out waiting for " + label });
      return onTimeout && onTimeout();
    }
    setTimeout(tick, 250);
  })();
}

/**
 * Open the target site/building.
 *
 * The SDK consumes siteInternalIdentifier/buildingInternalIdentifier/levelIndex in
 * MapViewController.updateSiteIfOptionSet()/updateBuildingIfOptionSet(), but on a cold load those
 * run against an empty `mvc.sites` (map-ready beats data-loaded), so the options are silently
 * dropped and the widget sits on the world map ("no building is set"). We drive the same SDK
 * methods ourselves once the data is in — minus updateSiteIfOptionSet(), which scrollToSite()s out
 * to the whole airport: below SITE_ZOOM_LEVEL (15) the SDK flips to world mode and hides every
 * indoor layer, and it also seeds the layer filters with the building's LOWEST level.
 */
function openTarget() {
  const uc = pw.getUiController(), mvc = uc.getMapViewController();
  try {
    mvc.updateCurrentSite(TARGET.site);
    mvc.scrollToBuilding(TARGET.building);    // centres the building at zoom 17.1 (indoor minzoom is 17)
    // tiles are ensureTiles()'s job — it waits for the style before touching sources
  } catch(e) { post("error", { message: "openTarget: " + e.message }); }
  try { uc.hideLoadingView(); } catch(e){}
}

// The MapLibre style is applied by the SDK a beat after the map object exists. Touching sources
// before then throws inside updateMapTiles() and can leave a half-added `source_ptr` behind, after
// which the style never finishes loading and the pane stays empty. getStyle() is no good as a probe
// (it returns undefined that whole time) — the parsed stylesheet is.
function styleReady() {
  try { const s = map.style && map.style.stylesheet; return !!(s && s.layers && s.layers.length); }
  catch(e) { return false; }
}

/**
 * Set the level. Also re-applied after the tiles resolve: updateSiteIfOptionSet() seeds the layer
 * filters with the building's lowest level, and a level set before `source_ptr` has data leaves
 * layers filtered on `lvl == 0` — right level object, wrong floor on screen.
 */
function applyLevel() {
  try {
    const uc = pw.getUiController(), mvc = uc.getMapViewController();
    const b = uc.getCurrentBuilding();
    const lvl = b && (b.levels || []).find(l => l.levelIndex === TARGET.level);
    if (lvl) pw.handleLevelObject(lvl);
    else post("error", { message: "level " + TARGET.level + " not found on building" });
    // handleLevelObject() → MapViewController.setLevel() early-returns once levelIndex matches, so
    // a level set before the style's `_ptr` layers existed never reaches the layer filters and the
    // map keeps rendering level 0. This call re-applies them unconditionally.
    mvc.updateLayersForCurrentLevel(TARGET.level);
  } catch(e) { post("error", { message: "applyLevel: " + e.message }); }
}

/**
 * When the SDK swings its camera into 3D-model mode it calls hidePtrLayersExceptOutlines(), which
 * hides every indoor fill/symbol layer — the pane then shows only outlines and our own floor-plan
 * lines, with no rooms, icons or labels. updateLayersForCurrentLevel() re-shows them, so probe a
 * known indoor layer and re-apply the level if it has been hidden behind our back.
 */
// The SDK re-seeds the level from its own level selector after we've set ours, so the map can drift
// back to level 0 a beat after boot. Cheap to check, and only re-applies when it has actually drifted.
// Rate-limited for exactly the reason boot and the switch nudge on a ~3s cadence:
// updateLayersForCurrentLevel() rewrites ~600 filters, and `idle` fires after every pan settles.
// Unthrottled, a level the SDK won't take — or a switch that failed, which leaves TARGET.level
// permanently ahead of the SDK — re-filters the entire style on every settle, forever.
let lastEnsure = 0;
function ensureLevel() {
  try {
    if (pw.uiController.mapViewController.levelIndex === TARGET.level) return;
    const now = Date.now();
    if (now - lastEnsure < 3000) return;
    lastEnsure = now;
    applyLevel();
  } catch(e){}
}

function ensureIndoorVisible() {
  try {
    /**
     * ⚠️ **Probe whichever layer is actually meant to be drawing.** With the floor rendered from
     * GeoJSON the SDK's own `fill_retail-space_ptr` is hidden **on purpose**, so probing it would
     * read "the SDK has hidden the indoor layers" on every single idle and call `applyLevel()` —
     * which re-shows them — for ever. The tiles would flicker back under the GeoJSON a few times a
     * second and ~600 filters would be rewritten each time.
     */
    const id = gjLive() ? GJ_LYR + "fill_retail-space_ptr" : "fill_retail-space_ptr";
    if (!map.getLayer(id)) return;
    if (map.getLayoutProperty(id, "visibility") === "none") applyLevel();
  } catch(e){}
}

// True once the *target level's* content is on screen — not merely any indoor feature, which can
// be level 0 leaking through a stale filter. Paint-dependent: queryRenderedFeatures() is empty
// until MapLibre has drawn a frame, so this is a boot-time signal only, never a gate (see below).
function levelIsRendering() {
  try {
    // Either source counts: once the floor is drawn from GeoJSON, `source_ptr` paints nothing by
    // design, and a boot signal that can only ever say "no" is worse than none.
    return map.queryRenderedFeatures().some(f =>
      (f.source === "source_ptr" || String(f.source).indexOf(GJ_SRC) === 0) &&
      f.properties && f.properties.lvl === TARGET.level);
  } catch(e) { return false; }
}

// The style's indoor layers exist, so an updateLayersForCurrentLevel() call actually reaches some
// filters. getStyle() deep-clones ~600 layers, so remember one layer id and probe *that* on later
// calls — as cheap as a cached boolean, but unlike one it re-checks honestly if the SDK ever swaps
// the style out from under us (a cached `true` would then wave a switch through onto no layers).
let ptrProbeId = null;
function hasPtrLayers() {
  try {
    if (ptrProbeId && map.getLayer(ptrProbeId)) return true;
    const l = map.getStyle().layers.find(l => l.id.indexOf("_ptr") >= 0);
    ptrProbeId = l ? l.id : null;
    return !!l;
  } catch(e) { return false; }
}

/**
 * Readiness gate for a level switch — deliberately NOT levelIsRendering().
 *
 * Gating a switch on a *painted* feature wedges the map: queryRenderedFeatures() stays empty in any
 * tab that isn't painting (MapLibre defers style/tile work to an animation frame), so the poll spun
 * for its full 30s, the completion callback never ran, and the `switching` latch swallowed every
 * further switch until its timer expired. That is why the map was left sitting on L2.
 *
 * Ask the SDK instead — paint-independent, and true the moment the switch has actually taken:
 * the right building is current, the style's `_ptr` layers exist (so the level reached the layer
 * filters rather than early-returning into nothing), and mvc.levelIndex is the level we asked for.
 */
function levelApplied() {
  try {
    if (!styleReady() || !hasPtrLayers()) return false;
    const uc = pw.getUiController();
    const b = uc.getCurrentBuilding();
    if (!b) return false;
    if (b.buildingInternalIdentifier && b.buildingInternalIdentifier !== TARGET.building) return false;
    return uc.getMapViewController().levelIndex === TARGET.level;
  } catch(e) { return false; }
}

/**
 * The indoor vector tiles hang off `source_ptr`, whose URL is built by updateMapTiles() from the
 * site's CDN version + the global config. On a cold load that can run before the config lands and
 * the URL is set to "" — map opens on the right level, renders nothing. Re-issue until it sticks.
 */
/**
 * The url `source_ptr` carried the FIRST time the style was ready — i.e. before `updateMapTiles()`
 * has had any chance to replace it. Anything different from this came from the SDK, which is the
 * only thing that knows the indoor url.
 */
let firstTileUrl = null;

/**
 * ⚠️ **Basemap tile hosts.** Only used to catch the case where the style ships a placeholder AND the
 * SDK never replaces it — `firstTileUrl` catches every other shape on its own, so this list does not
 * have to be exhaustive to be useful.
 */
const BASEMAP_TILES = /api\.maptiler\.com|openmaptiles|basemaps\.|tile\.openstreetmap/i;

function ensureTiles(cb, tries) {
  tries = tries || 0;
  if (styleReady()) {
    const src = (() => { try { return map.getSource("source_ptr"); } catch(e) { return null; } })();
    const url = (src && src.url) || "";
    if (firstTileUrl === null) firstTileUrl = url;
    // Only once the style exists — calling this earlier throws inside the SDK's own source-url
    // setter. Re-issue every ~3s rather than every tick: until the site's CDN version resolves it
    // sets the url to "", and each of those throws again inside MapLibre.
    if (tries % 6 === 0) { try { pw.uiController.mapViewController.updateMapTiles(TARGET.site); } catch(e){} }
    /**
     * ⚠️ **A url is not the same thing as the INDOOR url, and this gate used to confuse them.**
     * It read `if (src && src.url) return cb()`, which is true of *any* url — including the
     * `api.maptiler.com` basemap this style can ship `source_ptr` pointing at. When that happened
     * the gate passed on the very first call, `updateMapTiles()` above was never reached, and boot
     * then waited for ever on `poll(levelIsRendering, start, …)` — because a basemap has no `wall`
     * layer, so the level can never start rendering. Blank indoor map, console full of
     * `Source layer "wall" does not exist on source "source_ptr"`, and it reads as an SDK fault.
     * It was also **intermittent**: the same session saw the style arrive both ways.
     *
     * Two independent tests, because either alone has a hole. `url !== firstTileUrl` means the SDK
     * has replaced whatever the style shipped, which is the real signal and needs no host list —
     * and it covers the documented `""` case for free, since anything beats empty. `BASEMAP_TILES`
     * then catches the one case that leaves behind: a style that ships a placeholder the SDK never
     * replaces, where the url would sit unchanged and look acceptable for ever.
     */
    if (url && url !== firstTileUrl && !BASEMAP_TILES.test(url)) return cb();
  }
  if (tries > 60) return post("error", { message: "indoor tile url never resolved" });
  setTimeout(() => ensureTiles(cb, tries + 1), 500);
}

/* ── change geometry (resolved once, then only re-projected) ─────────────── */

// Match on level + building, not just name: the same shop name exists on other floors (and the
// SDK's layer filters pass through a transient level-0 state at boot), so a name-only match can
// permanently cache a polygon from the wrong floor — it then draws in open space.
function pickFeature(name, all, center) {
  const cs = all.filter(f => f.properties && f.properties.name === name && srcLayerOf(f) !== "wall" &&
    f.properties.lvl === TARGET.level &&
    (!f.properties.bid || f.properties.bid === TARGET.building) &&
    f.geometry && (f.geometry.type === "Polygon" || f.geometry.type === "MultiPolygon"));
  if (!cs.length) return null;
  const fc = f => f.geometry.type === "Polygon" ? f.geometry.coordinates[0][0] : f.geometry.coordinates[0][0][0];
  cs.sort((a,b) => { const pa=fc(a), pb=fc(b);
    return ((pa[0]-center.lng)**2+(pa[1]-center.lat)**2) - ((pb[0]-center.lng)**2+(pb[1]-center.lat)**2); });
  return cs[0];
}
/**
 * The outer rings of an AREA feature. Anything without rings gets an empty list.
 *
 * ⚠️ This used to be `g.type==="Polygon" ? [coords[0]] : coords.map(p=>p[0])`, which quietly
 * assumed every non-Polygon was a MultiPolygon. A **Point** came back as `[undefined, undefined]`
 * and a LineString as `[0, 1]` — so opening a point POI in the geometry editor built a `GEOM` full
 * of nonsense and threw on the first draw. Half the POIs on a floor are points. See `geomFind`.
 */
function ringsOuter(f){
  const g = f.geometry;
  if (!g) return [];
  if (g.type === "Polygon") return [g.coordinates[0]];
  if (g.type === "MultiPolygon") return g.coordinates.map(p => p[0]);
  return [];
}
function centroid(r){ let x=0,y=0; r.forEach(c=>{x+=c[0];y+=c[1];}); return [x/r.length, y/r.length]; }

// Cache lng/lat rings so `redraw()` on every frame is just a projection pass, not a 1000-feature
// query. Re-run on `idle` to pick up features from newly loaded tiles — but only for changes we
// haven't resolved yet: pickFeature() breaks ties by distance to the map centre, so re-picking a
// resolved change makes its highlight jump to a different same-named unit as the user pans.
/**
 * Candidate features for the change list.
 *
 * queryRenderedFeatures() only sees the current viewport, which is fatal when the level being
 * reviewed sits in a different wing of the building from wherever the camera opened — the changes
 * never resolve, so the map never frames them, so they never come into view. querySourceFeatures()
 * reads the loaded tiles instead, independent of the viewport and of each layer's minzoom.
 */
function candidateFeatures() {
  const out = [];
  const seen = new Set();
  const push = f => {
    const k = f.properties && (f.properties.fid || f.properties.name + ":" + f.id);
    if (k && seen.has(k)) return;
    if (k) seen.add(k);
    out.push(f);
  };
  try { map.queryRenderedFeatures().forEach(push); } catch(e){}
  try {
    // Both sources, always — see `indoorPairs`. The tiles keep answering while the floor is drawn
    // from GeoJSON (a source is queryable whether or not any layer on it is visible), so a change
    // resolves off whichever of the two happens to hold the feature.
    indoorPairs().forEach(({ source, sourceLayer, name }) => {
      try { map.querySourceFeatures(source, sourceLayer ? { sourceLayer } : undefined)
        .forEach(f => push({ ...f, sourceLayer: f.sourceLayer || name })); } catch(e){}
    });
  } catch(e){}
  return out;
}

/**
 * The named polygons actually present on the current level, biggest first.
 *
 * This is what lets the app build a changelog that MATCHES THE MAP on any floor. The seeds used to
 * name B2's features exclusively, so reviewing any other level drew a list beside a map with
 * nothing highlighted (old defect D4) — and the Building wizard's creation review, whose building
 * has no geometry at all, listed seven guesses against an untouched map. Now the app asks the map
 * what is on the floor and binds its rows to real shapes.
 *
 * Ordered by bounding-box area so the picks are prominent units a reviewer can actually see, not
 * slivers; `wall` and the big grouping layers are skipped for the same reason pickFeature skips them.
 */
/**
 * What KINDS of thing are on the current floor, and how many of each — the data behind the tree's
 * expandable level rows (Olcay, 2026-08-11: *"we need to expand levels to show each type"*).
 *
 * The taxonomy rides on the features themselves: every `source_ptr` feature carries `mainType` and
 * `subType`, so this counts pairs rather than guessing from layer ids. Deduped on `fid`, because a
 * feature split across tiles is reported once per tile and would otherwise inflate every count.
 *
 * ⚠️ **These are counts of what the map has LOADED**, not a census. `querySourceFeatures` only
 * sees loaded tiles, so a floor whose far end has never been in view under-reports. Boot frames the
 * whole building before this runs, which is why the numbers are close — but they are honest-ish,
 * not authoritative, and the real dashboard would read them from the content API.
 */
const NAME_CAP = 60;

/**
 * Where every feature the tree can offer you actually IS — `fid` → `[minx,miny,maxx,maxy]`.
 *
 * ⚠️ **This exists to break a chicken-and-egg that made clicking a row silently do nothing**
 * (Olcay, 2026-08-12: *"sometimes after a while... for some items it doesn't show details panel and
 * doesn't center"*). `focusFeature()` used to find the feature by scanning **loaded tiles** — but
 * tiles only load where the camera already is, so a feature at the far end of the floor could not
 * be found, and the only thing that would bring its tiles in is the camera move we were trying to
 * compute. The retry then expired after 10s with no geometry, no properties and no complaint.
 *
 * Measured on B2 while diagnosing: **1,491 features on the floor, 1,156 fids in loaded tiles** —
 * so about a fifth of the tree's rows were dead at any moment, which is exactly the reported
 * *"some items"*.
 *
 * Filled by the same scan that builds the rows, so the cache covers precisely the set that is
 * clickable: a feature the counts never saw isn't in the tree to be clicked. Bounds ACCUMULATE
 * across tiles (recorded before the `seen` dedupe), because a unit split down a tile boundary
 * would otherwise remember only the fragment that happened to come first.
 */
const FEATURE_BOUNDS = Object.create(null);

function noteBounds(fid, geometry) {
  if (fid == null || !geometry || !geometry.coordinates) return;
  const b = FEATURE_BOUNDS[fid] || (FEATURE_BOUNDS[fid] = [180, 90, -180, -90]);
  const eat = c => {
    if (typeof c[0] === "number") {
      if (c[0] < b[0]) b[0] = c[0];
      if (c[1] < b[1]) b[1] = c[1];
      if (c[0] > b[2]) b[2] = c[0];
      if (c[1] > b[3]) b[3] = c[1];
    } else c.forEach(eat);
  };
  eat(geometry.coordinates);
}

function levelTypeCounts() {
  try {
    const seen = new Set();
    const tally = new Map();
    for (const { source, sourceLayer, name: L } of indoorPairs()) {
      let fs = [];
      try { fs = map.querySourceFeatures(source, sourceLayer ? { sourceLayer } : undefined); }
      catch (e) { continue; }
      for (const f of fs) {
        const p = f.properties;
        if (!p || p.lvl !== TARGET.level) continue;
        if (TARGET.building && p.bid && p.bid !== TARGET.building) continue;
        if (p.fid == null) continue;
        if (!personaOk(p)) continue;          // counted only if the persona can see it
        // BEFORE the dedupe: a feature straddling a tile boundary arrives once per tile, and its
        // full extent is the union of those fragments.
        noteBounds(p.fid, f.geometry);
        if (seen.has(p.fid)) continue;
        seen.add(p.fid);
        const key = (p.mainType || L) + "\u0000" + (p.subType || "");
        const row = tally.get(key) || { count: 0, names: [] };
        row.count++;
        // Names for the individual features, capped: a floor with 989 walls would otherwise post a
        // thousand strings per level, and nobody scrolls a list that long. The count stays exact;
        // the list says when it is showing only the first slice.
        if (row.names.length < NAME_CAP) row.names.push({ name: p.name || "", fid: p.fid });
        tally.set(key, row);
      }
    }
    return [...tally.entries()].map(([k, v]) => {
      const [mainType, subType] = k.split("\u0000");
      const out = { mainType, count: v.count, names: v.names };
      if (subType) out.subType = subType;
      return out;
    });
  } catch (e) { return []; }
}

function levelFeatureNames(limit) {
  try {
    const seen = new Map();
    candidateFeatures().forEach(f => {
      const p = f.properties;
      // `srcLayerOf`, not `f.sourceLayer`: a GeoJSON feature has none, and reading the raw field
      // would let every wall on the floor into the app's feature list the moment the render swaps.
      const sl = srcLayerOf(f);
      if (!p || !p.name || sl === "wall" || FP_SKIP[sl]) return;
      if (!personaOk(p)) return;              // the map is not drawing it; the list must not list it
      // A type this screen does not draw is not one of its features either — a geofence carries a
      // perfectly good name ("Shops and Food") and would otherwise be listed as content.
      if (HIDDEN_FLAT && HIDDEN_FLAT.has(flatType(p.mainType))) return;
      if (p.lvl !== TARGET.level) return;
      if (p.bid && p.bid !== TARGET.building) return;
      if (!f.geometry || (f.geometry.type !== "Polygon" && f.geometry.type !== "MultiPolygon")) return;
      const ring = ringsOuter(f)[0];
      if (!ring || ring.length < 3) return;
      let minx = Infinity, miny = Infinity, maxx = -Infinity, maxy = -Infinity;
      ring.forEach(c => {
        if (c[0] < minx) minx = c[0];
        if (c[0] > maxx) maxx = c[0];
        if (c[1] < miny) miny = c[1];
        if (c[1] > maxy) maxy = c[1];
      });
      const area = (maxx - minx) * (maxy - miny);
      // keep the largest instance of each name — the same unit repeats across tile boundaries
      if (!seen.has(p.name) || seen.get(p.name) < area) seen.set(p.name, area);
    });
    // NB report EVERY named feature, not a top-N. The app uses this list two ways: as the pool it
    // binds unmatched rows to (where biggest-first matters, so highlights land on visible units),
    // and as a membership test for the names a seed already uses. A truncated list breaks the
    // second: B2's authored demo names small shops — Costa Coffee, DDF Zone 10 — which a top-60
    // by area would exclude, and the binder would then "fix" a set that was never broken.
    return [...seen.entries()]
      .sort((a, b) => b[1] - a[1])
      .slice(0, limit || seen.size)
      .map(e => e[0]);
  } catch (e) { return []; }
}

// A change whose feature simply isn't on this level can never resolve; without a cap we'd rescan
// every source layer on every `idle` for the life of the page. Give up after a fair number of tries.
let resolvePasses = 0;
const MAX_RESOLVE_PASSES = 40;

function resolveChanges() {
  const missing = CHANGES.filter(c => !RESOLVED.some(r => r.change === c));
  if (!missing.length) return RESOLVED.length;
  if (resolvePasses++ > MAX_RESOLVE_PASSES) {
    if (resolvePasses === MAX_RESOLVE_PASSES + 2)
      post("error", { message: "gave up resolving: " + missing.map(c => c.name).join(", ") });
    return RESOLVED.length;
  }
  const all = candidateFeatures();
  const center = map.getCenter();
  missing.forEach(change => {
    const f = pickFeature(change.name, all, center);
    if (!f) return;
    const rings = ringsOuter(f);
    /**
     * ⚠️ **The `fid` and the layers are captured HERE or nowhere.**
     *
     * The preview hides a feature by composing `fid != X` onto the layers that draw it — and the
     * moment that filter is applied the feature stops being findable, which is the same trap
     * `geomInteriorFeatures` records for Combine. This is the one pass in which the change, its
     * real tile feature and the layer it came from are all in hand at once.
     *
     * ⚠️ **`change.id` is NOT the fid.** It is documented as one and the seeds are authored slugs
     * (`costa`, `pharmacy`); the fid belongs to the feature `pickFeature` matched by name.
     */
    const fid = f.properties && f.properties.fid;
    RESOLVED.push({ change, rings, centroid: centroid(rings[0]),
                    fid, layers: layersDrawing(srcLayerOf(f)) });
  });
  RESOLVED.sort((a, b) => CHANGES.indexOf(a.change) - CHANGES.indexOf(b.change));
  // A row clicked before its geometry existed asked for something we couldn't show yet. Now we can.
  if (PENDING_ACTIVE != null && !SELECTED) setActive(PENDING_ACTIVE);
  return RESOLVED.length;
}

/* ── overlay ────────────────────────────────────────────────────────────── */

/**
 * Other people's cursors. Their own SVG layer, NOT part of `redraw()` — that runs on every render
 * frame and rebuilds the diff overlay wholesale, and a cursor rebuilt 60 times a second cannot
 * carry a CSS transition, which is exactly what turns a 20Hz feed into smooth movement.
 */
function drawPeers() {
  if (!map) return;
  let layer = document.getElementById("peers");
  if (!layer) {
    layer = document.createElement("div");
    layer.id = "peers";
    layer.style.cssText = "position:absolute;inset:0;pointer-events:none;z-index:7;overflow:hidden";
    document.body.appendChild(layer);   // a sibling of #map, exactly like #tip and #hl
  }
  const seen = new Set();
  for (const p of PEERS) {
    if (p.lng === undefined || p.lat === undefined) continue;
    seen.add(p.id);
    let node = document.getElementById("peer-" + p.id);
    if (!node) {
      node = document.createElement("div");
      node.id = "peer-" + p.id;
      node.className = "peer";
      node.innerHTML =
        '<svg width="20" height="22" viewBox="0 0 20 22" aria-hidden>' +
        '<path d="M3 2 L16 11 L10 12 L13 18 L10.5 19 L8 13 L3 17 Z" fill="currentColor" ' +
        'stroke="#fff" stroke-width="1.4" stroke-linejoin="round"/></svg>' +
        '<span class="peer-name"></span>';
      layer.appendChild(node);
    }
    node.style.color = p.colour || "#3B82F6";
    const label = node.querySelector(".peer-name");
    if (label) { label.textContent = p.name || ""; label.style.background = p.colour || "#3B82F6"; }
    const pt = map.project([p.lng, p.lat]);
    node.style.transform = "translate3d(" + Math.round(pt.x) + "px," + Math.round(pt.y) + "px,0)";
  }
  // Anyone who left, or moved to another floor, goes with them.
  for (const node of [...layer.children])
    if (!seen.has(node.id.slice(5))) node.remove();
}

/**
 * **The outline of what somebody else has open**, drawn in their colour.
 *
 * It used to be a chip reading *"Ege is editing"* pinned to the feature. Olcay, 2026-08-15:
 * *"instead of showing a tag for X is editing, let's highlight the geometry for other users. They
 * already can see the cursor."* — which is right twice over. The colour already ties the shape to
 * that person's cursor and avatar, so the name was saying a third time what two surfaces said
 * already; and a text chip sits ON the map at a fixed size, covering the very floor plan the
 * highlight is about.
 *
 * Dashed on purpose: a solid coloured outline is what the diff layer uses for a *change*, and this
 * is somebody's attention, not a change.
 */
function drawEditing() {
  if (!map) return;
  let layer = document.getElementById("editing");
  if (!layer) {
    layer = el("svg", { id: "editing" });
    layer.setAttribute("style",
      "position:absolute;inset:0;width:100%;height:100%;z-index:6;pointer-events:none");
    document.body.appendChild(layer);
  }
  while (layer.firstChild) layer.removeChild(layer.firstChild);

  for (const e of EDITING) {
    if (!e || !e.fid) continue;
    const rings = featureRings(e.fid);
    if (!rings.length) continue;                 // not on this floor, or no tile for it yet
    const colour = e.colour || EDIT_INK;
    for (const ring of rings) {
      const d = ring.map((c, i) => { const p = map.project(c); return (i ? "L" : "M") + p.x + " " + p.y; }).join(" ") + " Z";
      layer.appendChild(el("path", {
        d, fill: colour, "fill-opacity": .12, stroke: colour,
        "stroke-width": 2.5, "stroke-dasharray": "8 5", "stroke-linejoin": "round",
      }));
    }
  }
}

/**
 * Every outer ring of a feature, accumulated across tiles.
 *
 * A feature that straddles a tile boundary arrives once per tile, so taking the first match would
 * draw half a room — the same reason `scanFeature` accumulates its bounds rather than returning on
 * the first hit.
 */
/**
 * Every loaded feature carrying this `fid`, whatever its geometry type.
 *
 * ⚠️ **Source-agnostic on purpose** (Olcay, 2026-08-16: *"in our dashboard we postprocess the style
 * to use geojson datasource and not vector tiles, by removing source-layer and adding filter for
 * each type"*). This used to hardcode `source_ptr` and require a `source-layer`, which is a **vector
 * tile** shape — against a GeoJSON source, where layers carry no `source-layer`, the filter matched
 * nothing, `geomFind` returned null and **the geometry editor would simply never open**. It now
 * walks whatever sources the style actually uses and passes `sourceLayer` only where a layer has
 * one, so the same code works either way.
 *
 * Still `querySourceFeatures` rather than `queryRenderedFeatures`: the latter sees only the current
 * viewport, which is fatal when the level being reviewed is in a different wing from the camera.
 */
function featuresWithFid(fid) {
  const out = [];
  try {
    const pairs = new Map();
    for (const l of map.getStyle().layers) {
      if (!l.source || l.type === "background") continue;
      const key = l.source + "\u0000" + (l["source-layer"] || "");
      if (!pairs.has(key)) pairs.set(key, { source: l.source, sourceLayer: l["source-layer"] });
    }
    for (const { source, sourceLayer } of pairs.values()) {
      const feats = map.querySourceFeatures(source, sourceLayer ? { sourceLayer } : undefined);
      for (const f of feats)
        if (f.properties && f.properties.fid === fid && f.geometry) out.push(f);
    }
  } catch (e) {}
  return out;
}

function featureRings(fid) {
  const out = [];
  for (const f of featuresWithFid(fid)) out.push(...ringsOuter(f));
  return out;
}

/* PREVIEW-ENGINE-START — extracted and tested by scratch/geometry.test.mjs. Pure: a change's
   recorded answer in, what the map should do about it out. No map, no DOM.

   ⚠️ It is tested because it is a TABLE, and a table is exactly the kind of thing that reads
   correct and is wrong in one cell — the cell here being that `reject` means opposite things to an
   addition and to a removal. That asymmetry is the entire feature (Olcay, 2026-08-25: rejecting a
   removal is how you keep it), and nothing else in this file would notice if it inverted. */
/**
 * What a row resolves to: `"edited"` outranks a decision, because an override supersedes the
 * incoming change and there is nothing left to have confirmed or rejected.
 */
function outcomeOf(c) { return c.override ? "edited" : (c.decision || null); }

/**
 * **The change whose editor is open right now**, or `null`. Set by `beginchange`, cleared by `end`.
 *
 * ⚠️ It lives INSIDE this engine block because `previewFate` reads it, and the block is extracted
 * and evaluated on its own by the harness — a variable declared outside would make the generated
 * module throw rather than fail a check.
 */
let EDITING_CHANGE = null;
function setEditingChange(id) { EDITING_CHANGE = id || null; }

/** The ink a mark draws in — muted for a decision, the override purple for an edit. */
function outcomeInk(o) { return o === "edited" ? OVERRIDE_INK : DECISION_INK; }

/**
 * **Does this feature survive to the finalised floor, and does the map still owe it a colour?**
 *
 * The three answers are the whole of the preview:
 *
 * - `"diff"`   — undecided. Paint it in its type colour; this is the one that still needs you.
 * - `"plain"`  — decided, and it stays. Paint **nothing**: the tiles underneath already draw it as
 *                ordinary floor content, which is exactly what it will be. A confirmed addition, a
 *                rejected removal, any decided update — they are all just the map now.
 * - `"ghost"`  — decided, and it goes. A rejected addition or a confirmed removal. The tile feature
 *                is filtered out and a muted dashed outline is left in its place, so the absence is
 *                visible and still clickable (Olcay, 2026-08-25: *"let's start with muted"*).
 *
 * An **edited** row is neither of the last two: it stays, and it is yours, so it keeps a shape and
 * paints `OVERRIDE_INK`. That is `"mine"`.
 *
 * ⚠️ **An OPEN edit session previews its own outcome** (Olcay, 2026-08-26, ruling that a removal may
 * be edited). While you are editing a change, the map draws it as `"mine"` — because that is what
 * saving will make true — and Cancel puts it back.
 *
 * It is not a courtesy. A confirmed removal is a **ghost**: filtered out of the layers that draw it,
 * left as a dashed outline with no fill. **You cannot edit a shape you cannot see**, and the same is
 * true of a rejected addition. Rather than special-case those two, the session simply shows its own
 * result — which is also what this screen already promises out loud: *the map shows the floor as it
 * will be*, and that should not have to wait for a Save.
 *
 * ⚠️ **An UNDECIDED removal keeps its diff colour — it is NOT taken off the floor yet.** Decided by
 * Olcay, 2026-08-27, against the reading that would remove it: *"keep the diff until decided."*
 *
 * It is worth stating because the opposite is arguable and someone will argue it. The standing rule
 * for the map is *"remove it first, then bring it back if the user rejected the removal"* (Olcay,
 * 2026-08-27), and an undecided change **applies as detected** — the Complete-review overlay says so
 * out loud. So strictly, the preview of the upcoming floor would already be missing it.
 *
 * It stays because this screen is two things at once, and `diff` is the half that is not the
 * preview: it is the one fate that means **"this still needs you"**. Taking an undecided removal off
 * the floor would show you the answer to a question you have not been asked, and the row would be
 * the only place left that the feature was ever there. `plain` and `ghost` are both decided states;
 * `diff` is the queue.
 */
function previewFate(c) {
  if (EDITING_CHANGE && c.id === EDITING_CHANGE) return "mine";
  const o = outcomeOf(c);
  if (o === "edited") return "mine";
  if (!o) return "diff";
  if (c.type === "new" && o === "reject") return "ghost";
  if (c.type === "deleted" && o === "confirm") return "ghost";
  return "plain";
}
/* PREVIEW-ENGINE-END */

function drawBadge(cx, cy, kind){
  const col = outcomeInk(kind);
  const g = el("g", {});
  g.appendChild(el("circle", { cx, cy, r:11, fill:"#fff", stroke:col, "stroke-width":2 }));
  const p = el("path", { fill:"none", stroke:col, "stroke-width":2.2, "stroke-linecap":"round", "stroke-linejoin":"round" });
  if (kind==="confirm") p.setAttribute("d", `M${cx-5} ${cy} L${cx-1.5} ${cy+4} L${cx+5.5} ${cy-4.5}`);
  else if (kind==="reject") p.setAttribute("d", `M${cx-4.5} ${cy-4.5} L${cx+4.5} ${cy+4.5} M${cx+4.5} ${cy-4.5} L${cx-4.5} ${cy+4.5}`);
  // Edited — a pencil, drawn at mark scale rather than instanced from the Pointr Icon Library for
  // the same reason ✓ and ✗ are: this is 9px of glyph inside a 22px badge, and the library's
  // 24-grid at stroke 2 renders visibly lighter here. The library's `edit-02` is what the PANEL
  // shows beside it, so the two surfaces still agree about what the act is called.
  else p.setAttribute("d", `M${cx-4.5} ${cy+4.5} L${cx-4.5} ${cy+1.5} L${cx+2.5} ${cy-5.5} L${cx+5.5} ${cy-2.5} L${cx-1.5} ${cy+4.5} Z`);
  g.appendChild(p); return g;
}

// ⚠️ **There used to be a zoom fade here, and it is gone with the fills** (2026-08-28). `fillFactor()`
// thinned fill opacity past ~z16.7, because zoomed in far enough you stood *inside* a feature and its
// wash was all the pane showed. Nothing is filled any more, so there is nothing to fade: the outline,
// the dash and the badge carry the identity at every zoom. Recorded rather than deleted silently,
// because the problem it solved is real and will come back the day anything is filled again.
function redraw() {
  if (!map) return;
  while (svg.firstChild) svg.removeChild(svg.firstChild);
  const P = c => map.project(c);
  const marks = [];
  RESOLVED.forEach(({ change, rings, centroid }) => {
    /**
     * ⚠️ **`markOnly` stood here until 2026-08-25** — the mark without the diff shape, so a flag
     * raised in a finished review stayed findable while browsing the live floor. Nothing outlives a
     * review now (Olcay: *"once review concluded the map becomes the current map"*), so the app
     * simply sends no changes to a browsing map and there is nothing for this branch to do.
     */
    const fate = previewFate(change);
    const o = outcomeOf(change);
    const active = shown() === change;
    /**
     * **A decided change that stays draws NOTHING.** This is the preview: it will be ordinary floor
     * content, the tiles underneath already draw it as ordinary floor content, so anything painted
     * over the top would be the map disagreeing with itself about a question that is settled. The
     * mark still goes down — see below — because the muted footnote is cheap and the shape's
     * plainness alone cannot distinguish "confirmed" from "was never a change".
     */
    if (fate !== "plain") {
      const ghost = fate === "ghost";
      const mine = fate === "mine";
      /**
       * ⚠️ **Nothing here is a filled shape any more** (Olcay, 2026-08-28: *"The map should not have
       * colored shapes"*, and *"the hidden/confirmed removals should have nothing. Or very very thin
       * dashed outline — right now it's so thick"*).
       *
       * The map is a picture of the **finalised floor**, so the product's own rendering should be
       * what you see; anything of ours painted over the top competes with it. What is left is the
       * thinnest thing that still says *where*: an outline, and for a removal barely that.
       *
       * ⚠️ **The type colours are gone from the geometry on purpose.** `COLORS`/`LINE` said *what a
       * feature is* — new, updated, deleted — in a filled polygon. That is the card's job and the
       * mark's job now. Losing it is the cost of the ruling, and it was made knowingly.
       */
      const ink = mine ? OVERRIDE_INK : DECISION_INK;
      rings.forEach(ring => {
      const d = ring.map((c,i) => { const p = P(c); return (i? "L":"M") + p.x + " " + p.y; }).join(" ") + " Z";
      const path = el("path", { d,
        /**
         * ⚠️ **Painted, but invisible — NOT `fill: "none"`.** An unpainted fill is not hit-tested
         * (`pointer-events: visiblePainted`), so the interior would stop answering the pointer and
         * only the stroke would select. That matters most for an **undecided** change, which has no
         * mark (`redraw` only pushes one when there is an outcome) — its outline would be its sole
         * hit area, and now a 2px one.
         */
        fill: ink, "fill-opacity": 0,
        stroke: ink, class:"hit",
        /**
         * ⚠️ **Dashed is reserved for a ghost, and solid for everything else** — that pair is the
         * only thing telling an *absence* from a feature that is still there. A ghost is dashed over
         * a hole (its feature is hidden by fid); an undecided change is solid over the real feature,
         * still drawn beneath. The old `deleted` dash on an undecided removal is gone for exactly
         * this reason: it made the two look alike.
         */
        "stroke-width": ghost ? (active ? 2 : 1) : (active ? 3 : 2),
        ...(ghost ? { "stroke-dasharray":"2 4", "stroke-opacity":0.55 } : {}) });
      path.addEventListener("mouseenter", () => hover(change));
      path.addEventListener("mouseleave", () => hover(null));
      /**
       * **Selection hangs off `mouseup`, not `click` or `pointerdown`.** This is the third attempt
       * and the first one built on evidence; the previous two were built on what *ought* to work.
       *
       * Instrumenting a real click on a shape produces exactly this:
       *
       *     mouseover → path.hit          (hover works)
       *     mousedown → #hl               (the SVG, NOT the path)
       *     pointerup → path.hit
       *     mouseup   → path.hit
       *                                   (no `click` event, ever)
       *
       * Two independent reasons a `click` never arrives. `redraw()` wipes and rebuilds every path
       * on every render frame — MapLibre renders continually for symbol fades — so the press and
       * the release resolve to different nodes and the browser has no single element to fire
       * `click` on; and MapLibre's own drag-pan handler consumes the mousedown. `pointerdown`
       * isn't delivered to the path either.
       *
       * `mouseup` *is* delivered, on whatever path occupies that spot at release — which is the
       * same change, since it's the same geometry redrawn. So the closure is still correct.
       *
       * ⚠️ This is why synthetic `dispatchEvent(new MouseEvent('click'))` must never be trusted to
       * verify this: it fires by fiat an event the real browser never produces here.
       */
      path.addEventListener("mouseup", ev => {
        if (!isTap(ev)) return;          // a press that travelled is a pan, not a selection
        ev.stopPropagation();
        select(change);
      });
      svg.appendChild(path);
      });
    }
    /**
     * The ✓ / ✗ / ✎ mark at the feature's centroid, keyed on the **outcome** — so an edited row
     * wears the pencil rather than whatever decision it carried before you edited it.
     *
     * ⚠️ **A `plain` feature still gets one.** It has no shape of ours to hover, so the badge is
     * its only hit area — the same problem `markOnly` had, and solved the same way: the mark
     * becomes the target (see `drawMarks`). Without it, confirming a change would make its card
     * unreachable, and undoing a confirmation would mean finding the row in the list.
     *
     * Collected rather than drawn here, so overlapping marks can cluster — see drawMarks().
     */
    if (o) { const p = P(centroid); marks.push({ x:p.x, y:p.y, change, centroid, bare: fate === "plain" }); }
  });
  drawMarks(marks);
  applyPreviewHidden();
  positionTip();
}

/* ── the preview's vanishing act ──────────────────────────────────────────────
 *
 * A rejected addition and a confirmed removal are **not on the finalised floor**, and the review
 * map is a picture of the finalised floor. Drawing a ghost over the top is not enough on its own:
 * the vector tiles are still painting the feature underneath in full colour, so the ghost would
 * read as an outline *around* a room rather than as the room's absence.
 *
 * ⚠️ **The tile feature is therefore filtered out**, by `fid`, using the machinery Combine already
 * built for taking a wall off the map — see `geomApplyHiddenFilter`, which is the single owner of
 * these composed filters. Two independent composers on one layer would each restore what the other
 * had applied, so the preview does not get its own; it contributes fids and lets that one function
 * do the work.
 */

/** Which fids the preview wants hidden, and the layers drawing them. Rebuilt whole, never patched. */
let PREVIEW_HIDDEN = { fids: [], layers: [] };

/**
 * The layers that draw a given source-layer.
 *
 * Read off the **style**, not off `queryRenderedFeatures` — which is what `geomInteriorFeatures`
 * has to use, and which sees only the viewport. A change being reviewed is routinely off-screen
 * (the camera is wherever you left it), and a feature that never rendered would simply never be
 * hidden. The style is complete and viewport-independent.
 *
 * ⚠️ **GeoJSON clones are not covered.** They carry `__sl` rather than a `source-layer`, so this
 * finds none of them. That costs nothing today — the review screens fetch no GeoJSON (§12), so a
 * reviewed floor is always tile-drawn — and it is written down rather than guarded because a guard
 * would be code nothing exercises.
 */
function layersDrawing(sl) {
  if (!sl) return [];
  try {
    return map.getStyle().layers
      .filter(l => (l["source-layer"] || l.sourceLayer) === sl && l.type !== "background")
      .map(l => l.id);
  } catch (e) { return []; }
}

/**
 * Recompute what the preview hides, and apply it — but only when it has actually changed.
 *
 * ⚠️ **The guard is the whole point.** `redraw()` runs on every render frame, MapLibre renders
 * continually for symbol fades, and `setFilter` invalidates the layer it touches: re-applying an
 * identical filter 60 times a second would invalidate tiles faster than they can be parsed. The
 * same trap the level nudge at `~3s` was written to avoid.
 */
let PREVIEW_KEY = "";
function applyPreviewHidden() {
  const fids = [], layers = new Set();
  for (const r of RESOLVED) {
    if (previewFate(r.change) !== "ghost" || !r.fid) continue;
    fids.push(r.fid);
    for (const id of r.layers || []) layers.add(id);
  }
  const key = fids.slice().sort().join("|");
  if (key === PREVIEW_KEY) return;
  PREVIEW_KEY = key;
  PREVIEW_HIDDEN = { fids, layers: [...layers] };
  geomApplyHiddenFilter();
}

/**
 * How close two marks must be, in SCREEN pixels, to become one cluster.
 *
 * Screen space is the right space for this: "too crowded to read" is a fact about pixels, not
 * metres, so the same threshold behaves correctly at every zoom and the cluster dissolves on its
 * own as you zoom in. It also costs nothing — `redraw()` has already projected every centroid.
 * A badge is 22px across, so 34 leaves a little air before two of them are judged to collide.
 */
const CLUSTER_PX = 34;

/**
 * Draw the decision marks, grouping any that would overlap (Olcay, 2026-08-11: *"can we make a
 * cluster for the diffs on the map?"*).
 *
 * Greedy single-pass grouping: walk the marks, and for each ungrouped one absorb every other
 * ungrouped mark within `CLUSTER_PX`. Good enough for tens of marks and stable frame to frame,
 * which matters more here than perfect clustering — a group that reshuffles between frames would
 * shimmer, since this runs on every render.
 *
 * A cluster keeps its decision colour when the whole group agrees, and falls back to neutral ink
 * when it doesn't — so a bubble reading green is genuinely "5 confirmed", not "5 things".
 */
function drawMarks(marks) {
  const used = new Array(marks.length).fill(false);
  for (let i = 0; i < marks.length; i++) {
    if (used[i]) continue;
    used[i] = true;
    const group = [marks[i]];
    for (let j = i + 1; j < marks.length; j++) {
      if (used[j]) continue;
      const dx = marks[j].x - marks[i].x;
      const dy = marks[j].y - marks[i].y;
      if (dx * dx + dy * dy <= CLUSTER_PX * CLUSTER_PX) { used[j] = true; group.push(marks[j]); }
    }
    if (group.length === 1) {
      const m = marks[i];
      const badge = drawBadge(m.x, m.y, outcomeOf(m.change));
      /**
       * **A `bare` mark is its feature's only hit area.** A decided change that stays on the floor
       * draws no shape of ours — it is simply the map now — so without this the badge would be the
       * one thing on screen saying "you decided this" and the one thing you could not click to
       * change your mind. Only when bare: where a shape exists it is the bigger and better target,
       * and two overlapping hit areas would fight over the hover.
       *
       * ⚠️ This is the same problem `markOnly` had, and it is solved the same way. It outlived
       * `markOnly` because it was never really about flags — it is about a mark with nothing
       * underneath it.
       */
      if (m.bare) {
        badge.setAttribute("class", "hit");
        badge.addEventListener("mouseenter", () => hover(m.change));
        badge.addEventListener("mouseleave", () => hover(null));
        badge.addEventListener("mouseup", ev => { if (isTap(ev)) { ev.stopPropagation(); select(m.change); } });
      }
      svg.appendChild(badge);
    }
    else svg.appendChild(drawCluster(group));
  }
}

/*
 * ⚠️ **`drawNote` stood here until 2026-08-25** — the flag's note as a wrapped chip under its
 * badge, painted only for the shown feature because every note at once is label soup at anything
 * but max zoom. Notes belonged to flagging and went with it.
 */

/** One bubble standing for N overlapping marks; click it to zoom until they separate. */
function drawCluster(group) {
  const cx = group.reduce((n, m) => n + m.x, 0) / group.length;
  const cy = group.reduce((n, m) => n + m.y, 0) / group.length;
  const kinds = new Set(group.map(m => outcomeOf(m.change)));
  const col = kinds.size === 1 ? outcomeInk([...kinds][0]) : INK;
  const r = Math.min(20, 12 + group.length);

  const g = el("g", { class:"cluster" });
  // a soft halo, so a cluster reads as "several" at a glance rather than as a bigger badge
  g.appendChild(el("circle", { cx, cy, r: r + 4, fill: col, "fill-opacity": 0.18 }));
  g.appendChild(el("circle", { cx, cy, r, fill:"#fff", stroke: col, "stroke-width": 2 }));
  const t = el("text", { x: cx, y: cy + 4, "text-anchor":"middle", fill: col,
                         "font-size": 12, "font-weight": 700, "font-family":"inherit" });
  t.textContent = String(group.length);
  g.appendChild(t);
  g.appendChild(el("title", {})).textContent =
    `${group.length} changes here — click to zoom in`;

  // mouseup, not click: same reason the shapes use it — redraw() rebuilds these nodes every frame,
  // so press and release land on different elements and no click is ever produced.
  g.addEventListener("mouseup", ev => {
    if (!isTap(ev)) return;
    ev.stopPropagation();
    zoomToGroup(group);
  });
  return g;
}

/** Frame a cluster's features so they stop overlapping. */
function zoomToGroup(group) {
  const lngs = group.map(m => m.centroid[0]);
  const lats = group.map(m => m.centroid[1]);
  const w = Math.max(...lngs) - Math.min(...lngs);
  const h = Math.max(...lats) - Math.min(...lats);
  // Stacked centroids have no extent to fit — fitBounds would slam to max zoom, so step in instead.
  if (w < 1e-7 && h < 1e-7) {
    map.easeTo({ center: group[0].centroid, zoom: Math.min(map.getZoom() + 2, map.getMaxZoom()), duration: 450 });
    return;
  }
  map.fitBounds([[Math.min(...lngs), Math.min(...lats)], [Math.max(...lngs), Math.max(...lats)]],
                { padding: 120, maxZoom: 20, duration: 450 });
}

/* ── selection tooltip ──────────────────────────────────────────────────── */

/**
 * The card has exactly two modes, and they never negotiate (Olcay, 2026-08-11: *"I like it visible
 * on hover and invisible off hover, but if I click and select, the overlay tooltip should stay
 * until I deselect — click out or click close button"*):
 *
 *   **pinned**  — shows the selected change and stays until you deselect. Hover cannot change it,
 *                 remove it, or preview anything else. Leaves via ✕, a click outside, or Escape.
 *   **hovering** — shows what's under the cursor and disappears the moment it isn't.
 *
 * Hover is ignored outright while pinned. That is what makes it predictable: with hover still
 * tracked underneath, deselecting could pop a stale card back up, and every "sometimes it stays,
 * sometimes it goes" bug lives in that gap.
 */
function hover(change) {
  if (SELECTED) return;                  // pinned wins, unconditionally
  if (HOVERED === change) return;
  HOVERED = change;
  renderTip();
  redraw();
}

/**
 * End a hover unless the cursor is somewhere that should keep it alive — the shape itself, or the
 * card (which is interactive: it carries the decision control).
 *
 * One function because the exits are many and each one used to be its own judgement call: the map
 * had a `mousemove`, the shapes had `mouseleave`, and **nothing at all handled leaving the map** —
 * move the cursor onto the left panel and no further mousemove ever fired, so the card stayed up
 * for good. `#tip` and `#hl` are *siblings* of `#map`, not children, so `#map` only ever sees bare
 * map; every other surface has to report for itself.
 */
function endHoverUnless(el) {
  if (SELECTED || !HOVERED) return;
  if (el && el.nodeType === 1) {
    if (tip.contains(el)) return;
    if (el.classList && el.classList.contains("hit")) return;
  }
  hover(null);
}

function select(change) {
  SELECTED = SELECTED === change ? null : change;   // clicking the same shape again unpins it
  // Pinning takes the hover with it. Otherwise HOVERED goes stale the moment the cursor moves —
  // hover() ignores everything while pinned — and deselecting would resurrect a card for whatever
  // you happened to be over when you clicked, instead of simply closing.
  HOVERED = null;
  renderTip();
  redraw();
  // `id` so the app can light the matching row — `name` alone can't, since bindToFloor re-points
  // names and two floors can carry the same one.
  post("select", { name: SELECTED ? SELECTED.name : null, id: SELECTED ? SELECTED.id : null });
}

/**
 * The app naming the active change (a row was clicked). Selecting and framing, but deliberately
 * NOT posting `select` back: that would echo into the app's own state and fight the click that
 * started it — the same loop the camera mirror is guarded against.
 */
function setActive(id) {
  const change = id == null ? null : CHANGES.find(c => c.id === id);
  if (change === SELECTED) return;                  // already there; don't re-fly under the user
  SELECTED = change || null;
  renderTip();
  redraw();
  if (SELECTED) focusChange(SELECTED);
}

function div(cls, text) {
  const d = document.createElement("div");
  if (cls) d.className = cls;
  if (text != null) d.textContent = text;
  return d;
}

function renderTip() {
  const c = shown();
  if (!c) return renderFeatureTip();
  HOVER_FEATURE = null;                 // a change's card wins: it says strictly more
  tip.style.pointerEvents = "";         // this one IS interactive — restore what the feature card cleared
  while (tip.firstChild) tip.removeChild(tip.firstChild);

  const type = div("t-type");
  const dot = div("t-dot");
  dot.style.background = COLORS[c.type];
  type.appendChild(dot);
  type.appendChild(document.createTextNode(TYPE_LABEL[c.type] || ""));
  tip.appendChild(type);

  /**
   * **The name you gave it wins**, with MapScale's underneath. An edited row IS your value now, so
   * a card still headed by the detected name would be the map disagreeing with the row beside it.
   */
  const mine = c.override || null;
  tip.appendChild(div("t-name", (mine && mine.name) || c.name));
  if (c.detail) tip.appendChild(div("t-detail", c.detail));
  if (mine && mine.details)
    mine.details.forEach(line => tip.appendChild(div("t-mine", line)));

  /**
   * **What this feature will be on the finalised floor.** The preview says it in geometry — the
   * shape is there, ghosted, or purple — and this says it in words, because "ghosted" and "not
   * drawn by us because it is simply the map now" look identical to someone who did not just
   * press the button.
   */
  const out = outcomeOf(c);
  if (out) {
    const dline = div("t-decision");
    const g = drawBadgeGlyph(out === "edited" ? "confirm" : out);
    if (out === "edited") g.style.display = "none";      // the purple rule above already says it
    dline.appendChild(g);
    dline.appendChild(document.createTextNode(
      DECISION_LABEL[out] +
      (previewFate(c) === "ghost" ? " — off the floor"
        : out !== "reject" ? ""
        // ⚠️ Rejecting a `preserved` row is a different act: there is no incoming change to turn
        // down, so what you are rejecting is your OWN earlier override — see `revertOrReset`.
        : c.type === "preserved" ? " — your earlier edit is dropped"
        : " — the published value stays")));
    dline.style.color = outcomeInk(out);
    tip.appendChild(dline);
  }

  // Decide from the card — hovering or pinned, both (Olcay: "how do we change the flags?").
  // It was pinned-only at first, on the theory that a control under a moving cursor is hard to
  // hit; a hover card is actually stationary above its shape and the container-level mousemove
  // keeps it alive while you're over it, so the only thing pinned-only bought was a step.
  //
  // A user override gets the SAME two options the list gives it (Olcay, 2026-08-11) — kept, or
  // kept and flagged to come back to. Not the full three: there is no detected change to confirm,
  // and rejecting your own earlier edit is a destructive act, not a triage button. This card used
  // to offer overrides nothing at all, which would now disagree with the row beside it.
  // Outside a review the card still REPORTS the decision (the badge and the note say it);
  // what it must not do is offer to change it.
  /**
   * ⚠️ **An edited row gets no control here.** Its override supersedes the incoming change, so
   * there is nothing left to confirm or reject — the same reasoning the changelog row follows,
   * where the ✓/✗ pair is replaced by EDITED and Revert. Reverting is the row's job: it owns the
   * fields, and one commit point for an edit is the rule the geometry session already follows.
   */
  if (CAN_DECIDE && !c.override && c.type !== "preserved")
    tip.appendChild(decisionControl(c, ALL_ACTIONS));

  // A pinned card outlives the cursor, so it needs its own way out (clicking the empty map or the
  // same shape also unpins). Hover cards don't get one — they die when the cursor leaves.
  if (SELECTED === c) {
    const x = div("t-close", "✕");
    x.setAttribute("role", "button");
    x.setAttribute("aria-label", "Close");
    x.addEventListener("click", (ev) => { ev.stopPropagation(); select(SELECTED); });
    tip.appendChild(x);
  }

  tip.classList.toggle("pinned", SELECTED === c);
  tip.style.display = "block";
  positionTip();
}

/**
 * The same card, for a feature that is not part of a review: what it is, and what it is called.
 * No decision control — there is no change here to decide about — and no close button, because it
 * only ever exists under the cursor.
 */
/* REACH-ENGINE-START — extracted and tested by scratch/geometry.test.mjs.
   What this screen may TOUCH: the three lists the app posts, and the one function that
   reads all of them. Not pure — it queries the map — so the harness stubs `map`. */
/**
 * The `mainType`s the panel will NOT edit — posted by the app, which owns the taxonomy (this page
