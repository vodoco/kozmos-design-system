 * has none). `null` means "not told yet", and nothing is editable until it arrives: guessing would
 * light up walls.
 *
 * A NEGATIVE set, because that is the closed one. `MAIN_CLASS` defaults anything it does not list
 * to `poi`, so the editable side is open-ended; the floor-plan side is short and finite.
 */
let BLOCKED_TYPES = null;

/**
 * The `mainType`s that raise no hover card — the floor plan itself, chiefly.
 *
 * ⚠️ **Silent, not inert.** These open on a click like anything else (Olcay, 2026-08-16:
 * *"structural click should work though"*); they simply do not announce themselves as the pointer
 * crosses them, because there are hundreds of them on a floor and the card would never be off.
 *
 * `null` means "not told yet", which here means *nothing* is quiet — the opposite default from
 * `BLOCKED_TYPES`, and right for the same reason: the cautious answer for "may I touch this?" is
 * no, and the cautious answer for "may I mention this?" is yes.
 */
let QUIET_TYPES = null;

/**
 * The one `mainType` this screen's section is **about** — `null` on Map Content, where everything
 * is fair game (Olcay, 2026-08-16).
 *
 * Told, not derived. The shell has no taxonomy and cannot know which of the types it is drawing is
 * the section's own; guessing it from the hidden list would mean encoding "which types are system"
 * here, in the one file that has deliberately never held a taxonomy.
 */
let SECTION_TYPE = null;

/**
 * The topmost feature under a point that this gesture is allowed to have, or `null`.
 *
 * ⚠️ **Two different questions, and they now have two different answers** (Olcay, 2026-08-16:
 * *"structural click should work though"*).
 *
 * - **Clicking** may reach anything — every geometry is editable, walls included.
 * - **Hovering** may not, because a hover card is *unsolicited*. Lighting up all ~715 walls on a
 *   floor as the pointer crosses them is noise nobody asked for, and it buries the POI cards the
 *   hover exists for. `quiet` types stay silent under the pointer and open perfectly on a click.
 *
 * That asymmetry is the whole point: **silence is not the same as inert.** The old single rule made
 * structural geometry unhoverable *and* unclickable, which is why it had to go.
 */
function featureAt(point, quiet) {
  let hits = [];
  try { hits = map.queryRenderedFeatures(point) || []; } catch (e) { return null; }
  for (const f of hits) {
    const p = f && f.properties;
    if (!p || !p.fid) continue;
    /**
     * ⚠️ **In a section, only that section's own content is touchable** (Olcay, 2026-08-16:
     * *"Clicking would only edit the network and transitions but not POIs and other indoor data.
     * Similar approach with Geofences and IoT Devices."*).
     *
     * One line, and it covers hover, click, the editor and the panel at once, because every one of
     * them comes through here. The floor plan is still **drawn** underneath — you cannot place a
     * node in a void, and the rooms are the context that makes a corridor mean something — it is
     * simply not what this screen is for, so it does not answer.
     *
     * `null` is Map Content, where everything answers. This is the positive form of the rule and
     * `BLOCKED_TYPES` is the negative one, and they cannot be merged: the editable side is
     * open-ended (an unknown type defaults to POI), so "everything except the network" is not a
     * list anybody can write.
     */
    if (SECTION_TYPE && p.mainType !== SECTION_TYPE) continue;
    // "Not told yet" means nothing is touchable, which is the safe direction — see `editabletypes`.
    if (!BLOCKED_TYPES || BLOCKED_TYPES.has(p.mainType)) continue;
    if (quiet && QUIET_TYPES && QUIET_TYPES.has(p.mainType)) continue;
    return f;
  }
  return null;
}

/** What a CLICK may reach: anything the app has not blocked outright. */
const editableAt = point => featureAt(point, false);
/** What a HOVER may reach: the same, less the types that would be noise. */
const hoverableAt = point => featureAt(point, true);
/* REACH-ENGINE-END */

/** "Retail Space · Cafe" from the tile's own type fields — Title Case, no taxonomy needed here. */
function prettyType(p) {
  const words = t => String(t).split(/[-_]/).map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(" ");
  if (!p || !p.mainType) return "";
  return p.subType ? words(p.mainType) + " · " + words(p.subType) : words(p.mainType);
}

/** A tile property bag is not structured-cloneable as-is; copy the primitives across. */
function plainProps(p) {
  const out = {};
  for (const k of Object.keys(p || {})) {
    const v = p[k];
    if (v === null || ["string", "number", "boolean"].indexOf(typeof v) >= 0) out[k] = v;
  }
  return out;
}

function renderFeatureTip() {
  if (!HOVER_FEATURE) { tip.style.display = "none"; return; }
  while (tip.firstChild) tip.removeChild(tip.firstChild);

  const type = div("t-type");
  const dot = div("t-dot");
  dot.style.background = INK;           // neutral: this is identity, not a diff
  type.appendChild(dot);
  type.appendChild(document.createTextNode(HOVER_FEATURE.typeLabel || "Map content"));
  tip.appendChild(type);
  tip.appendChild(div("t-name", HOVER_FEATURE.name || "Unnamed"));
  tip.appendChild(div("t-detail", "Click to edit"));

  /**
   * ⚠️ **The feature card must not take the pointer.** `#tip` is `pointer-events: auto` because the
   * REVIEW card carries the decision control — but this card carries nothing, sits 14px under the
   * cursor, and so slid straight under the click it was inviting: the canvas never saw a `click`,
   * and "Click to edit" did nothing (Olcay, 2026-08-14).
   */
  tip.style.pointerEvents = "none";
  tip.classList.remove("pinned");
  tip.classList.toggle("below", HOVER_FEATURE.below);
  tip.style.left = HOVER_FEATURE.x + "px";
  tip.style.top = HOVER_FEATURE.y + "px";
  tip.style.display = "block";
}

function positionTip() {
  const c = shown();
  if (!c) return renderFeatureTip();   // the feature card carries its own anchor
  const hit = RESOLVED.find(r => r.change === c);
  if (!hit) { tip.style.display = "none"; return; }
  // anchor to the shape's top edge, not its centroid, so the card never covers what it describes
  let top = Infinity, bottom = -Infinity;
  hit.rings.forEach(r => r.forEach(pt => {
    const p = map.project(pt);
    if (p.y < top) top = p.y;
    if (p.y > bottom) bottom = p.y;
  }));
  const flip = top - tip.offsetHeight - 16 < 0;     // no room above → sit under the shape instead
  tip.classList.toggle("below", flip);
  tip.style.left = map.project(hit.centroid).x + "px";
  tip.style.top = (flip ? bottom : top) + "px";
}

/**
 * The pinned card's ✓ / 🚩 / ✗ control — the map's half of "the list and the map are one thing".
 *
 * It reports the click upward rather than mutating `CHANGES` locally, because the app owns the
 * diff: `ManualReview` holds the decisions (keyed by id), and its next `changes` post is what
 * re-renders this card and the centroid badge. Deciding locally would work right up until the two
 * disagreed, which is the failure this whole protocol is arranged to prevent.
 */
/**
 * ⚠️ **`COLOURED_DECISIONS` and `DECISION_COLORS` were retired 2026-08-25**, along with the flag
 * they were introduced to colour. The ink now lives at the top of this file with the other
 * constants — see `DECISION_INK` and `OVERRIDE_INK`.
 */

const ALL_ACTIONS = [
  ["confirm", "Confirm"],
  ["reject", "Reject"],
];
/**
 * A `preserved` override is already kept, and this card cannot edit — the editing surface is the
 * changelog row, which has the fields and the room for them. So the card reports the state and
 * offers nothing, rather than offering a control the row would then disagree with.
 */
const OVERRIDE_ACTIONS = [];

function decisionControl(c, actions) {
  const row = div("t-actions");
  const list = actions || ALL_ACTIONS;
  const shown = c.decision;
  list.forEach(([kind, label]) => {
    const b = document.createElement("button");
    b.setAttribute("aria-pressed", String(shown === kind));
    b.setAttribute("aria-label", label);
    b.title = label;                       // the only label an icon-only control has
    b.appendChild(drawBadgeGlyph(kind));
    b.addEventListener("click", (ev) => {
      ev.stopPropagation();                // else the map's own handler unpins the card
      // Clicking the pressed one clears it, which is how you get back to undecided from the map.
      post("decision", { id: c.id, name: c.name, decision: shown === kind ? null : kind });
    });
    row.appendChild(b);
  });
  return row;
}

// the ✓ / ✗ mark on its own, for the tooltip's decision row
function drawBadgeGlyph(kind) {
  const s = el("svg", { width:16, height:16, viewBox:"0 0 18 18" });
  const d = kind === "confirm" ? "M4 9.5 L7.5 13 L14 5.5" : "M5 5 L13 13 M13 5 L5 13";
  s.appendChild(el("path", { d, fill:"none", stroke:DECISION_INK, "stroke-width":2, "stroke-linecap":"round" }));
  return s;
}

/* ── floor-plan outline + framing + prefs ────────────────────────────────── */

// Line layers straight off the vector source, so the outline follows tile loading instead of
// freezing whatever was in view when we drew it.
//
// The level filter is ours to apply: MapViewController.updateLayersForCurrentLevel() only rewrites
// layers whose id contains `_ptr` or `rmaps`, so an id like `__fp_wall` is invisible to it and the
// outline otherwise draws EVERY floor of the building at once on top of the current level.
const FP_LAYERS = [];   // ids of the outline layers we've added
let fpLevel = null;     // the level their filters are currently built for

/* FPSRC-ENGINE-START — extracted and tested by scratch/geometry.test.mjs. Pure: which data the
   floor-plan outline should be traced from, and what to call the layers that trace it. */
/**
 * **Three possible sources for the outline, and they are not interchangeable.**
 *
 * - `gj`     — the full GeoJSON render swap is live, so the floor itself is already the draft and
 *              the outline simply follows it.
 * - `draft`  — the app has posted this level's geometry but the floor is still tile-drawn. The
 *              outline traces the DRAFT anyway. This is the review screen: *"Show floor-plan shows
 *              the uploaded one"* (Olcay, 2026-08-25).
 * - `tiles`  — nothing else is available, so the outline traces the last publish.
 *
 * ⚠️ **`draft` deliberately does NOT swap the floor render.** The tiles keep drawing the floor
 * because a review needs BOTH sides of the diff on screen: a removal is a feature the published
 * tiles have and the draft does not, and a floor drawn only from the draft would have nothing under
 * the red shape. Tracing the outline from one source while rendering from another is the whole
 * point — the outline is what the new plan says, the fills are what is live today.
 */
function fpMode(swapLive, draftReady) {
  if (swapLive) return "gj";
  if (draftReady) return "draft";
  return "tiles";
}
/** One layer-id prefix per mode, so a mode change can find its own layers and nobody else's. */
const FP_PREFIX = { gj: "__fp_gj_", draft: "__fp_dr_", tiles: "__fp_" };
/* FPSRC-ENGINE-END */

/** The outline's own GeoJSON sources — the DRAFT, built without cloning a single render layer. */
const FP_DRAFT_SRC = "__fpdr_";
let FP_DRAFT = { names: [], lvl: null };
const fpDraftReady = () => FP_DRAFT.lvl === TARGET.level && FP_DRAFT.names.length > 0;
/** Which mode the layers currently in `FP_LAYERS` were built for. */
let fpMode_ = null;

/**
 * Build one GeoJSON source per source-layer from the level geometry the app posted — **sources
 * only**, no cloned render layers, no verdict, no hiding of tiles.
 *
 * That is the entire difference from `gjBuild()`, and it is why this exists separately rather than
 * calling into the swap: the swap's job is to REPLACE the floor and it earns that with a
 * paint-count verdict (§12). Tracing an outline needs none of that machinery, and taking it on
 * would mean the review map's whole render turned on a fetch that has never been seen to return.
 */
function fpBuildDraftSources() {
  try {
    if (!map || !LEVEL_FEATS.length) return false;
    if (fpDraftReady()) return true;
    const names = ptrSourceLayers();
    if (!names.length) return false;
    // ⚠️ `LEVEL_FEATS`, not `LEVEL_GEOM`: the latter is keyed by fid and holds geometry alone, and
    // grouping needs the property bags — `mainType` decides which source-layer a feature belongs to.
    const { groups } = groupBySourceLayer(names, LEVEL_FEATS, LEVEL_FEATS_LVL);
    const made = [];
    for (const [name, fs] of groups) {
      if (!fs.length || FP_SKIP[name]) continue;   // the big groupings never draw the outline
      const id = FP_DRAFT_SRC + name;
      const data = { type: "FeatureCollection", features: fs };
      if (map.getSource(id)) map.getSource(id).setData(data);
      else map.addSource(id, { type: "geojson", data });
      made.push(name);
    }
    FP_DRAFT = { names: made, lvl: TARGET.level };
    return made.length > 0;
  } catch (e) {
    post("error", { message: "floorplan draft sources: " + e.message });
    return false;
  }
}

// all-expression syntax: mixing the legacy `["==","$type",…]` form with expressions makes MapLibre
// read "$type" as a plain string, and the layer silently matches nothing.
function fpFilter() {
  return ["all",
    ["==", ["geometry-type"], "Polygon"],
    ["any", ["==", ["get", "lvl"], TARGET.level], ["==", ["get", "lvl"], null]]];
}

/**
 * The overlay's ink after the user's transparency: 0 = solid, 1 = invisible (Olcay, 2026-08-18).
 * The historical paint was a baked `line-opacity: 0.5`, which the default t = 0.5 reproduces
 * exactly — the slider's rest position IS the look this overlay has always had, and both
 * directions from it do something. Clamped here too, because a prefs message is just a message.
 */
function fpOpacity() {
  const t = +prefs.floorplanTransparency;
  return isFinite(t) ? Math.max(0, Math.min(1, 1 - t)) : 0.5;
}

function addFloorplan() {
  try {
    // These layers outlive a level switch, and their filter is baked in when they're created — so
    // re-set it whenever the target level has moved, or the previous floor's walls keep drawing
    // underneath the new floor's content. Guarded on the level because setFilter() invalidates the
    // layer, and this runs on every resolve pass.
    if (fpLevel !== TARGET.level) {
      FP_LAYERS.forEach(id => { if (map.getLayer(id)) map.setFilter(id, fpFilter()); });
      fpLevel = TARGET.level;
    }
    /**
     * ⚠️ **Discovered from whichever source the outline is being traced from** — see `fpMode`.
     *
     * The tiles branch reads RENDERED features and keeps the ones on `source_ptr`, which answers
     * *nothing* once the tiles are hidden. Both other branches name their sources outright, which
     * is also why they work for a level that is off-screen: nothing has to have painted first.
     */
    const mode = fpMode(gjLive(), fpDraftReady());
    /**
     * ⚠️ **A mode change tears the old layers down first.** Without this, switching sources leaves
     * the previous mode's outline layers on the map — they are layers of OUR making, so neither
     * `gjHideTiles` nor anything else would ever hide them, and the floor would be traced twice
     * from two different datasets at once. That was already latent for the tiles → gj swap; a third
     * mode made it certain.
     */
    if (fpMode_ !== null && fpMode_ !== mode) {
      for (const id of FP_LAYERS.splice(0)) { try { if (map.getLayer(id)) map.removeLayer(id); } catch (e) {} }
    }
    fpMode_ = mode;

    // `typeHidden` here too: the outline is drawn by layers of OUR making, so nothing else would
    // ever hide them — a geofence zone would keep its outline after its fill had gone.
    const keep = n => n && !FP_SKIP[n] && !typeHidden({ "source-layer": n });
    const layers =
      mode === "gj"    ? GJ.sources.filter(keep)
      : mode === "draft" ? FP_DRAFT.names.filter(keep)
      : [...new Set(map.queryRenderedFeatures()
          .filter(f => f.source === "source_ptr" && keep(srcLayerOf(f)))
          .map(f => srcLayerOf(f)))].filter(Boolean);
    const srcOf = L => mode === "gj" ? GJ_SRC + L : mode === "draft" ? FP_DRAFT_SRC + L : "source_ptr";
    layers.forEach(L => {
      const id = FP_PREFIX[mode] + L;
      if (map.getLayer(id)) return;
      const def = { id, type:"line", source: srcOf(L),
        filter: fpFilter(),
        layout:{ visibility: prefs.floorplan ? "visible" : "none" },
        paint:{ "line-color":"#33425c", "line-width":1, "line-opacity": fpOpacity() } };
      if (mode === "tiles") def["source-layer"] = L;
      map.addLayer(def);
      FP_LAYERS.push(id);
    });
  } catch(e){ post("error", { message: "floorplan: " + e.message }); }
}

// Satellite base map, reusing the MapTiler key the SDK's own style is already configured with.
// Inserted beneath the first indoor layer so the floor plan and highlights stay on top.
function ensureSatellite() {
  if (map.getSource("__sat")) return true;
  try {
    const om = map.getStyle().sources.openmaptiles;
    const key = (String((om && om.tiles && om.tiles[0]) || "").match(/[?&]key=([^&]+)/) || [])[1];
    if (!key) return false;
    map.addSource("__sat", { type:"raster", tileSize:256,
      tiles:["https://api.maptiler.com/tiles/satellite-v2/{z}/{x}/{y}.jpg?key=" + key] });
    // Beneath the first INDOOR layer, whichever source is drawing it — the clones are inserted
    // above the satellite otherwise, and a raster basemap over the floor plan hides the lot.
    const firstIndoor = (map.getStyle().layers
      .find(l => l.source === "source_ptr" || gjIsClone(l.id)) || {}).id;
    map.addLayer({ id:"__sat", type:"raster", source:"__sat", paint:{ "raster-opacity":1 } }, firstIndoor);
    return true;
  } catch(e) { post("error", { message: "satellite: " + e.message }); return false; }
}

// The SDK's building chrome — the footprint extrusion and the building name/icon symbol — sits
// between the viewer and the indoor content on every screen this app has, so it is hidden
// outright (Olcay, 2026-08-10). Exact ids, not a pattern: osm2-buildings-flat is the basemap's
// own and stays. Re-applied from applyPrefs() and the idle pass, because the SDK re-shows its
// layers after level switches and 3D-mode recoveries.
/**
 * **Can the floor be re-rendered from a GeoJSON source, with the vector tiles switched off?**
 *
 * Olcay, 2026-08-16: *"tell me when we see render the map features from geojson source and disable
 * vector tile source. It requires style processing."* It does, and the processing worth doing is
 * **derivation, not authorship**: clone each of the SDK's own `source_ptr` layers, repoint it at a
 * GeoJSON source, and keep its paint and layout exactly. Hand-writing a lookalike style would be
 * inventing colours the product already has — the thing this project refuses to do everywhere else.
 *
 * ⚠️ **One unknown decides whether that clone is cheap or hard.** A vector layer selects its rows
 * with `source-layer`; a GeoJSON source has no such thing, so each cloned layer needs an equivalent
 * *filter*. If `source-layer` names are `mainType` values, the substitution is one filter clause
 * and the job is small. If they are not, every layer needs a mapping nobody has, and the job is a
 * different size entirely.
 *
 * So this measures it rather than guessing, once, and prints the answer. Runs on the first `idle`
 * with features rendered and never again — it is a report, not a monitor.
 */
let styleReported = false;
function reportStyleShape() {
  if (styleReported || !map) return;
  try {
    const layers = map.getStyle().layers || [];
    const ptr = layers.filter(l => l.source === "source_ptr");
    if (!ptr.length) return;                       // the indoor style has not arrived yet
    const feats = map.queryRenderedFeatures() || [];
    if (!feats.length) return;                     // nothing painted yet; try again next idle
    styleReported = true;

    const srcLayers = [...new Set(ptr.map(l => l["source-layer"]).filter(Boolean))];
    const mainTypes = new Set();
    for (const f of feats) if (f.properties && f.properties.mainType) mainTypes.add(f.properties.mainType);
    /**
     * ⚠️ **Compared with the hyphens stripped, because that is the actual relationship.**
     *
     * Observed 2026-08-16 from the style's own complaints — `fill_industrial-space_ptr` selects
     * source layer `industrialspace`, `fill_accommodation-space_ptr` selects `accommodationspace`.
     * So a source layer is its `mainType` **de-hyphenated**, not equal to it. Testing raw equality
     * would have reported a flat zero and made a one-line transform look like a mapping problem —
     * the wrong answer, arrived at confidently, which is the failure this report exists to avoid.
     */
    const flat = t => String(t).replace(/-/g, "").toLowerCase();
    const flatTypes = new Set([...mainTypes].map(flat));
    const matched = srcLayers.filter(n => flatTypes.has(flat(n)));
    const exact = srcLayers.filter(n => mainTypes.has(n)).length;
    const byType = {};
    for (const l of ptr) byType[l.type] = (byType[l.type] || 0) + 1;

    console.info(
      "%c[style] can we render this floor from GeoJSON?",
      "font-weight:bold",
      "\n  layers total:            ", layers.length,
      "\n  on source_ptr:           ", ptr.length, byType,
      "\n  distinct source-layers:  ", srcLayers.length,
      "\n  …matching a mainType:    ", matched.length + "/" + srcLayers.length,
      "(" + exact + " of them exactly; the rest differ only by hyphens)",
      matched.length === srcLayers.length
        ? "— ✅ every source-layer maps to a mainType, so a cloned layer needs one filter clause " +
          "on a de-hyphenated mainType"
        : "— ⚠️ NOT all map; these have no mainType even de-hyphenated, and would each need one: " +
          JSON.stringify(srcLayers.filter(n => !flatTypes.has(flat(n))).slice(0, 12)),
      "\n  mainTypes rendered:      ", mainTypes.size,
      "\n  sample source-layers:    ", JSON.stringify(srcLayers.slice(0, 8)),
    );
  } catch (e) {
    console.info("[style] report failed —", e && e.message);
  }
}

/* ── the floor, drawn from GeoJSON instead of from the vector tiles ──────── */

/**
 * **Render the floor from the level's GeoJSON and switch the vector tiles off.**
 *
 * Olcay, 2026-08-16: *"tell me when we see render the map features from geojson source and disable
 * vector tile source. It requires style processing."*
 *
 * ## The one rule: derivation, not authorship
 *
 * Every layer here is a **clone of one of the SDK's own** `source_ptr` layers, with its paint,
 * layout, filter and zoom range copied verbatim and only two things changed — the source it reads,
 * and the `source-layer` it no longer has. Hand-writing a lookalike style was the alternative and
 * is the wrong lever: it would mean inventing colours the product already ships, and they would
 * drift the first time the platform restyled a floor.
 *
 * A vector layer picks its rows with `source-layer`, and a GeoJSON source has none. **A source
 * layer is its `mainType` with the hyphens stripped** — observed from the style's own complaints
 * (`fill_industrial-space_ptr` selects `industrialspace`) — so the substitution is not a filter at
 * all: the features are **split into one source per source-layer** up front, and each clone reads
 * the source that holds exactly the rows its original selected. That keeps the original's own
 * filter untouched rather than composing onto it, which matters more than it looks: the SDK writes
 * those filters in legacy syntax in places, and `["all", <expression>, <legacy>]` is not a thing.
 *
 * ## Why it is worth the trouble
 *
 * ⚠️ **An edit was invisible on the map.** The editor drew its own overlay while the floor

 * adjacency list is directed by construction: A naming B does not oblige B to name A. So an edge
 * both ends declare is **two-way**, and one only its origin declares is **one-way** — an escalator,
 * a one-way corridor, a lane you cannot walk back through. Nothing was invented to draw the arrows;
 * they are the shape of the data.

 * of itself — invisible at rest and doubled wherever the line is translucent.

 * just aren't drawn".

 * without leaving the floor. That is not a definition anybody chose: it is what the data already
 * is, and Olcay's sentence names its boundary precisely. `neighbors` stay inside a network;
 * `transitionNeighbors` are how one network reaches another, whether that other is upstairs or is

 * stands in; the transition is the thing that leaves. Walking transitions as ordinary edges would

 * different from deleting a corner. A polygon with a corner removed is still one polygon; a network

      // A transition to a node that has gone is a way out of the building that no longer exists.

 * transition nodes."* It is, and the taxonomy says so precisely: `path-node` is the network itself,
 * while `elevator-node`, `escalator-node`, `stairs-node`, `custom-transition` and
 * `building-entrance-exit` are all ways OFF this floor.
 *
 * ⚠️ **This is the one place in the render that is authorship rather than derivation**, and it is
 * deliberate, because there is nothing here to derive. The product draws the whole network with a
 * single layer, `symbol_wayfinding-network_ptr`, and *none* of the six subTypes has a sprite — every
 * one of them falls through the icon cascade to `default-poi`. So the platform's own answer is
 * several hundred identical pin markers, which cannot express the distinction Olcay is asking for
 * and is exactly what buried the floor in the screenshot that started this. Two circle layers,
 * sized to be read at a glance and distinguished by what the taxonomy already distinguishes.
 *
 * The SDK's own symbol layer stays hidden even here — `hiddentypes` never lists this type on this
 * section, so `applyHiddenTypes` leaves it alone; it is hidden by `WF_HIDE` below for its own
 * reason, which is that it is the pin storm.
 */

const WF_NODE = "__wf_node", WF_TRANSITION = "__wf_transition";
const WF_EDGE = "__wf_edge", WF_ARROW = "__wf_arrow", WF_EDGE_SRC = "__wf_edges";
/**
 * **The buffer** — Olcay, 2026-08-16: *"We need a bit of buffer so it's easy to click and edit."*
 *
 * A path node draws two or three pixels across: enough to read as texture, nowhere near enough to
 * hit. The **ink and the target are two layers**, exactly as they are for a polygon's edges — the
 * mark stays small and honest about where the corridor runs, and an invisible one sits under it at
 * a size the hand can actually manage.
 */
const WF_NODE_HIT = "__wf_node_hit", WF_EDGE_HIT = "__wf_edge_hit";
const WF_SL = "wayfindingnetwork";
/** Mirrors `NETWORK_SUBTYPE` in the app's taxonomy — the one subType that is network, not exit. */
const WF_NETWORK_SUBTYPE = "path-node";
/** The edge under the pointer while editing: what Delete would unlink. */
const WF_CUT = "__wf_cut";
/**
 * How big a node draws, at rest and in edit mode — Olcay, 2026-08-16: *"onHover the dots should not
 * get larger… nodes should get larger in edit mode."*
 *
 * ⚠️ **Size means one thing here, and it is not "you are pointing at this".** A hover is a question
 * and an edit is a state, and only the state changes what you can *do* with a node — so only the
 * state changes its size. Hovering recolours in place; editing makes every node of the network a
 * handle big enough to grab, which is what the buffer was already quietly promising.

const wfR = (a, b, c) => ["interpolate", ["linear"], ["zoom"], 15, a, 18, b, 21, c];
const WF_R = {
  node: wfR(1.2, 2.6, 4.5), nodeEdit: wfR(3, 5, 7),
  transition: wfR(2.5, 5, 8), transitionEdit: wfR(4, 7, 10),

const WF_HIT_R = 11, WF_HIT_W = 14;
/** Our own node source: the only one that can carry which network a node belongs to. */
const WF_NODE_SRC = "__wf_nodes";
/**
 * ⚠️ Invented, and the only colours in this file that are. Every other colour here is either the
 * diff palette or the product's own, and these have neither: the DS has no token for a wayfinding
 * node and the SDK's layer carries no paint to copy. Slate for the network, so a few hundred of
 * them read as texture rather than as content, and the theme blue for a transition, which is the
 * thing you are actually looking for when you open this section.

/**
 * ⚠️ **The highlight has to be a colour you can SEE at three pixels** (Olcay, 2026-08-16: *"nodes
 * doesn't highlight when selected. Also onHover highlight is gone too. there should be a color
 * change."*).
 *
 * It was `#0b369c` — the editor's own handle navy — filled over `#7A8699` slate at a radius of two
 * or three pixels. Technically a different colour; on a screen, the same grey dot. The lesson is
 * not about these two values: **a mark that only differs in lightness disappears at the size the
 * thing is actually drawn**, and this network draws small on purpose.
 *
 * So the lit state changes **hue**, not shade — sky against slate — and the selected state uses the
 * editor's navy with a white collar, which separates it from both. Red is the palette's own removal
 * colour and means here what it means everywhere: this is what goes if you press Delete.

const WF_COLOUR = { node: "#7A8699", transition: "#2563EB", edge: "#9AA4B4", arrow: "#2563EB",

/** The SDK's own pin layer for this type: hidden while we draw the network ourselves. */
const WF_HIDE = "symbol_wayfinding-network_ptr";
let wfLevel = null, wfSource = null;

/** Which source holds the nodes — the GeoJSON one once the render has swapped, else the tiles. */
function wfSourceOf() {
  /**
   * **Our own, built from the `/paths` fetch, whenever we have it.** It is the only source that
   * carries the network id each node belongs to — and a highlight that must name four hundred fids
   * in a filter rather than compare one number is a highlight that costs a frame on every hover.
   *
   * ⚠️ The tiles stay the fallback and that matters: if the paths fetch fails there are still nodes
   * in the vector tiles, and a section drawing nothing at all is a worse answer than one drawing
   * nodes it cannot group.
   */
  if (WF_NODE_FC && WF_NODE_FC.features.length) return { source: WF_NODE_SRC, sourceLayer: null };
  const gj = GJ_SRC + WF_SL;
  /**
   * ⚠️ **Only if that source actually holds nodes** (Olcay, 2026-08-16: *"wayfinding network path
   * should be always visible when wayfinding network section is selected"*).
   *
   * The render swap can go live on a floor whose draft `/features` response carries rooms and walls
   * but no wayfinding nodes — the two come from different endpoints, and only `/paths` is named for
   * this one. Preferring the GeoJSON source on the strength of the swap alone would then repoint
   * these layers at an empty collection and the whole network would **disappear the moment the
   * floor render succeeded**, which is the one thing this section may not do. The tiles still have
   * the nodes; if the GeoJSON does not, the tiles are the answer.
   */
  const n = gjLive() && GJ.counts ? (GJ.counts.get(WF_SL) || 0) : 0;
  if (n > 0 && map.getSource(gj)) return { source: gj, sourceLayer: null };
  return { source: "source_ptr", sourceLayer: WF_SL };
}

/**
 * `network` picks the path-nodes; otherwise everything else this type has, which is the transitions.
 *
 * Stated as "is / is not the network subType" rather than as a list of the five transitions, for
 * the same reason the app's `isTransitionNode` is: a transition added to the taxonomy tomorrow
 * should draw as a transition without anybody editing this file.
 */
function wfFilter(network) {
  return ["all",
    ["any", ["==", ["get", "lvl"], TARGET.level], ["==", ["get", "lvl"], null]],
    network ? ["==", ["get", "subType"], WF_NETWORK_SUBTYPE]
            : ["!=", ["get", "subType"], WF_NETWORK_SUBTYPE]];
}

function wfRemove() {
  for (const id of [WF_ARROW, WF_EDGE_HIT, WF_EDGE, WF_NODE_HIT, WF_NODE,
                    WF_TRANSITION, WF_CUT])
    try { if (map.getLayer(id)) map.removeLayer(id); } catch (e) {}
  for (const id of [WF_EDGE_SRC, WF_NODE_SRC])
    try { if (map.getSource(id)) map.removeSource(id); } catch (e) {}
  wfSource = null;
  wfLevel = null;
  /**
   * ⚠️ **`WF_EDGES` is NOT cleared here, and that one line was the bug** (Olcay, 2026-08-16:
   * *"edges (lines) disappear after a while"*).
   *
   * This function runs whenever the layers have to be rebuilt — most often because the render swap
   * went live and the nodes moved from the tiles to the GeoJSON source, which happens a few frames
   * after load. *"After a while"* is exactly that. It used to throw the computed edges away with
   * the layers, and the only thing that ever rebuilt them was a fresh `levelpaths` message — which
   * does not come again for a level already fetched. So the layers came back, the nodes with them,
   * and the lines were re-created **empty and stayed that way**.
   *
   * The edges are derived from `WF_NODES`, which is the app's data and still here. Removing a
   * layer is not a reason to forget what it was drawing.

}

/** The level's nodes, as the app fetched them, and the edges built from their adjacency. */
let WF_NODES = [], WF_EDGES = null;
/** The same nodes as GeoJSON this file can draw, and the networks they fall into. */
let WF_NODE_FC = null, WF_NETS = null;

/**
 * A single arrowhead, drawn into a canvas and handed to the style at runtime.
 *
 * ⚠️ **Because there is no sprite to point at.** MapLibre draws a direction marker as an `icon-image`
 * on a `symbol-placement: "line"` layer, and the icon has to come from the style's sprite sheet —
 * which on this instance **404s** (§5), so every taxonomy icon in the app is already an empty box.
 * An image added with `addImage` belongs to the map rather than to the sheet, so it works whatever
 * the sprite is doing. Drawn at 2× and declared as such, so it stays crisp on a retina screen.

function wfEnsureArrow() {

    if (map.hasImage(WF_ARROW)) return true;
    const s = 14, c = document.createElement("canvas");
    c.width = c.height = s * 2;
    const g = c.getContext("2d");

    g.beginPath();
    g.moveTo(s * 0.78, s / 2); g.lineTo(s * 0.30, s * 0.24); g.lineTo(s * 0.30, s * 0.76);

    g.fillStyle = WF_COLOUR.arrow;
    g.fill();
    g.lineWidth = 1;
    g.strokeStyle = "rgba(255,255,255,.9)";
    g.stroke();

      data: new Uint8Array(g.getImageData(0, 0, s * 2, s * 2).data.buffer) }, { pixelRatio: 2 });
    return true;
  } catch (e) { post("error", { message: "wayfinding arrow: " + e.message }); return false; }
}

/**
 * The edges, building them from the nodes if they are not built yet.
 *
 * ⚠️ Never assume they survive a layer rebuild — see `wfRemove`. The nodes are the source of truth
 * and the edges are derived from them, so this can always answer.
 */
function wfEnsureEdges() {
  if (!WF_EDGES) wfBuildEdges(true);
  return WF_EDGES;
}

/** Rebuild the edge collection from the nodes the app last posted, and push it to the source. */
function wfBuildEdges(quiet) {

  WF_NETS = comp.list;
  /**

   * hovering a whole network one comparison — `net == 3` — instead of a filter naming every fid in
   * it, rebuilt on every mouse move.

  const netOf = f => (comp.of.has(f) ? comp.of.get(f) : -1);

    features: (WF_NODES || []).filter(n => n && n.fid && n.at).map(n => ({
      type: "Feature",
      properties: {
        fid: n.fid, name: n.name || "", subType: n.subType || "",
        // `mainType`, because everything downstream asks a feature what it is — the hover card, the
        // section rule, the panel — and these features are ours rather than the platform's.

    built.edges.length, "edges (" + built.oneway + " one-way) ·",
    WF_NETS.length, "network" + (WF_NETS.length === 1 ? "" : "s"),
    WF_NETS.length ? "of " + WF_NETS.slice(0, 8).map(n => n.size).join(", ") + " nodes" : "",

    built.dangling ? "· ⚠️ " + built.dangling + " neighbour(s) not on this level" : "");

   * the app displays it** — the same division `onFeatures` and `onTypes` already follow, and the
   * reason the component walk lives here rather than being written a second time in the app.

function wfPushEdges() {
  try {
    const e = map && map.getSource(WF_EDGE_SRC);
    if (e) e.setData({ type: "FeatureCollection", features: WF_EDGES || [] });
    const n = map && map.getSource(WF_NODE_SRC);
    if (n && WF_NODE_FC) n.setData(WF_NODE_FC);

/**
 * Drag a network node and its corridors come with it (Olcay: *"easy to edit"*).
 *

 * lines touching this node rather than rebuilding the graph. A network whose edges lag behind the
 * node being moved looks like the edit failed.

function wfNodeMoved(fid, at) {
  if (!WF_EDGES || !fid || !at) return;
  // `WF_NODES` is the truth everything else is derived from, so it moves too — otherwise the next
  // rebuild (a delete, a level pass) would put the node back where it started.
  for (const n of WF_NODES || []) if (n.fid === fid) n.at = at.slice();

  // The node's own drawing is ours now too, so it has to move with its lines.
  if (WF_NODE_FC) for (const f of WF_NODE_FC.features)
    if (f.properties.fid === fid) { f.geometry.coordinates = at.slice(); moved++; }

}

/**
 * **What colour every node and edge is, right now** — Olcay, 2026-08-16, twice: *"there should be a
 * color change"*, then *"hover and selected states not working on the nodes."*
 *
 * ⚠️ **This replaced three layers stacked over the nodes, and the layers were the bug.** The hover
 * mark, the selection and the current node were each a separate circle layer above `WF_NODE`,
 * filtered to the right features. Every filter was provably right — a harness set them and read
 * them back — and on screen nothing changed, twice. Stacking a layer over another at the same
 * radius depends on draw order, on both layers surviving every rebuild, and on nothing in the SDK's
 * re-assertion passes touching either: three things to be right, none of them visible when wrong.
 *

 * is the one drawing the dot, and its colour is a function of the state.
 *
 * The states, in the order they win — most specific first, which is how `case` evaluates:
 *
 * | | |
 * |---|---|
 * | the node you are **on** while editing | white with a navy ring — you are about to move this one |
 * | **selected** | navy with a white collar |
 * | in the **lit** network | sky: a different **hue** from the slate, not a shade of it |
 * | otherwise | slate for a path node, blue for a transition |

let wfHoverNet = -1;
function wfPaint() {
  if (!map || !map.getLayer(WF_NODE)) return;
  try {
    const sel = GEOM && GEOM.kind === "network" && GEOM.sel.size
      ? [...GEOM.sel].slice(0, WF_SEL_CAP) : [];
    /**
     * ⚠️ `any` of `==` rather than `["in", …]` — trap 10: `in` throws on a feature with no `fid`,
     * and one throwing expression takes the whole layer down, so selecting one node would cost you
     * the network.

    const isSel = sel.length ? ["any", ...sel.map(f => ["==", ["get", "fid"], f])] : false;
    const isCur = wfEditing && wfEditing.fid ? ["==", ["get", "fid"], wfEditing.fid] : false;
    /**
     * While editing, the **corridors** carry the lit state and the nodes do not: lighting all 926 of
     * them paints over the two states that matter in there — which is selected, and which you are
     * on. Hovering, where there is no selection to bury, lights both.

    const litNet = wfEditing ? wfEditing.net : wfHoverNet;
    const isLit = litNet >= 0 ? ["==", ["get", "net"], litNet] : false;
    const nodeLit = wfEditing ? false : isLit;

    for (const [id, base] of [[WF_NODE, WF_COLOUR.node], [WF_TRANSITION, WF_COLOUR.transition]]) {
      if (!map.getLayer(id)) continue;
      map.setPaintProperty(id, "circle-color",
        ["case", isCur, "#ffffff", isSel, WF_COLOUR.sel, nodeLit, WF_COLOUR.hl, base]);
      map.setPaintProperty(id, "circle-stroke-color",
        ["case", isCur, WF_COLOUR.sel, "#ffffff"]);
      map.setPaintProperty(id, "circle-stroke-width",
        ["case", isCur, 2.5, isSel, 1.5, id === WF_TRANSITION ? 1.5 : 0]);
    }
    if (map.getLayer(WF_EDGE)) {
      /**
       * ⚠️ **An edge is selected when both of its ends are** — the same rule a room's edges follow,
       * and it costs nothing: the selection is already the two nodes. It also means a lasso that
       * happens to catch both ends of a corridor reports that corridor as selected, correctly, with
       * nobody having written it.
       */
      const selEdge = sel.length
        ? ["all", ["any", ...sel.map(f => ["==", ["get", "from"], f])],
                  ["any", ...sel.map(f => ["==", ["get", "to"], f])]] : false;

        ["case", selEdge, WF_COLOUR.sel, isLit, WF_COLOUR.hl, WF_COLOUR.edge]);
      map.setPaintProperty(WF_EDGE, "line-width", ["case",
        selEdge, ["interpolate", ["linear"], ["zoom"], 15, 2, 18, 3.2, 21, 4.8],
        isLit, ["interpolate", ["linear"], ["zoom"], 15, 1.4, 18, 2.4, 21, 3.6],
        ["interpolate", ["linear"], ["zoom"], 15, 0.6, 18, 1.4, 21, 2.4]]);

}

/** Which end of an edge the pointer is nearer — the one you were actually pointing at. */
function wfNearerEnd(line, point) {
  try {
    const a = wfNodeAt(line[0]), b = wfNodeAt(line[1]);
    if (!a) return line[1];
    if (!b) return line[0];
    const pa = map.project(a), pb = map.project(b);
    const [x, y] = Array.isArray(point) ? point : [point.x, point.y];
    return Math.hypot(pa.x - x, pa.y - y) <= Math.hypot(pb.x - x, pb.y - y) ? line[0] : line[1];
  } catch (e) { return line[0]; }
}

/** Where a node is, from our own collection. */
function wfNodeAt(fid) {
  if (!WF_NODE_FC) return null;
  for (const f of WF_NODE_FC.features)
    if (f.properties.fid === fid) return f.geometry.coordinates;
  return null;
}

/** A node's property bag, for a click that arrived by way of one of its edges. */
function wfPropsOf(fid) {
  if (!WF_NODE_FC) return {};
  for (const f of WF_NODE_FC.features)
    if (f.properties.fid === fid) return Object.assign({}, f.properties);
  return {};
}

/**
 * **Hovering lights the whole network** — Olcay, 2026-08-16: *"the whole network should highlight
 * when hovered."*
 *
 * It began as the SDK's own mark, which draws a **map pin** for a point feature: a green teardrop
 * the size of a building, planted over the very corridors you are inspecting. That is the right
 * mark for finding a shop on a floor and the wrong one for reading a graph — it answers *"where is
 * it?"* when the question here is *"what is this part of?"*.
 *
 * Then it lit one hop, then the run between junctions, and it is now the whole network — which is
 * where it should have started. The network is the **entity**; you do not highlight part of an
 * entity because there is a fork in it.
 *
 * ⚠️ **One comparison, not four hundred.** Every node and edge carries the id of the network it
 * belongs to (see `wfBuildEdges`), so the filter is `net == n`. Naming every fid would rebuild a
 * four-hundred-term expression on every mouse move across a concourse.
 *
 * A line and a node are two ways of pointing at the same network, so they take the same route in:
 * `from` is one node's `fid`, or an edge as `[fromFid, toFid]`.
 */
const WF_NONE = ["==", ["get", "fid"], " none"];
let wfHover = null;
function wfHighlight(from) {
  // While a network is being edited the mark belongs to the edit, not to the pointer.
  if (wfEditing) return;
  const fid = Array.isArray(from) ? from[0] : from || null;
  if (wfHover === fid) return;
  wfHover = fid;
  try {
    if (!fid) { wfHoverNet = -1; wfPaint(); highlightFeatures(null); return; }
    wfHoverNet = fid ? wfNetOf(fid) : -1;
    wfPaint();
    /**
     * No network id means the nodes are coming from the **tiles**, because the paths fetch could not
     * answer — there is no graph to light. The SDK's own mark on the one node under the pointer is
     * at least honest about how much is known.
     */
    highlightFeatures(fid && wfHoverNet < 0 ? { fid } : null);
  } catch (e) {}
}

/**
 * **Edit mode for a whole network** — Olcay, 2026-08-16: *"I should be able to edit the whole
 * network. Once in edit mode we should keep it highlighted. Nodes should get larger in edit mode
 * when I'm editing each. Now highlight the current node while editing."*
 *
 * Three states, three marks, and each says a different thing:
 *
 * | | |
 * |---|---|
 * | at rest | the network draws small — texture you can read a floor through |
 * | hovered | it **recolours in place**, because a hover is a question and asking one should not resize the answer |
 * | edited | every node of it **grows into a handle**, the network stays lit for as long as you are in it, and the node you are on wears a white collar |
 *
 * ⚠️ **The growing happens on the map's own layers, not by drawing four hundred SVG handles.** The
 * editor draws a room's corners as SVG because there are eight of them; a concourse network has
 * hundreds, and one `setPaintProperty` is the difference between a handle you can grab and a
 * browser you cannot use.
 */
let wfEditing = null;
function wfSetEditing(net, fid) {
  wfEditing = net == null || net < 0 ? null : { net, fid };
  try {
    if (!map.getLayer(WF_NODE)) return;
    const on = !!wfEditing;
    map.setPaintProperty(WF_NODE, "circle-radius", on ? WF_R.nodeEdit : WF_R.node);
    map.setPaintProperty(WF_TRANSITION, "circle-radius", on ? WF_R.transitionEdit : WF_R.transition);
    if (!on) {
      wfHover = null; wfHoverNet = -1;
      try { map.setFilter(WF_CUT, WF_NONE); } catch (e) {}
    }
    // The network you are editing stays lit for as long as you are in it — hover cannot take the
    // mark away, because while editing the mark is no longer answering a question about the pointer.
    // Hover cannot take the mark away from an edit in progress.
    if (on) wfHover = "editing";

}

/**
 * The selected nodes, marked. Filled rather than ringed, and the same size as the handle, for the
 * reason the hover mark is: size says *"you can move this"*, and every node in edit mode already
 * can. Selection is about **which** ones, so selection changes colour.
 */
function wfSetSelected() { wfPaint(); }

/**
 * The edge under the pointer while editing, held so Delete knows what it would unlink.
 *
 * ⚠️ **Hover is the whole selection mechanism for an edge**, and deliberately so: an edge has no
 * `fid`, so it cannot be selected, kept, listed or reported like a node. Making one selectable
 * would mean inventing an identity for a thing the platform does not have one for — which is the
 * same refusal Split's second piece ran into. Pointing at it is enough to act on it.
 */

  const key = e ? e.join(" ") : null;

  wfCutKey = key;
  if (GEOM && GEOM.kind === "network") GEOM.cut = e;
  try {
    map.setFilter(WF_CUT, e
      ? ["all", ["==", ["get", "from"], e[0]], ["==", ["get", "to"], e[1]]] : WF_NONE);

let wfCutKey = null;

/** Every node of one network, as the editor wants them: `{ fid, at }`, ready to drag. */
function wfNetworkNodes(net) {
  if (!WF_NODE_FC) return [];
  const mine = new Set(WF_NODE_FC.features.filter(f => f.properties.net === net)
                                          .map(f => f.properties.fid));
  /**
   * ⚠️ **The whole node, adjacency included** — not just where it is. Deleting one rewrites its
   * neighbours' links, so the editor's undo has to be able to put those back; a snapshot of
   * coordinates alone would restore the dots and leave the corridors wrong.
   */
  return (WF_NODES || []).filter(n => n && mine.has(n.fid))
    .map(n => JSON.parse(JSON.stringify(n)));
}

/**
 * Put a network's nodes back into the level and rebuild everything from them.
 *
 * `WF_NODES` is the single truth — the edges, the components and the collections the map draws are
 * all derived from it — so a structural edit writes there and lets the rest fall out, rather than
 * patching four things and hoping they agree.
 */
function wfReplaceNetwork(originalFids, nodes) {
  const gone = new Set(originalFids || []);
  const rest = (WF_NODES || []).filter(n => n && !gone.has(n.fid));
  WF_NODES = rest.concat(nodes || []);
  wfBuildEdges(true);
}

/** Which network a node belongs to, or `-1` when we do not know. */
function wfNetOf(fid) {
  if (!WF_NODE_FC) return -1;
  for (const f of WF_NODE_FC.features) if (f.properties.fid === fid) return f.properties.net;
  return -1;
}

function wfEdgeAt(point) {
  try {
    // The HIT layer, not the visible one — the buffer is the whole point, and a 1px line is not
    // something anybody can point at.
    const id = map.getLayer(WF_EDGE_HIT) ? WF_EDGE_HIT : WF_EDGE;
    if (!map.getLayer(id)) return null;
    const hit = (map.queryRenderedFeatures(point, { layers: [id] }) || [])[0];
    const p = hit && hit.properties;
    return p && p.from && p.to ? [p.from, p.to] : null;
  } catch (e) { return null; }
}

function applyWayfinding() {
  if (!map) return;
  try {
    /**
     * Only when we have been TOLD a list that leaves this type out — i.e. its own section is the
     * one on screen. `null` means nobody has said anything, which is every other screen in the app,
     * and those must go on looking exactly as they did.
     */
    const want = !!HIDDEN_FLAT && !HIDDEN_FLAT.has(flatType("wayfinding-network"));
    if (!want) return wfRemove();

    const src = wfSourceOf();
    // The render swap changes which source holds the nodes underneath us, so the layers are rebuilt
    // rather than repointed — a layer's source is fixed once it is added.
    if (wfSource && wfSource !== src.source) wfRemove();
    if (!map.getLayer(WF_NODE)) {
      const base = { source: src.source, type: "circle" };
      if (src.sourceLayer) base["source-layer"] = src.sourceLayer;
      if (src.source === WF_NODE_SRC && !map.getSource(WF_NODE_SRC))
        map.addSource(WF_NODE_SRC, { type: "geojson",
          data: WF_NODE_FC || { type: "FeatureCollection", features: [] } });
      /**
       * **The edges go in first, so the nodes sit on top of them.** A corridor drawn over the node
       * it ends at hides exactly the thing that tells you what kind of node it is.
       *
       * Their own GeoJSON source, not the tiles': an edge is not a feature anywhere in Pointr Cloud
       * — it is the adjacency between two nodes, and this is the only place it exists as geometry.
       */
      if (!map.getSource(WF_EDGE_SRC))
        map.addSource(WF_EDGE_SRC, { type: "geojson",
          data: { type: "FeatureCollection", features: wfEnsureEdges() } });
      map.addLayer({ id: WF_EDGE, type: "line", source: WF_EDGE_SRC,
        layout: { "line-cap": "round" },
        paint: {
          "line-color": WF_COLOUR.edge,
          "line-width": ["interpolate", ["linear"], ["zoom"], 15, 0.6, 18, 1.4, 21, 2.4],
          "line-opacity": 0.9,
        } });
      /**
       * ⚠️ **Arrows on the ONE-WAY edges only.** Two-way is the ordinary case on a floor and
       * marking it would put an arrowhead every 70px across the whole network — the same mistake as
       * the pin storm, in a different shape. The exception is what needs saying, so an edge with no
       * arrow reads as "you can walk this both ways", which is what it means.
       */
      if (wfEnsureArrow())
        map.addLayer({ id: WF_ARROW, type: "symbol", source: WF_EDGE_SRC,
          filter: ["==", ["get", "oneway"], true],
          layout: {
            "symbol-placement": "line",
            "symbol-spacing": 70,
            "icon-image": WF_ARROW,
            "icon-size": ["interpolate", ["linear"], ["zoom"], 15, 0.4, 18, 0.7, 21, 1],
            // To the LINE's bearing, not the screen's — an arrow that stays upright while the map
            // rotates is pointing at nothing.
            "icon-rotation-alignment": "map",
            "icon-allow-overlap": true,
            "icon-ignore-placement": true,
          } });
      /**
       * ⚠️ **The buffer, and it goes UNDER the ink.** Invisible (0.001 opacity, because a layer at
       * zero is not hit-tested), wider than what you can see, and beneath the marks so it never
       * changes what the floor looks like. What you can hit becomes a target the hand can manage
       * while what you see stays honest about where the corridor actually runs.
       */
      map.addLayer({ id: WF_EDGE_HIT, type: "line", source: WF_EDGE_SRC,
        paint: { "line-color": "#000", "line-opacity": 0.001, "line-width": WF_HIT_W } });
      /**
       * The edge the pointer is on while a network is being edited — drawn in the palette's own
       * removal red, which means here exactly what it means everywhere else in this file: **this is
       * what goes if you press Delete.** Above the lit edges, below the nodes.
       */
      map.addLayer({ id: WF_CUT, type: "line", source: WF_EDGE_SRC,
        filter: WF_NONE,
        layout: { "line-cap": "round" },
        paint: {
          "line-color": WF_COLOUR.cut,
          "line-width": ["interpolate", ["linear"], ["zoom"], 15, 2.4, 18, 4, 21, 6],
        } });
      map.addLayer(Object.assign({ id: WF_NODE_HIT, filter: ["any", wfFilter(true), wfFilter(false)],
        paint: { "circle-radius": WF_HIT_R, "circle-color": "#000", "circle-opacity": 0.001 } }, base));
      map.addLayer(Object.assign({ id: WF_NODE, filter: wfFilter(true),
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 15, 1.2, 18, 2.6, 21, 4.5],
          "circle-color": WF_COLOUR.node,
          "circle-opacity": 0.85,
        } }, base));
      map.addLayer(Object.assign({ id: WF_TRANSITION, filter: wfFilter(false),
        paint: {
          "circle-radius": ["interpolate", ["linear"], ["zoom"], 15, 2.5, 18, 5, 21, 8],
          "circle-color": WF_COLOUR.transition,
          // A white collar, so a transition still reads as one where the nodes are densest.
          "circle-stroke-color": "#ffffff",
          "circle-stroke-width": 1.5,
        } }, base));
      /**
       * ⚠️ **No mark layers above these two.** The hover, the selection and the current node
       * used to be three more circle layers stacked here, each filtered to the right features —
       * and twice they were reported as simply not working, with every filter provably correct.
       * They are paint expressions on these layers now: see `wfPaint`.
       */
      wfSource = src.source;
      wfLevel = TARGET.level;
      /**
       * ⚠️ **A rebuild wipes every filter, so the edit's marks are re-asserted here.** The layers
       * are re-created whenever the node source flips — which happens a few frames after load, when
       * the `/paths` fetch lands and the nodes move off the tiles. An edit begun before that would
       * otherwise lose its highlight, its selection and its current-node mark, and the only symptom
       * would be that nothing looks selected.
       */
      if (wfEditing) { wfSetEditing(wfEditing.net, wfEditing.fid); wfSetSelected(); }
    } else if (wfLevel !== TARGET.level) {
      // Baked in when the layer was created, exactly like the floor plan's — so a level switch has
      // to re-set them or the last floor's network keeps drawing under this one.
      map.setFilter(WF_NODE, wfFilter(true));
      map.setFilter(WF_TRANSITION, wfFilter(false));
      map.setFilter(WF_NODE_HIT, ["any", wfFilter(true), wfFilter(false)]);
      wfLevel = TARGET.level;
    }
    /**
     * **Always visible, and said rather than assumed** (Olcay, 2026-08-16). These are our own
     * layers, so nothing in the SDK's re-assertion passes touches them — but "nothing touches them"
     * is a fact about today's code, and this is a promise about the section. Re-asserting it every
     * pass costs four reads and makes the promise literal: on this section the network is drawn,
     * whatever else the map has been told to hide.
     */
    for (const id of [WF_EDGE, WF_EDGE_HIT, WF_ARROW, WF_NODE_HIT, WF_NODE,
                      WF_TRANSITION, WF_CUT])
      if (map.getLayer(id) && map.getLayoutProperty(id, "visibility") === "none")
        map.setLayoutProperty(id, "visibility", "visible");
    // The pin storm the product would otherwise draw for the same features.
    if (map.getLayer(WF_HIDE) && map.getLayoutProperty(WF_HIDE, "visibility") !== "none")
      map.setLayoutProperty(WF_HIDE, "visibility", "none");
    const clone = GJ_LYR + WF_HIDE;
    if (map.getLayer(clone) && map.getLayoutProperty(clone, "visibility") !== "none")
      map.setLayoutProperty(clone, "visibility", "none");
  } catch (e) { post("error", { message: "wayfinding: " + e.message }); }
}

/** The style's own source-layer names, whatever their layers' visibility. */
function ptrSourceLayers() {
  try {
    return [...new Set(map.getStyle().layers
      .filter(l => l.source === "source_ptr" && l["source-layer"])
      .map(l => l["source-layer"]))];
  } catch (e) { return []; }
}

/**
 * Every `{source, sourceLayer}` pair holding indoor content — the tiles' source layers, plus the
 * GeoJSON sources once they exist.
 *
 * The four places that used to enumerate `source_ptr`'s source-layers by hand now ask this instead,
 * so switching the tiles off does not quietly empty the change resolver, the type census, the
 * highlight or the feature scan. `querySourceFeatures` reads a source whether or not any layer on
 * it is visible, so **both** halves keep answering while the swap is in either position.
 */
function indoorPairs() {
  const out = [];
  for (const L of ptrSourceLayers()) out.push({ source: "source_ptr", sourceLayer: L, name: L });
  for (const n of GJ.sources) out.push({ source: GJ_SRC + n, sourceLayer: null, name: n });
  return out;
}

/** What the SDK's own tile layers are painting right now. The baseline the verdict needs. */
function gjTileRows() {
  try {
    return map.queryRenderedFeatures().filter(f => f.source === "source_ptr").length;
  } catch (e) { return 0; }
}

/** Add the sources and the clones. The tiles stay on for one more frame — see `gjVerify`. */
function gjBuild() {
  const names = ptrSourceLayers();
  if (!names.length) return;
  const { groups, unmatched, kept } = groupBySourceLayer(names, LEVEL_FEATS, LEVEL_FEATS_LVL);
  GJ.unmatched = unmatched;
  GJ.kept = kept;
  // How many features each GeoJSON source ended up holding. Anything choosing between the tiles and
  // the GeoJSON for a *particular* type needs this — an empty source is not an alternative to a
  // full one, it is a way to draw nothing. See `wfSourceOf`.
  GJ.counts = new Map([...groups].map(([n, f]) => [n, f.length]));
  GJ.sources = [];
  GJ.clones = [];
  try {
    for (const [name, feats] of groups) {
      const id = GJ_SRC + name;
      const data = { type: "FeatureCollection", features: feats };
      if (map.getSource(id)) map.getSource(id).setData(data);
      else map.addSource(id, { type: "geojson", data });
      GJ.sources.push(name);
    }
    /**
     * Each clone is inserted **directly before its original**, so the clones' order among
     * themselves is the SDK's order exactly. Draw order on a floor plan is not decoration: get it
     * wrong and the circulation space paints over the rooms inside it.
     */
    for (const l of map.getStyle().layers) {
      if (l.source !== "source_ptr" || GJ_SKIP[l.id]) continue;
      const sl = l["source-layer"];
      if (!sl || !groups.has(sl)) continue;
      const id = GJ_LYR + l.id;
      if (map.getLayer(id)) continue;
      try {
        map.addLayer(cloneLayerDef(l, id, GJ_SRC + sl), l.id);
        GJ.clones.push({ id, from: l.id, vis: null });
      } catch (e) { post("error", { message: "geojson floor: " + l.id + " — " + e.message }); }
    }
  } catch (e) {
    post("error", { message: "geojson floor: " + e.message });
    return gjTeardown("threw while building");
  }
  GJ.lvl = TARGET.level;
  GJ.phase = "built";
}

/**
 * Did the clones actually paint? The whole swap turns on this one count.
 *
 * Nothing rendered means the level's draft content does not carry what this style draws — a wrong
 * `lvl`, a `mainType` nobody matched, a bag missing whatever the SDK's filters test. Every one of
 * those would otherwise present as a **blank floor**, which is the single worst outcome available
 * here and the reason the tiles were left on for this frame.
 */
function gjVerify() {
  const ids = GJ.clones.map(c => c.id).filter(id => map.getLayer(id));
  let rows = 0;
  try { rows = (map.queryRenderedFeatures({ layers: ids }) || []).length; } catch (e) {}
  GJ.gjRows = rows;
  if (!rows) {
    const missed = GJ.unmatched && GJ.unmatched.size
      ? " · mainTypes matching no source-layer: " + JSON.stringify([...GJ.unmatched.keys()].slice(0, 8)) : "";
    post("error", { message: "geojson floor: the cloned layers painted nothing — staying on the tiles" });
    console.info("%c[geojson-render] NOT switched on", "font-weight:bold",
      "\n  the " + GJ.clones.length + " cloned layers painted 0 features, so the vector tiles stay on.",
      "\n  features grouped into a source: ", GJ.kept, "of", LEVEL_FEATS.length, missed,
      "\n  likeliest causes, in order: the stamped `lvl` (" + LEVEL_FEATS_LVL + ") is not what the",
      "\n  SDK's filters select on; or the draft bags lack a field one of those filters tests.");
    gjTeardown("painted nothing");
    GJ.phase = "failed";
    return;
  }
  GJ.phase = "live";
  gjHideTiles();
  applyPrefs();          // the POI-label preference now belongs to the clones
  addFloorplan();        // and so does the floor-plan outline
  const missed = GJ.unmatched && GJ.unmatched.size
    ? [...GJ.unmatched.entries()].map(([k, v]) => k + "×" + v).slice(0, 8) : "none";
  console.info("%c[geojson-render] the floor is drawn from Pointr Cloud", "font-weight:bold",
    "\n  vector tiles:       off (" + GJ.clones.length + " SDK layers hidden, cloned onto " +
      GJ.sources.length + " GeoJSON sources)",
    "\n  rows painted:       ", GJ.tileRows, "from the tiles →", rows, "from the GeoJSON",
    "\n  features placed:    ", GJ.kept, "of", LEVEL_FEATS.length, "· level stamped", LEVEL_FEATS_LVL,
    "\n  mainTypes unmatched:", missed,
    "\n  ⚠️ this is the DRAFT scope — a difference you can see against the tiles is a real",
    "\n     difference between the draft content and the last publish.");
}

/**
 * Hide the SDK's own tile layers — the ones we cloned, and only those.
 *
 * Re-asserted on every idle rather than done once, for the same reason `hideBuildingChrome` is:
 * `updateLayersForCurrentLevel()` re-shows the layers it rewrites, so a level switch would bring
 * the tiles back underneath the GeoJSON and draw the floor twice.
 */
function gjHideTiles() {
  for (const c of GJ.clones) {
    try {
      if (!map.getLayer(c.from)) continue;
      const vis = map.getLayoutProperty(c.from, "visibility");
      if (vis === "none") continue;
      if (c.vis === null) c.vis = vis || "visible";   // what to put back on teardown
      map.setLayoutProperty(c.from, "visibility", "none");
    } catch (e) {}
  }
}

/**
 * Keep each clone's filter identical to its original's.
 *
 * ⚠️ **The SDK rewrites those filters behind us.** `updateLayersForCurrentLevel()` walks ~600
 * layers on every level switch and writes the level clause itself; a clone that kept the filter it
 * was born with would go on drawing the floor you left. Mirroring is also why the clone's filter is
 * never composed onto — there is nothing of ours in it to preserve.
 */
function gjSyncFilters() {
  for (const c of GJ.clones) {
    try {
      if (!map.getLayer(c.id) || !map.getLayer(c.from)) continue;
      /**
       * ⚠️ **Never over a Combine's hide filter.** `geomApplyHiddenFilter` composes onto whichever
       * layer is drawing the wall between two combined rooms — which, once the render has swapped,
       * is one of these clones. Mirroring the original's filter over it would put the wall straight
       * back, on the very next idle, with the combine still showing as done. `HIDDEN_FILTERS` holds
       * exactly the ids it has rewritten, and hands them back itself when the combine is undone.
       */
      if (HIDDEN_FILTERS.has(c.id)) continue;
      const want = map.getFilter(c.from);
      // setFilter() invalidates the layer, so only when it has actually moved.
      if (JSON.stringify(want ?? null) !== JSON.stringify(map.getFilter(c.id) ?? null))
        map.setFilter(c.id, want);
    } catch (e) {}
  }
}

/** Back to the tiles, leaving the style as it was found. */
function gjTeardown(why) {
  for (const c of GJ.clones) {
    try { if (map.getLayer(c.id)) map.removeLayer(c.id); } catch (e) {}
    // Put back what was there, not a blanket "visible": a layer the POI-label preference had
    // already hidden must stay hidden.
    try {
      if (c.vis && map.getLayer(c.from)) map.setLayoutProperty(c.from, "visibility", c.vis);
    } catch (e) {}
  }
  // The floor-plan outline follows the source it was built on, so it goes with the clones.
  for (const id of FP_LAYERS.slice()) {
    if (id.indexOf("__fp_gj_") !== 0) continue;
    try { if (map.getLayer(id)) map.removeLayer(id); } catch (e) {}
    FP_LAYERS.splice(FP_LAYERS.indexOf(id), 1);
  }
  for (const n of GJ.sources) {
    try { if (map.getSource(GJ_SRC + n)) map.removeSource(GJ_SRC + n); } catch (e) {}
  }
  GJ = { phase: "off", clones: [], sources: [], counts: null, lvl: null, tileRows: 0, gjRows: 0, unmatched: null, kept: 0 };
  if (why) console.info("[geojson-render] back on the vector tiles —", why);
  try { applyPrefs(); addFloorplan(); } catch (e) {}
}

/**
 * One step per idle: baseline, build, verdict. Called from the idle pass, which is also what
 * re-asserts the hidden tiles and the mirrored filters once it is live.
 */
function gjTick() {
  if (!map) return;
  const wanted = gjWanted();
  if (GJ.phase === "live" || GJ.phase === "built") {
    // The level moved out from under the data we hold, or somebody switched it off. Either way the
    // clones are now describing a floor nobody is looking at.
    if (!wanted || GJ.lvl !== TARGET.level) return gjTeardown(wanted ? "level changed" : "switched off");
  }
  if (GJ.phase === "live") { gjHideTiles(); gjSyncFilters(); return; }
  if (GJ.phase === "built") return gjVerify();
  if (GJ.phase === "failed" || !wanted) return;
  // `off`, and wanted: take the baseline. No rows means the camera is not over anything painted
  // yet — which is not the same as the clones failing, and is exactly the confusion this avoids.
  const rows = gjTileRows();
  if (!rows) return;
  GJ.tileRows = rows;
  gjBuild();
}
/* GJSWAP-ENGINE-END */

function hideBuildingChrome() {
  try {
    ["fill_building-outline_ptr", "symbol_building-outline_ptr"].forEach(id => {
      if (map.getLayer(id) && map.getLayoutProperty(id, "visibility") !== "none")
        map.setLayoutProperty(id, "visibility", "none");
    });
  } catch (e) {}
}

// Most indoor layers cut off below z17 (96 of ~100 sit at 17–17.5) while the tiles themselves
// exist down to z5 — so a zoomed-out map went EMPTY once the building chrome was hidden (Olcay,
// 2026-08-10). Lower the GEOMETRY layers' minzoom to a legible floor; the symbol layers keep the
// SDK's own staging so labels don't collide at city scale. Re-asserted with hideBuildingChrome —
// cheap after the first pass, since already-lowered layers are skipped.
const PTR_GEOMETRY_MINZOOM = 14;
/**
 * **How far in the user may go.** The SDK hands us a map capped at **21**, measured on a live
 * board; MapLibre's own ceiling is 22 (Olcay, 2026-08-18: *"let's increase the zoom limit, up to
 * 22 or so"*).
 *
 * ⚠️ **Raising the camera's cap is only safe because the CONTENT goes further.** Counted on the
 * same live style: 115 of 123 `_ptr` layers already carry `maxzoom: 24`, so there is real geometry
 * to see up here rather than an empty screen — which is precisely the failure `PTR_GEOMETRY_MINZOOM`
 * above exists to prevent at the other end. The handful that stop earlier (one at 13, two at 17,
 * four at 17.5) are building chrome and staged labels, and are meant to drop out.
 *
 * Re-asserted every `applyPrefs` pass rather than set once, for the same reason the minzoom relax
 * is: the SDK rebuilds its style on level changes, and a ceiling set once would quietly return to
 * 21 the first time it did.
 */
const ZOOM_CEILING = 22;
function relaxPtrMinzoom() {
  try {
    // The camera's own ceiling, lifted here so it travels with the other zoom-range work.
    if (map.getMaxZoom() < ZOOM_CEILING) map.setMaxZoom(ZOOM_CEILING);
    map.getStyle().layers.forEach(l => {
      if (!/_ptr/.test(l.id)) return;
      if (l.id === "fill_building-outline_ptr" || l.id === "symbol_building-outline_ptr") return;
      if (l.type !== "fill" && l.type !== "line" && l.type !== "fill-extrusion") return;
      if (typeof l.minzoom === "number" && l.minzoom > PTR_GEOMETRY_MINZOOM)
        map.setLayerZoomRange(l.id, PTR_GEOMETRY_MINZOOM, l.maxzoom ?? 24);
    });
  } catch (e) {}
}

/* ── camera sync (Compare's two panes mirror each other) ─────────────────── */

// The app forwards one pane's camera to the other. `applyingCam` stops the mirrored jumpTo from
// re-posting — MapLibre fires move synchronously inside jumpTo, so the guard is airtight.
let applyingCam = false;
function postCam() {
  if (applyingCam || !map) return;
  const c = map.getCenter();
  post("camera", { cam: { lng: c.lng, lat: c.lat, zoom: map.getZoom(), bearing: map.getBearing(), pitch: map.getPitch() } });
}

function applyPrefs() {
  hideBuildingChrome();
  relaxPtrMinzoom();
  const c = document.querySelector("#map canvas");
  if (c) c.classList.toggle("grey", !!prefs.greyscale);
  try {
    const satellite = prefs.basemap === "satellite" && ensureSatellite();
    const gj = gjLive();
    map.getStyle().layers.forEach(l => {
      if (l.id.indexOf("__fp_") === 0) {
        // Two sets can exist for one frame around a swap — the tiles' outline and the GeoJSON's.
        // Only the set belonging to the source currently drawing the floor may show, or the outline
        // is drawn twice, in two slightly different places, which reads as a rendering bug.
        const mine = l.id.indexOf("__fp_gj_") === 0 ? gj : !gj;
        map.setLayoutProperty(l.id, "visibility", prefs.floorplan && mine ? "visible" : "none");
        // Re-asserted every pass, not only at creation — the same law visibility follows: these
        // layers are re-created when the floor's source flips, and a paint set once would be lost
        // with no error the moment that rebuild happens.
        map.setPaintProperty(l.id, "line-opacity", fpOpacity());
      }
      else if (l.id === "__sat")
        map.setLayoutProperty(l.id, "visibility", satellite ? "visible" : "none");
      // Review focus: the SDK's POI pins and labels sit on top of the diff highlights and are the
      // single biggest source of visual noise when comparing floors. Symbol layers only — hiding
      // the fills would take the floor plan with them.
      //
      // ⚠️ The preference now belongs to whichever set is drawing. Left as it was, this branch
      // would re-show every hidden tile symbol layer on the next pass — applyPrefs runs on every
      // idle that resolves — and the labels would come back underneath the GeoJSON ones.
      else if (l.type === "symbol" && (l.source === "source_ptr" || gjIsClone(l.id))) {
        const mine = gjIsClone(l.id) ? gj : !gj;
        // ⚠️ `typeHidden` belongs in this expression, not in a pass afterwards. The wayfinding
        // network and the geofence pins are SYMBOL layers on `source_ptr`, so this branch would
        // put every one of them back on the next idle that resolves — which is most of them.
        const hide = prefs.hidePoiLabels || !mine || typeHidden(l);
        map.setLayoutProperty(l.id, "visibility", hide ? "none" : "visible");
      }
      // the vector base (streets/outdoor) would show through the satellite raster
      else if (l.source === "openmaptiles" || l.source === "outdoor-tiles")
        map.setLayoutProperty(l.id, "visibility", satellite ? "none" : "visible");
    });
    // The fills — a geofence's zone and its hatch overlay are `fill` layers, which no branch above
    // touches. Last, so nothing can re-show what it has just hidden.
    applyHiddenTypes();
  } catch(e){}
}

let framed = false;

// Pull back to the whole building so its tiles load — the level under review may be in a wing the
// opening camera never covered, and nothing can resolve from tiles that were never fetched.
function fitBuilding() {
  try {
    const b = pw.getUiController().getCurrentBuilding();
    const nums = JSON.stringify(b.geometry.coordinates).match(/-?\d+\.\d+/g).map(Number);
    let minx = 180, miny = 90, maxx = -180, maxy = -90;
    for (let i = 0; i < nums.length; i += 2) {
      const x = nums[i], y = nums[i + 1];
      if (x < minx) minx = x; if (x > maxx) maxx = x;
      if (y < miny) miny = y; if (y > maxy) maxy = y;
    }
    map.fitBounds([[minx, miny], [maxx, maxy]], { padding: 20, duration: 0 });
  } catch(e){}
}

function frameChanges() {
  let minx=180, miny=90, maxx=-180, maxy=-90, n=0;
  RESOLVED.forEach(({ rings }) => rings.forEach(r => r.forEach(([x,y]) => {
    n++; if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; })));
  if (n) { map.setPitch(0); map.setBearing(0); map.fitBounds([[minx,miny],[maxx,maxy]], { padding:70, duration:0 }); }
}

/**
 * Bring one change into view when it becomes the active selection (Olcay, 2026-08-11: *"the map
 * should center the item and focus gracefully so that the user can both understand the whereabouts
 * of the feature and see its geometry"*).
 *
 * Both halves of that sentence are a constraint, and they pull against each other. **Whereabouts**
 * wants context — fill the pane with one unit and you're looking at a rectangle with no idea which
 * building you're in. **Geometry** wants closeness. So this fits the feature's own bounds with a
 * generous pad and then caps the zoom: small units stop at `FOCUS_MAX_ZOOM` with their surroundings
 * still around them, while a whole concourse still gets framed to fit.
 *
 * `easeTo` rather than `flyTo` on purpose: fly's zoom-out-and-back arc is a lovely gesture across a
 * city and a nauseating one across thirty metres.
 *
 * ⚠️ **This is now the rule for a CHANGE only.** Selecting a feature deliberately does not reframe
 * at all — see `focusFeature`. The two look like the same act and are not: a change is put in front
 * of you to be judged, so framing it is the service being performed; a feature is one you went and
 * picked, and you had already chosen how close you wanted to be.
 */
var FOCUS_MAX_ZOOM = 19.5;

/**
 * Bring ONE feature into view, found by its `fid` — what clicking a row in the tree's level
 * expansion does (Olcay, 2026-08-12).
 *
 * ⚠️ **The zoom is the user's and this no longer touches it** (Olcay, 2026-08-16: *"when a feature
 * is selected don't zoom out or in - respect the user's zoom choice but center it if it's off
 * screen"*).
 *
 * It used to `fitBounds` the feature's own extent, capped at `FOCUS_MAX_ZOOM` — the same rule
 * `focusChange` still follows. That framing is right for a *change*, which you are being shown for
 * the first time and have to judge. It is wrong for a feature you went and picked: you had already
 * chosen how close you wanted to be, and every click threw it away — a small room slammed you to
 * z19.5, a concourse pulled you back out, and the zoom was never yours for more than one selection.
 *
 * So the move is a **pan and nothing else**, in screen space. `panBy` keeps zoom, bearing and pitch
 * exactly as they were; an `easeTo({ center })` would have to re-derive the centre for every
 * rotation, and would be one arithmetic slip away from quietly changing the zoom it was written to
 * preserve.
 */
/**
 * Highlight features on the map using **the SDK's own selection layer** (Olcay, 2026-08-12: *"we
 * should already have this covered in the style json"* — and it is).
 *
 * `source_selected_ptr` is an empty GeoJSON source that the published style already draws through
 * `fill_selected_ptr` (a blue #346DF1 fill-extrusion) and `symbol_selected_ptr`. So highlighting is
 * just handing it geometry: no layer of ours, no colours of ours, and it looks exactly like every
 * other selection in the product.
 *
 * Takes either one `fid` or a whole `mainType`/`subType` — hovering a type row lights the lot,
 * which is how you find out where 989 walls actually are. Capped, because setData on thousands of
 * polygons at hover speed is not worth the frame it costs.
 */
const HIGHLIGHT_CAP = 400;
function highlightFeatures(sel) {
  const src = map && map.getSource("source_selected_ptr");
  if (!src) return;
  const feats = [];
  if (sel) {
    /**
     * `fids` is the multi-selection (Olcay, 2026-08-16) and `fid` the single one, kept so hover —
     * which lights exactly one feature and calls this on every mouse move — needs no array
     * allocated per frame. A Set, because a selection of five is five membership tests per feature
     * across every source layer on the floor.
     */
    const many = Array.isArray(sel.fids) && sel.fids.length ? new Set(sel.fids) : null;
    try {
      const seen = new Set();
      for (const { source, sourceLayer } of indoorPairs()) {
        for (const f of map.querySourceFeatures(source, sourceLayer ? { sourceLayer } : undefined)) {
          const p = f.properties; if (!p) continue;
          if (many ? !many.has(p.fid)
                   : sel.fid != null ? p.fid !== sel.fid
                              : (p.mainType !== sel.mainType || (sel.subType || "") !== (p.subType || ""))) continue;
          if (p.lvl !== TARGET.level) continue;
          // a feature split across tiles arrives once per tile; the same fid twice is one shape
          const k = p.fid + ":" + JSON.stringify(f.geometry && f.geometry.coordinates ? f.geometry.coordinates[0] : 0).slice(0, 40);
          if (seen.has(k)) continue; seen.add(k);
          if (f.geometry) feats.push({ type: "Feature", geometry: f.geometry, properties: {} });
          if (feats.length >= HIGHLIGHT_CAP) break;
        }
        if (feats.length >= HIGHLIGHT_CAP) break;
      }
    } catch(e){}
  }
  try { src.setData({ type: "FeatureCollection", features: feats }); } catch(e){}
}

/**
 * **What a hover marks, and it is not always a pin.**
 *
 * Olcay, 2026-08-16: *"let's not show selected marker onHover. Instead highlight the edges and
 * nodes."* The SDK's selection layer draws a map **pin** for a point feature — a green teardrop
 * planted over the corridors you are inspecting. It answers *"where is it?"*, which is the right
 * question on a floor of shops and the wrong one on a graph, where you are asking *"what does this
 * connect to?"*.
 *
 * So a wayfinding node lights its own neighbourhood instead, and everything else keeps the mark it
 * has always had. The decision is made on the feature's `mainType` rather than on the section,
 * because it is a fact about **what the thing is**, not about which screen you happen to be on.
 */
function isNetworkNode(fid, props) {
  if (!fid) return false;
  // The property bag when there is one — a fact about the feature under the pointer. When there is
  // not (the app hovering a TREE row sends a bare fid), the node table answers instead.
  if (props) return props.mainType === "wayfinding-network";
  return WF_NODES.some(n => n.fid === fid);
}

function hoverMark(fid, props) {
  const network = isNetworkNode(fid, props);
  wfHighlight(network ? fid : null);
  highlightFeatures(network || !fid ? null : { fid });
}

/**
 * Centre the map on one feature — **and report its properties**, which is the POI panel's whole
 * supply (§19).
 *
