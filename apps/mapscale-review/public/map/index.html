 * a wall on top of the geometry."* — so this is not an undo of the join, only of the hiding. The
 * combined room keeps its shape and the wall is drawn over it again, which is a perfectly coherent
 * thing to want: two rooms that are now one, with the old partition still standing.
 *
 * Independent of the composition on purpose, and therefore available even after the shape has been
 * hand-edited: nothing about a hidden feature depends on how the rings were arrived at.
 */
function geomUnhide(fid) {
  if (!GEOM || GEOM.hidden.fids.indexOf(fid) < 0) return;
  /**
   * ⚠️ **Kept across the push, because this changes no rings.** `geomPush` dissolves the
   * composition — the right default, since almost everything that pushes does rewrite the shape —
   * and putting a wall back is the exception: the room's outline is untouched, so the members go on
   * describing it exactly as before. Without this, restoring one wall silently made every joined
   * row's ✕ dead, which is the opposite of what the comment below promises.
   */
  const composition = GEOM.combine;
  geomPush();
  GEOM.combine = composition;
  GEOM.hidden = {
    fids: GEOM.hidden.fids.filter(f => f !== fid),
    labels: GEOM.hidden.labels.filter(l => l.fid !== fid),
    // The layer list is left alone: another hidden feature may still need it, and a layer with
    // nothing left to hide is put back whole by `geomApplyHiddenFilter` anyway.
    layers: GEOM.hidden.layers.slice(),
  };
  geomApplyHiddenFilter();
  geomDraw(); post("geomstate", geomState());
}

/* ── drawing and interaction ───────────────────────────────────────────────────────────────── */

function geomLayer() {
  let l = document.getElementById("geom");
  if (!l) {
    l = el("svg", { id: "geom" });
    l.setAttribute("style",
      "position:absolute;inset:0;width:100%;height:100%;z-index:8;pointer-events:none");
    document.body.appendChild(l);
  }
  return l;
}

function geomDraw() {
  const l = geomLayer();
  while (l.firstChild) l.removeChild(l.firstChild);
  if (!GEOM || !map) return;

  /**
   * The other features in the selection.
   *
   * Drawn **first**, so the one whose outline you are actually editing stays on top of them — and
   * dashed, because they are still separate features. A solid fill would look like one shape, and
   * this is the moment it matters most that it does not: a selection you are about to Combine looks
   * exactly like the thing it will become, right up until it becomes it.
   *
   * ⚠️ Above the point-feature branch, not below it, because that branch RETURNS. Underneath, a
   * selection anchored on a POI would have drawn nothing at all — the one case where you most need
   * to see what else you have picked, since the panel is editing all of them.
   *
   * Not gated on any mode: features are selected in Reshape, Transform and Split alike, because
   * selection is about *which features you are working on* rather than about one operation.
   */
  for (const p of GEOM.pick) {
    for (const ring of p.rings) {
      const d = ring.map((c, i) => { const q = map.project(c); return (i ? "L" : "M") + q.x + " " + q.y; })
        .join(" ") + " Z";
      l.appendChild(el("path", { d, fill: EDIT_INK, "fill-opacity": .16, stroke: EDIT_INK,
                                 "stroke-width": 2, "stroke-dasharray": "6 4" }));
    }
    // A selected POINT feature has no outline to dash, and would otherwise be selected invisibly.
    if (p.point) {
      const q = map.project(p.point);
      l.appendChild(el("circle", { cx: q.x, cy: q.y, r: HANDLE_R + 5, fill: "none",
                                   stroke: EDIT_INK, "stroke-width": 2, "stroke-dasharray": "3 3" }));
    }
  }

  /**
   * A point feature: one handle, and that is the whole of it. Drawn larger than a vertex handle
   * because it IS the feature rather than a corner of one, and there is nothing else to aim at.
   */
  /**
   * A network draws nothing here. Its nodes and its lines are map LAYERS — see `wfSetEditing` —
   * because a concourse network has hundreds of nodes and four hundred SVG handles re-projected on
   * every frame is not a thing a browser does twice.
   */
  /**
   * ⚠️ **These used to `return`, and that is why Snap and the guides existed only for rooms.**
   *
   * Olcay, 2026-08-17: *"I want the guidelines for rotation and snap in all lenses — map content ✓,
   * wayfinding network, geofence, beacons."* Every one of those drags **already computed** its
   * guides and its snap catch: the point branch and the network branch of the drag both call
   * `snapAt` and `resolveGuides` and write to `GEOM.guides`. They were simply never drawn, because
   * the two early returns above sat between the handles and the block at the bottom of this
   * function that draws them.
   *
   * So a beacon and a point POI have never shown a guide either, on any screen. The lenses did not
   * differ; the **geometry kinds** did, and a lens is mostly one kind. Drawing the handles per kind
   * and then falling through to the guides is the whole fix.
   */
  if (GEOM.kind === "point" && GEOM.point) {
    const p = map.project(GEOM.point);
    l.appendChild(el("circle", { cx: p.x, cy: p.y, r: 13, fill: EDIT_INK, "fill-opacity": .12 }));
    const h = el("circle", { cx: p.x, cy: p.y, r: HANDLE_R + 2, fill: "#fff",
                             stroke: EDIT_INK, "stroke-width": 2.5, class: "geom-pt" });
    h.setAttribute("style", "pointer-events:auto;cursor:grab");
    h.addEventListener("mousedown", ev => { ev.stopPropagation(); geomDown(ev, { kind: "point" }); });
    l.appendChild(h);
  }
  /**
   * A network draws no handles here: its nodes and its lines are map LAYERS (see `wfPaint`), because
   * a concourse network has hundreds of nodes and four hundred SVG handles re-projected on every
   * frame is not a thing a browser does twice. Its guides, though, are drawn like everything else.
   */

  for (const [ri, ring] of GEOM.rings.entries()) {
    const d = ring.map((c, i) => { const p = map.project(c); return (i ? "L" : "M") + p.x + " " + p.y; }).join(" ") + " Z";
    /**
     * Every piece is drawn the same. After a split they are all equally the feature — none of them
     * is the "real" one and none is the leftover, because nothing here has decided which keeps the
     * name. The cut shows as the seam between two outlines, which is the whole of what happened;
     * the toolbar says how many pieces there now are.
     */
    const face = el("path", { d, fill: EDIT_INK, "fill-opacity": .10, stroke: EDIT_INK,
                              "stroke-width": 2, class: "geom-face" });
    if (GEOM.mode === "transform") face.setAttribute("style", "pointer-events:auto;cursor:move");
    face.addEventListener("mousedown", ev => geomDown(ev, { kind: "move" }));
    l.appendChild(face);

    if (GEOM.mode === "vertices") {
      /**
       * **Edges first of all**, so both the midpoint that adds a corner and the corner handles
       * themselves keep winning the click where they overlap it. An edge is the widest target on
       * screen and the least precise thing you can mean by a click, so it goes at the bottom.
       *
       * Olcay, 2026-08-16: *"I can select edges to push out or move in — two nodes move
       * accordingly. Multi edge select would be nice."* Both of those are the corner machinery
       * already here: an edge IS its two ends, so selecting one selects two corners, dragging it is
       * the multi-corner drag, and selecting several is the same set with more in it.
       */
      ring.slice(0, -1).forEach((c, ci) => {
        const n = ring[ci + 1];
        const a = map.project(c), b = map.project(n);
        const [k0, k1] = edgeKeys(ri, ci, ring.length);
        const on = GEOM.sel.has(k0) && GEOM.sel.has(k1);
        // The visible mark and the hit target are two elements: one line cannot be both 4px of ink
        // and 12px of catchment, and shrinking the target to the ink would make a selected edge
        // harder to grab than an unselected one — backwards.
        if (on)
          l.appendChild(el("line", { x1:a.x, y1:a.y, x2:b.x, y2:b.y, stroke:EDIT_INK,
                                     "stroke-width":4.5, "stroke-linecap":"round", class:"geom-edge-on" }));
        const hit = el("line", { x1:a.x, y1:a.y, x2:b.x, y2:b.y, stroke:"transparent",
                                 "stroke-width":12, "stroke-linecap":"butt", class:"geom-edge" });
        hit.setAttribute("style", "pointer-events:stroke;cursor:move");
        hit.addEventListener("mousedown", ev => {
          ev.stopPropagation();
          if (ev.altKey) return;            // Alt removes a CORNER; on an edge it would be ambiguous
          if (ev.shiftKey) {                // toggles the whole edge, and never starts a drag
            if (on) { GEOM.sel.delete(k0); GEOM.sel.delete(k1); }
            else { GEOM.sel.add(k0); GEOM.sel.add(k1); }
            geomDraw(); post("geomstate", geomState());
            return;
          }
          if (!on) { GEOM.sel.clear(); GEOM.sel.add(k0); GEOM.sel.add(k1); geomDraw(); }
          /**
           * **The end you grabbed nearer leads the drag**, and that is not cosmetic: the leading
           * corner is the one Snap and the guides are computed for, so grabbing an edge near its
           * left end snaps that end to the wall beside it — which is what you were aiming with.
           * The other end follows by the same screen offset, so the edge keeps its length and angle.
           */
          // `clientX/Y` compared straight against `map.project()` output, which is what the drag
          // loop itself does — the map canvas fills this iframe from its origin, so the two agree.
          const lead = Math.hypot(ev.clientX - a.x, ev.clientY - a.y)
                    <= Math.hypot(ev.clientX - b.x, ev.clientY - b.y)
            ? ci : (ci + 1) % (ring.length - 1);
          geomDown(ev, { kind: "vertex", ri, ci: lead });
        });
        l.appendChild(hit);
      });
      /**
       * Midpoints next, so a vertex always wins the click where the two overlap.
       *
       * ⚠️ Over `slice(0, -1)`, not the whole ring. The closing point repeats the first, so the
       * full loop produced a midpoint between `p0` and `p0` — a zero-length "edge" sitting exactly
       * under the first handle, whose click inserted a vertex AFTER the closing point and tore the
       * ring open. Its neighbour is `ring[ci + 1]`, which for the last real vertex is the closing
       * point, i.e. the first — exactly the edge that wraps.
       */
      ring.slice(0, -1).forEach((c, ci) => {
        const n = ring[ci + 1];
        const a = map.project(c), b = map.project(n);
        const m = el("circle", { cx: (a.x + b.x) / 2, cy: (a.y + b.y) / 2, r: 3.5,
                                 fill: "#fff", stroke: EDIT_INK, "stroke-width": 1.5, class: "geom-mid" });
        m.setAttribute("style", "pointer-events:auto;cursor:copy");
        m.addEventListener("mousedown", ev => { ev.stopPropagation(); geomAddVertex(ri, ci); });
        l.appendChild(m);
      });
      // The closing point is the first one again — drawing a handle on it would put two handles on
      // top of each other, and dragging the wrong one would tear the ring open.
      ring.slice(0, -1).forEach((c, ci) => {
        const p = map.project(c);
        const on = GEOM.sel.has(selKey(ri, ci));
        /**
         * ⚠️ **A snapped corner goes hollow, and that is not decoration** (Olcay, 2026-08-18: *"the
         * circle and the sandtime symbol overlaps"*). The snap marker is drawn at this exact point,
         * and a filled disc is 12px inside a 15px Endpoint square — it fills the glyph, so the
         * square reads as a solid box and the hourglass loses the waist that identifies it. While
         * the marker is up it IS the indicator for this point; the handle stands down to a hollow
         * ring and gives the glyph a clean ground to sit on.
         */
        const snapped = GEOM.snapHit &&
          Math.abs(p.x - GEOM.snapHit.x) < 2 && Math.abs(p.y - GEOM.snapHit.y) < 2;
        // A selected corner is FILLED. Hollow-vs-hollow-with-a-thicker-ring is not a difference you
        // can see across twenty handles at a glance, and the whole point of a marquee is the glance.
        const h = el("circle", { cx: p.x, cy: p.y, r: on ? HANDLE_R + 1 : HANDLE_R,
                                 fill: (on && !snapped) ? EDIT_INK : "#fff",
                                 stroke: EDIT_INK, "stroke-width": 2, class: "geom-vx" });
        h.setAttribute("style", "pointer-events:auto;cursor:grab");
        h.addEventListener("mousedown", ev => {
          ev.stopPropagation();
          // alt-click removes, which is the convention every editor already taught people
          if (ev.altKey) return geomRemoveVertex(ri, ci);
          const key = selKey(ri, ci);
          if (ev.shiftKey) {                       // shift-click toggles, and never starts a drag
            if (GEOM.sel.has(key)) GEOM.sel.delete(key); else GEOM.sel.add(key);
            geomDraw(); post("geomstate", geomState());
            return;
          }
          // Dragging an unselected corner is a fresh single selection; dragging one that is
          // already selected takes the whole set with it.
          if (!GEOM.sel.has(key)) { GEOM.sel.clear(); GEOM.sel.add(key); geomDraw(); }
          geomDown(ev, { kind: "vertex", ri, ci });
        });
        l.appendChild(h);
      });
    }
  }

  /**
   * The transform box — Transform mode only, where the subject is the whole shape.
   *
   * Four corners scale about the box's centre and a knob on a stem rotates. Not shown in Reshape,
   * where the corners of the *outline* are the subject and a second set of squares nearby would be
   * a coin toss every time you reached for one.
   */
  if (GEOM.mode === "transform") {
    const box = geomBox();
    if (box) {
      /**
       * A polygon, not a `rect` — the box is turned to the shape's own grid now, and an SVG rect
       * can only ever be square to the screen. Its four corners come back already rotated.
       */
      l.appendChild(el("polygon", {
        points: box.corners.map(p => p[0] + "," + p[1]).join(" "),
        fill: "none", stroke: EDIT_INK, "stroke-width": 1,
        "stroke-dasharray": "5 4", "stroke-opacity": .7,
      }));
      // The rotate knob, on a stem out along the top edge's own normal rather than straight up.
      l.appendChild(el("line", { x1: box.topMid[0], y1: box.topMid[1],
                                 x2: box.knob[0], y2: box.knob[1],
                                 stroke: EDIT_INK, "stroke-width": 1, "stroke-opacity": .7 }));
      const knob = el("circle", { cx: box.knob[0], cy: box.knob[1], r: 7, fill: "#fff",
                                  stroke: EDIT_INK, "stroke-width": 2, class: "geom-rot" });
      knob.setAttribute("style", "pointer-events:auto;cursor:grab");
      knob.addEventListener("mousedown", e => { e.stopPropagation(); geomDown(e, { kind: "rotate" }); });
      l.appendChild(knob);

      /**
       * The four scale corners — square, so they are never mistaken for a vertex handle, and
       * **not** rotated with the box: a tilted 9px square reads as a smudge, and the handle's job
       * is to be hit, not to echo the geometry. Its *position* is what hugs the shape.
       */
      const S = 9;
      box.corners.forEach(([hx, hy]) => {
        const h = el("rect", { x: hx - S / 2, y: hy - S / 2, width: S, height: S, rx: 2,
                               fill: "#fff", stroke: EDIT_INK, "stroke-width": 2,
                               class: "geom-scale" });
        // Measured from the centre, so the arrow agrees with the eye at any angle — see the note.
        h.setAttribute("style", "pointer-events:auto;cursor:" +
          geomResizeCursor(hx - box.cx, hy - box.cy) + "-resize");
        h.addEventListener("mousedown", e => { e.stopPropagation(); geomDown(e, { kind: "scale" }); });
        l.appendChild(h);
      });

      /**
       * The live readout, beside the pointer rather than pinned to the box — your eye is on the
       * handle you are dragging, and a number in the corner of the shape is a number you have to go
       * and find.
       *
       * ⚠️ **The word "snap" used to trail the number and is gone** (Olcay, 2026-08-16: *"we don't
       * need to add 'snap' next to angle"*). The argument for it was that "37°" and "35° because I
       * am holding Shift" are different facts — but the person reading it is the person holding the
       * key, so it was telling them something they were in the middle of doing. It also made the
       * label change width mid-drag, which is the one thing a number pinned to a moving cursor
       * should not do.
       */
      if (GEOM.xform) {
        const tx = GEOM.xform.x + 16, ty = GEOM.xform.y - 12;
        const label = GEOM.xform.text;
        const w = label.length * 7.1 + 14;
        l.appendChild(el("rect", { x: tx, y: ty - 12, width: w, height: 21, rx: 5,
                                   fill: EDIT_INK }));
        const t = el("text", { x: tx + 7, y: ty + 3, fill: "#fff",
                               "font-family": "'Readex Pro', system-ui, sans-serif", "font-size": 12 });
        t.textContent = label;
        l.appendChild(t);
      }
    }
  }

  /**
   * The guides in force. Drawn in the snap green rather than the edit blue, because they belong to
   * the same family of "the tool is holding you to something" as the snap marks — and the blue is
   * already spoken for by the shape itself.
   */
  if (GEOM.guides && GEOM.guides.length) {
    const far = (window.innerWidth + window.innerHeight) * 2;
    for (const g of GEOM.guides) {
      if (g.kind === "angle") {
        const a = g.deg * Math.PI / 180;
        const ux = Math.cos(a) * far, uy = Math.sin(a) * far;
        l.appendChild(el("line", { x1: g.from[0] - ux, y1: g.from[1] - uy,
                                   x2: g.from[0] + ux, y2: g.from[1] + uy,
                                   stroke: TOOL_INK, "stroke-width": 1,
                                   "stroke-dasharray": "6 5", "stroke-opacity": .8 }));
        /**
         * The angle **to the wall it is measured from**, not to the screen — so `0°` reads "carries
         * straight on from that wall" and `90°` reads "square to it". An absolute bearing would be
         * a number about the monitor.
         */
        const label = Math.round((g.rel ?? g.deg) % 180) + "°";
        /**
         * A right angle gets the draughtsman's square mark, drawn **at the corner it belongs to**
         * (Olcay, 2026-08-16: *"snapping and highlighting to the next node's 90 degree"*). 90° is
         * the one people are actually reaching for, and a number in a box is a weaker signal than
         * the symbol every floor plan already uses for it. Set in the corner between the wall it is
         * measured from and the guide ray, so it says which two lines are square.
         */
        if (Math.abs(((g.rel ?? 0) % 180) - 90) < 1e-6) {
          const R = 13;
          const a1 = g.deg * Math.PI / 180;
          const a2 = (g.deg - (g.rel > 180 ? -90 : 90)) * Math.PI / 180;
          const p1 = [g.from[0] + Math.cos(a1) * R, g.from[1] + Math.sin(a1) * R];
          const p2 = [g.from[0] + Math.cos(a2) * R, g.from[1] + Math.sin(a2) * R];
          l.appendChild(el("path", {
            d: `M${p1[0]} ${p1[1]} L${p1[0] + p2[0] - g.from[0]} ${p1[1] + p2[1] - g.from[1]} L${p2[0]} ${p2[1]}`,
            fill: "none", stroke: TOOL_INK, "stroke-width": 2,
          }));
        }
        l.appendChild(el("rect", { x: g.from[0] + 10, y: g.from[1] - 22, width: label.length * 7.5 + 12,
                                   height: 19, rx: 5, fill: TOOL_INK }));
        const t = el("text", { x: g.from[0] + 16, y: g.from[1] - 8, fill: "#fff",
                               "font-family": "'Readex Pro', system-ui, sans-serif", "font-size": 11.5 });
        t.textContent = label;
        l.appendChild(t);
      } else {
        /**
         * The stretch between the corner being tracked and where the point actually went — the bit
         * that says WHICH corner you agree with, rather than merely that something somewhere lines
         * up.
         *
         * ⚠️ It used to reach for `GEOM.snapHit`, which is **always null here**: guides only run
         * when snapping caught nothing. Every ternary fell through to the reference's own
         * coordinates, so the line was drawn from the corner to itself — zero-length, invisible,
         * and silently doing nothing since the day it was written. It reads the resolved point now.
         */
        const to = GEOM.guideAt;
        if (to) {
          l.appendChild(el("line", { x1: g.ref[0], y1: g.ref[1], x2: to[0], y2: to[1],
                                     stroke: TOOL_INK, "stroke-width": 1.5,
                                     "stroke-dasharray": "3 4", "stroke-opacity": .95 }));
        }
        l.appendChild(el("line", {
          x1: g.axis === "x" ? g.ref[0] : g.ref[0] - far,
          y1: g.axis === "x" ? g.ref[1] - far : g.ref[1],
          x2: g.axis === "x" ? g.ref[0] : g.ref[0] + far,
          y2: g.axis === "x" ? g.ref[1] + far : g.ref[1],
          stroke: TOOL_INK, "stroke-width": 1, "stroke-dasharray": "3 4", "stroke-opacity": .55 }));
        l.appendChild(el("rect", { x: g.ref[0] - 3.5, y: g.ref[1] - 3.5, width: 7, height: 7,
                                   fill: TOOL_INK }));
      }
    }
  }

  /**
   * What snapping has caught, right now.
   *
   * Without this a snap is indistinguishable from a slightly inaccurate drag — the shape lands
   * somewhere you did not put it and you have no way to know whether that was the tool helping or
   * the tool misbehaving. The mark differs by kind because the two are different promises: a
   * **corner** is exact, an **edge** only fixes you across the wall.
   *
   * ⚠️ **These are CAD's AutoSnap glyphs, not shapes of our choosing** (Olcay, 2026-08-18). The
   * people using this arrive from DWG/DXF floor plans, where the vocabulary is fixed and precise:
   * a **square** is an Endpoint, a **triangle** a Midpoint, a **circle** a Center, a **diamond** a
   * Quadrant, an **✕** an Intersection, and an **hourglass** is *Nearest* — the nearest point on a
   * segment, which is exactly what `segClosest` computes for an edge.
   *
   * We previously drew a circle for the corner and a diamond for the edge, which to a CAD-literate
   * eye said *Center* and *Quadrant* — not neutral, actively the wrong words. The centre dot on the
   * endpoint square is ours: CAD relies on the crosshair being there to mark the exact spot and we
   * have no crosshair, so the dot says which pixel.
   */
  if (GEOM.snapHit) {
    const h = GEOM.snapHit;
    /**
     * ⚠️ **A white halo under the ink, because a marker lands on top of whatever it caught**
     * (Olcay, 2026-08-18: *"the circle and the sandtime symbol overlaps"*). The snapped node draws
     * its own filled handle at exactly this point, and an hourglass is at its thinnest precisely
     * where that disc is — so the waist, the part that identifies the glyph, was the part being
     * covered. The halo separates the marker from the handle, and from busy floor-plan linework
     * too, without moving it off the point it is making a claim about.
     *
     * ⚠️ **And the Endpoint square no longer carries a centre dot.** It was there because "CAD
     * relies on a crosshair we do not have" — we have one now, so the dot became a third mark
     * competing for the same pixel.
     */
    const halo = (attrs) => {
      l.appendChild(el(attrs.d ? "path" : "rect",
        { ...attrs, fill: "none", stroke: "#fff", "stroke-width": 4, "stroke-opacity": .9 }));
      l.appendChild(el(attrs.d ? "path" : "rect",
        { ...attrs, fill: "none", stroke: TOOL_INK, "stroke-width": 2, "stroke-linejoin": "round" }));
    };
    if (h.kind === "corner") {
      // Endpoint — the square.
      halo({ x: h.x - 7.5, y: h.y - 7.5, width: 15, height: 15 });
    } else {
      // Nearest — the hourglass. Two triangles apex to apex: the path walks the top edge, crosses
      // to the far bottom corner, back along the bottom, and closes on the diagonal.
      halo({ d: "M" + (h.x - 7) + " " + (h.y - 8) + " L" + (h.x + 7) + " " + (h.y - 8) +
                " L" + (h.x - 7) + " " + (h.y + 8) + " L" + (h.x + 7) + " " + (h.y + 8) + " Z" });
    }
  }

  /**
   * The crosshair that replaces the hidden pointer — thin arms with an OPEN centre, so the pixel it
   * is pointing at stays visible and any snap marker around it stays whole. Drawn last, over
   * everything, because it is the one thing that must never be occluded.
   */
  if (GEOM.pointer) {
    const q = GEOM.pointer, A = 11, G = 4;
    l.appendChild(el("path", {
      d: "M" + (q.x - A) + " " + q.y + " H" + (q.x - G) +
         " M" + (q.x + G) + " " + q.y + " H" + (q.x + A) +
         " M" + q.x + " " + (q.y - A) + " V" + (q.y - G) +
         " M" + q.x + " " + (q.y + G) + " V" + (q.y + A),
      fill: "none", stroke: "#fff", "stroke-width": 3, "stroke-opacity": .8 }));
    l.appendChild(el("path", {
      d: "M" + (q.x - A) + " " + q.y + " H" + (q.x - G) +
         " M" + (q.x + G) + " " + q.y + " H" + (q.x + A) +
         " M" + q.x + " " + (q.y - A) + " V" + (q.y - G) +
         " M" + q.x + " " + (q.y + G) + " V" + (q.y + A),
      fill: "none", stroke: TOOL_INK, "stroke-width": 1 }));
  }

  // The marquee, while it is being dragged.
  if (GEOM.band) {
    const a = map.project(GEOM.band.a), b = map.project(GEOM.band.b);
    l.appendChild(el("rect", {
      x: Math.min(a.x, b.x), y: Math.min(a.y, b.y),
      width: Math.abs(b.x - a.x), height: Math.abs(b.y - a.y),
      fill: EDIT_INK, "fill-opacity": .08,
      stroke: EDIT_INK, "stroke-width": 1, "stroke-dasharray": "4 3",
    }));
  }

  /**
   * The cut being laid. Drawn EXTENDED to the edge of the viewport, because that is what the
   * operation actually does — the two clicks pick a line, not a segment, and a stubby preview
   * between two points would promise a cut that stops where you stopped clicking.
   */
  if (GEOM.mode === "split" && GEOM.cutA && GEOM.cutB) {
    const a = map.project(GEOM.cutA), b = map.project(GEOM.cutB);
    const dx = b.x - a.x, dy = b.y - a.y;
    const len = Math.hypot(dx, dy);
    if (len > 0.5) {
      const far = (window.innerWidth + window.innerHeight) * 2;
      const ux = (dx / len) * far, uy = (dy / len) * far;
      l.appendChild(el("line", { x1: a.x - ux, y1: a.y - uy, x2: a.x + ux, y2: a.y + uy,
                                 stroke: EDIT_INK, "stroke-width": 1, "stroke-dasharray": "4 4",
                                 "stroke-opacity": .45 }));
    }
    l.appendChild(el("line", { x1: a.x, y1: a.y, x2: b.x, y2: b.y,
                               stroke: EDIT_INK, "stroke-width": 2 }));
    l.appendChild(el("circle", { cx: a.x, cy: a.y, r: 4, fill: EDIT_INK }));
  }
}

function geomAddVertex(ri, ci) {
  geomPush();
  geomClearSel();                              // the insert reindexes everything after it
  const ring = GEOM.rings[ri];
  const a = ring[ci], b = ring[(ci + 1) % ring.length];
  ring.splice(ci + 1, 0, [(a[0] + b[0]) / 2, (a[1] + b[1]) / 2]);
  geomDraw(); post("geomstate", geomState());
}

function geomRemoveVertex(ri, ci) {
  if (GEOM.rings[ri].length <= 4) return;      // a ring needs three distinct points, plus closure
  geomPush();
  GEOM.rings[ri].splice(ci, 1);
  geomClearSel();                              // indices below this one have all shifted
  geomDraw(); post("geomstate", geomState());
}

/**
 * Drag, on `mousemove` at the document level rather than on the handle.
 *
 * The handle is re-created by `geomDraw()` on every frame, so a listener bound to it would be
 * destroyed mid-gesture — the same reason selection here hangs off `mouseup` and not `click`.
 */
function geomDown(ev, what) {
  if (!GEOM) return;
  ev.preventDefault();
  const start = { x: ev.clientX, y: ev.clientY };
  /**
   * ⚠️ **The pointer graphic is hidden for the whole gesture, and we draw a crosshair instead**
   * (Olcay, 2026-08-18: *"the cursor covers the symbols while dragging and snapping"*).
   *
   * It covered them by construction rather than by bad luck: a corner handle is 10px across, so
   * the node can never be grabbed more than ~5px off-centre, and the snap marker is drawn at the
   * NODE (`aimPoint` = pointer − grabOffset). The marker therefore lands under the cursor's hotspot
   * every time. CAD solves this the same way — it hides the arrow and gives you a crosshair, whose
   * thin arms and open centre leave the AutoSnap marker readable. Taking their markers without
   * their crosshair was taking half the idiom.
   *
   * It also makes a law visible that until now could not be seen: the node moves BY how far the
   * pointer moved, never TO the pointer, so the gap between this crosshair and the marker IS the
   * grab offset.
   */
  const rect = map.getCanvas().getBoundingClientRect();
  document.body.classList.add("geom-drag");
  GEOM.pointer = { x: ev.clientX - rect.left, y: ev.clientY - rect.top };
  const snapshot = geomSnap();
  /**
   * ⚠️ **The geometry as it was when the gesture began — every frame is computed from THIS.**
   *
   * The whole-shape drag used to apply a per-frame delta on top of the previous frame's result,
   * which meant a `project → add pixels → unproject` round trip *per frame*. Mercator is not
   * linear, and that round trip is lossy, so a slow drag across the map accumulated error a fast
   * one did not — the shape ended up somewhere slightly different depending on how you moved the
   * mouse, which is indefensible for a floor plan. Rebuilding from the origin each frame makes
   * every gesture absolute: the same pointer position always produces the same geometry.
   *
   * It is also what makes rotate and scale honest. Applying 1° thirty times is not a 30° turn.
   */
  const origRings = JSON.parse(JSON.stringify(GEOM.rings));
  const origPoint = GEOM.point ? GEOM.point.slice() : null;
  /**
   * Where every node of the network stood when the gesture began, by `fid`. Same reason as
   * `origRings`: every frame is computed from the START, not from the frame before it, so a slow
   * drag and a fast one end in the same place.
   */
  const origNodes = new Map((GEOM.nodes || []).map(n => [n.fid, n.at.slice()]));
  /**
   * ⚠️ **Where you grabbed it, relative to the thing you grabbed** (Olcay, 2026-08-17: *"dragging
   * edge has a bug. it jumps to an offset location right at the start."*).
   *
   * Every one of these drags put the led point **where the pointer was**, not where it started plus
   * how far the pointer had moved. On a corner handle that is a jump of a few pixels and reads as
   * precision. On an **edge** it is a jump of however far along the line you grabbed — you press
   * halfway down a corridor and its end node teleports under your cursor before you have moved.
   *
   * The offset is taken once, at the press, and every frame aims at `pointer − offset`. Snap and
   * the guides are then computed for **where the node would be**, which is what they were always
   * meant to answer: you are snapping the node to the wall, not the cursor.
   */
  /**
   * ⚠️ **`origNodes` only holds the network being edited**, and an edge can be grabbed whose lead is
   * not in it — a corridor of a *different* network under the same pointer, or one added since the
   * editor opened. Falling back to the level's own node table matters more than it looks: without
   * it `leadOrig` is undefined, the offset silently becomes **zero**, and zero offset is exactly the
   * old bug — the node jumps to the cursor. A fallback that returns nothing is how a fixed bug
   * comes back wearing a different hat.
   */
  const leadOrig = what.kind === "vertex" ? (origRings[what.ri] || [])[what.ci]
                 : what.kind === "netnode" ? (origNodes.get(what.fid) || wfNodeAt(what.fid))
                 : what.kind === "point" ? origPoint : null;
  const grab = (() => {
    if (!leadOrig) return { dx: 0, dy: 0 };
    try { return grabOffset(start, map.project(leadOrig)); } catch (e) { return { dx: 0, dy: 0 }; }
  })();
  /**
   * **One line per drag, saying what it took hold of.** This bug was reported twice and could not be
   * reproduced from a terminal either time; the map is the only witness. A drag that jumps has
   * `grab` at 0,0 with a lead it could not find, and this says so at the moment it happens.
   */
  if (what.kind === "netnode" || what.kind === "vertex")
    console.info("[geometry] drag", what.kind, what.fid || (what.ri + ":" + what.ci),
      "· grabbed", Math.round(grab.dx) + "," + Math.round(grab.dy), "px from it",
      leadOrig ? "" : "· ⚠️ NO lead position — the drag will jump to the cursor");
  /**
   * Built once, here, for the life of the gesture — the map cannot move while a shape is being
   * dragged, so these screen coordinates stay true, and rebuilding per frame would cost more than
   * the frame has. Null when Snap is off, which turns every query below into a no-op.
   */
  const snapIdx = geomSnapIndex();
  /** The dragged feature's own corners at gesture start, in screen space — what move-snap tests. */
  const origScreen = origRings.map(r => r.slice(0, -1).map(c => {
    const p = map.project(c);
    return [p.x, p.y];
  }));
  const origPointScreen = origPoint ? (() => { const p = map.project(origPoint); return [p.x, p.y]; })() : null;
  const snapAt = (x, y) => snapQuery(snapIdx, x, y, SNAP_PX);
  /**
   * What tracking guides may line up with: every OTHER feature's corner near the drag, plus this
   * feature's own corners. Its own matter as much as its neighbours' — squaring a room against
   * itself is the commonest alignment there is.
   */
  const guideRefs = geomGuideRefs(snapIdx, origScreen);
  /** This shape's own grid, as Straighten measures it — the last-resort reference bearing. */
  const gridDeg = origScreen.length
    ? dominantAngle(origScreen.map(r => r.concat([r[0]]))) * 180 / Math.PI
    : 0;
  /** The transform pivot, fixed at gesture start — the box moves as you drag, the pivot must not. */
  const box = geomBox();
  const cx = box ? box.cx : 0, cy = box ? box.cy : 0;
  const a0 = Math.atan2(start.y - cy, start.x - cx);
  const d0 = Math.hypot(start.x - cx, start.y - cy) || 1;
  let moved = false;

  /** Rebuild the whole feature from its gesture-start state through one screen-space function. */
  const fromOrigin = fn => {
    GEOM.rings = origRings.map(r => r.map(fn));
    if (origPoint) GEOM.point = fn(origPoint);
  };
  const shift = (dx, dy) => fromOrigin(c => {
    const p = map.project(c);
    const q = map.unproject([p.x + dx, p.y + dy]);
    return [q.lng, q.lat];
  });

  const move = e => {
    if (!GEOM) return;
    if (!moved) {
      moved = true;
      GEOM.history.push(snapshot);
      GEOM.future = [];
      /**
       * ⚠️ **A drag rewrites the rings, so a combine's members stop describing them.**
       *
       * This is the one mutation that does NOT go through `geomPush` — it pushes its own snapshot
       * once, at the first move — so it did not inherit the dissolve and the composition survived a
       * reshape. Taking a member out afterwards would then have recomputed from the members and
       * silently thrown the drag away: exactly the failure the whole mechanism exists to prevent,
       * reached by the one door that did not have the lock on it.
       */
      GEOM.combine = null;
    }
    const pt = { x: e.clientX, y: e.clientY };
    /**
     * What the DRAGGED THING is aiming at — the pointer, less where in it you took hold. For every
     * other gesture (move, rotate, scale) this is the pointer itself, because those measure a delta
     * from the press rather than putting a point somewhere.
     */
    const aim = aimPoint(pt, grab);

    if (what.kind === "point") {
      const hit = snapAt(aim.x, aim.y);
      GEOM.snapHit = hit;
      /**
       * A point has no neighbours, so there is no edge to take an angle from — but it can still be
       * lined up with the corners around it, which is most of what placing a POI *is*. Alignment
       * guides only; `resolveGuides` handles a null anchor by simply not offering an angle.
       */
      let px = aim.x, py = aim.y;
      if (!hit && GEOM.snap) {
        const g = resolveGuides(null, aim.x, aim.y, guideRefs, geomSnapping(e));
        px = g.x; py = g.y;
        GEOM.guides = g.guides;
        GEOM.guideAt = [g.x, g.y];
      } else {
        GEOM.guides = GEOM.guideAt = null;
      }
      const q = map.unproject(hit ? [hit.x, hit.y] : [px, py]);
      GEOM.point = [q.lng, q.lat];
      /**
       * **A wayfinding node drags its corridors with it** (Olcay, 2026-08-16: *"easy to edit"*).
       *
       * Here rather than on commit, and that is the point: a network whose edges catch up only when
       * you let go looks like the edit failed while you are making it. It costs the node's own
       * degree — about four — because `moveNetworkNode` touches only the lines that name it.
       */
      wfNodeMoved(GEOM.fid, GEOM.point);

    } else if (what.kind === "netnode") {
      /**
       * One node of a network, dragged. The same Snap and the same guides a room's corner gets —
       * a node lines up with the wall beside it far more often than with nothing.
       */
      const hit = snapAt(aim.x, aim.y);
      GEOM.snapHit = hit;
      let px = aim.x, py = aim.y;
      if (!hit && GEOM.snap) {
        const g = resolveGuides(null, aim.x, aim.y, guideRefs, geomSnapping(e));
        px = g.x; py = g.y;
        GEOM.guides = g.guides;
        GEOM.guideAt = [g.x, g.y];
      } else {
        GEOM.guides = GEOM.guideAt = null;
      }
      const q = map.unproject(hit ? [hit.x, hit.y] : [px, py]);
      const lead = GEOM.nodes && GEOM.nodes.find(x => x.fid === what.fid);
      if (lead) {
        /**
         * **The node you grabbed goes where the pointer is; the rest of the selection follows by
         * the same screen offset** — the same rule a room's selected corners follow, so a selection
         * keeps its shape and simply moves. Snapping applies to the one under the cursor only:
         * snapping each of them to its own nearest neighbour would deform the group into whatever
         * happened to be lying about.
         */
        const p0 = map.project(origNodes.get(what.fid));
        const p1 = map.project([q.lng, q.lat]);
        const dx = p1.x - p0.x, dy = p1.y - p0.y;
        for (const n of GEOM.nodes) {
          if (n.fid !== what.fid && !(GEOM.sel.has(n.fid) && GEOM.sel.has(what.fid))) continue;
          const from = origNodes.get(n.fid);
          if (!from) continue;
          const at = n.fid === what.fid ? [q.lng, q.lat] : (() => {
            const p = map.project(from);
            const to = map.unproject([p.x + dx, p.y + dy]);
            return [to.lng, to.lat];
          })();
          n.at = at;
          // The corridors follow each node while it moves — see `wfNodeMoved`.
          wfNodeMoved(n.fid, at);
        }
      }

    } else if (what.kind === "vertex") {
      const hit = snapAt(aim.x, aim.y);
      GEOM.snapHit = hit;
      /**
       * Guides only when snapping caught nothing. A snap is a point that actually exists on another
       * feature; a guide is a line you might want to be on. Letting a guide override a snap would
       * pull you off the very corner you had just met.
       *
       * The anchor is the corner BEFORE this one in the ring, so the angle guide measures the edge
       * you are dragging — which is the edge you want straight.
       */
      let gx = aim.x, gy = aim.y;
      /**
       * ⚠️ **Guides obey the Snap toggle**, so the toggle means one thing — *the tool holds you to
       * something* — and turning it off is the way to place a corner at a deliberate 85°, which a
       * 6° magnet on 90° would otherwise make unreachable. Without an escape, a helpful magnet is
       * just a tool overruling you.
       */
      if (!hit && GEOM.snap) {
        const ring = origScreen[what.ri] || [];
        const g = resolveGuides(geomVertexAnchors(ring, what.ci, gridDeg),
                                aim.x, aim.y, guideRefs, geomSnapping(e));
        gx = g.x; gy = g.y;
        GEOM.guides = g.guides;
        GEOM.guideAt = [g.x, g.y];
      } else {
        GEOM.guides = GEOM.guideAt = null;
      }
      const q = map.unproject(hit ? [hit.x, hit.y] : [gx, gy]);
      /**
       * **The dragged corner goes where the pointer took it from; the rest of the selection follows
       * by the same screen offset.** Not "every selected corner to the pointer", which would collapse
       * them all onto one spot — the selection keeps its shape and simply moves.
       *
       * Snapping still applies to the corner under the cursor only. Snapping each of them to its
       * own nearest neighbour would distort the group into whatever happened to be nearby.
       */
      const p0 = map.project(origRings[what.ri][what.ci]);
      const p1 = map.project([q.lng, q.lat]);
      const dx = p1.x - p0.x, dy = p1.y - p0.y;
      GEOM.rings = JSON.parse(JSON.stringify(origRings));
      GEOM.rings[what.ri][what.ci] = [q.lng, q.lat];
      for (const k of GEOM.sel) {
        if (k === selKey(what.ri, what.ci)) continue;
        const [ri, ci] = k.split(":").map(Number);
        const ring = GEOM.rings[ri];
        if (!ring || ci >= ring.length - 1) continue;
        const p = map.project(origRings[ri][ci]);
        const to = map.unproject([p.x + dx, p.y + dy]);
        ring[ci] = [to.lng, to.lat];
      }
      // Every ring closes on its own first point, so a moved first corner moves the closer too.
      for (const ri of new Set([...GEOM.sel].map(k => Number(k.split(":")[0])).concat(what.ri))) {
        const ring = GEOM.rings[ri];
        if (ring) ring[ring.length - 1] = ring[0].slice();
      }

    } else if (what.kind === "rotate") {
      let deg = geomWrapDeg((Math.atan2(pt.y - cy, pt.x - cx) - a0) * 180 / Math.PI);
      if (geomSnapping(e)) deg = Math.round(deg / SNAP_DEG) * SNAP_DEG;
      const a = deg * Math.PI / 180, cos = Math.cos(a), sin = Math.sin(a);
      fromOrigin(c => {
        const p = map.project(c), dx = p.x - cx, dy = p.y - cy;
        const q = map.unproject([cx + dx * cos - dy * sin, cy + dx * sin + dy * cos]);
        return [q.lng, q.lat];
      });
      GEOM.xform = { text: (deg > 0 ? "+" : "") + Math.round(deg) + "°", x: pt.x, y: pt.y };

    } else if (what.kind === "scale") {
      let k = Math.hypot(pt.x - cx, pt.y - cy) / d0;
      if (geomSnapping(e)) k = Math.round(k / SNAP_PCT) * SNAP_PCT;
      // A shape dragged through its own centre must not invert or vanish.
      k = Math.max(0.05, Math.min(20, k));
      fromOrigin(c => {
        const p = map.project(c);
        const q = map.unproject([cx + (p.x - cx) * k, cy + (p.y - cy) * k]);
        return [q.lng, q.lat];
      });
      GEOM.xform = { text: Math.round(k * 100) + "%", x: pt.x, y: pt.y };

    } else {
      let dx = pt.x - start.x, dy = pt.y - start.y;
      /**
       * ⚠️ **Moving the whole shape used to ignore Snap entirely** (Olcay, 2026-08-16: *"While move
       * is selected snap should snap to other features again"*) — the toggle was on, the tool said
       * it was snapping, and nothing snapped.
       *
       * Every one of the feature's own corners is offered to the index at its would-be position,
       * and the single closest catch wins: the whole shape is nudged by that one correction, so it
       * arrives against its neighbour without being deformed. Testing them all is what makes it
       * feel right — whichever corner comes near a wall is the one that takes hold, which is what
       * you were aiming with.
       */
      let best = null;
      for (const ring of origScreen) {
        for (const p of ring) {
          const hit = snapAt(p[0] + dx, p[1] + dy);
          if (hit && (!best || hit.d < best.d)) {
            best = { d: hit.d, ddx: hit.x - (p[0] + dx), ddy: hit.y - (p[1] + dy), at: hit };
          }
        }
      }
      if (!best && origPointScreen) {
        const hit = snapAt(origPointScreen[0] + dx, origPointScreen[1] + dy);
        if (hit) best = { d: hit.d, ddx: hit.x - (origPointScreen[0] + dx),
                          ddy: hit.y - (origPointScreen[1] + dy), at: hit };
      }
      if (best) { dx += best.ddx; dy += best.ddy; }
      GEOM.snapHit = best ? best.at : null;
      shift(dx, dy);
    }
    if (GEOM) GEOM.pointer = { x: e.clientX - rect.left, y: e.clientY - rect.top };
    geomDraw();
  };
  const up = () => {
    document.removeEventListener("mousemove", move);
    document.removeEventListener("mouseup", up);
    // Every setter has a matching clear — a hidden cursor outliving its gesture is the worst of
    // both worlds, and a crosshair left on the map is a pointer that is no longer there.
    document.body.classList.remove("geom-drag");
    if (GEOM) { GEOM.xform = null; GEOM.snapHit = null; GEOM.guides = GEOM.guideAt = null; GEOM.pointer = null; }
    if (moved) { geomDraw(); post("geomstate", geomState()); }
  };
  document.addEventListener("mousemove", move);
  document.addEventListener("mouseup", up);
}

window.addEventListener("message", (ev) => {
  const d = ev.data;
  if (!d) return;
  if (d.type === "changes" && Array.isArray(d.changes)) {
    // The app owns the diff, so its list is authoritative: drop anything it no longer sends (an
    // empty list = a plain map, e.g. Map Content / Editing Level), then merge by feature name so
    // geometry we've already resolved survives a decision change.
    const keep = CHANGES.filter(c => d.changes.some(i => i.name === c.name));
    CHANGES.length = 0;
    d.changes.forEach(incoming => {
      const ch = keep.find(c => c.name === incoming.name);
      CHANGES.push(ch ? Object.assign(ch, incoming) : Object.assign({}, incoming));
    });
    RESOLVED = RESOLVED.filter(r => CHANGES.indexOf(r.change) >= 0);
    resolvePasses = 0;
    SELECTED = CHANGES.indexOf(SELECTED) >= 0 ? SELECTED : null;
    HOVERED = null;
    if (map) { resolveChanges(); redraw(); renderTip(); }
  } else if (d.type === "highlight") {
    /**
     * The app's own highlight — a tree row under the cursor, or the current selection. It goes
     * through the same decision as a map hover: **a wayfinding node lights its neighbourhood, not a
     * pin.** A row and a hover are two doors into the same act, and they should not disagree about
     * what the mark for a node looks like.
     *
     * A whole-type highlight (`mainType`/`subType`, no fid) keeps the SDK's layer, which is exactly
     * what it is good at — lighting 989 walls at once.
     */
    if (d.sel && d.sel.fid && !d.sel.fids && isNetworkNode(d.sel.fid, null)) hoverMark(d.sel.fid, null);
    else { wfHighlight(null); highlightFeatures(d.sel || null); }
  } else if (d.type === "focusfeature") {
    /**
     * ⚠️ **The app repointing the panel after a combine must not move the camera.**
     *
     * `geomTakeIdentity` tells the app the edit now belongs to a different feature; the app moves
     * its panel, which changes `focusFeature`, which arrives back here as an ordinary focus. Acted
     * on, it would centre the survivor's *published* bounds — the map moving, right after a gesture
     * finished, to fit a shape that no longer exists. Less violent since focusing stopped changing
     * the zoom, but still a camera move nobody asked for. The flag is consumed once, so a genuine
     * selection of the same feature a moment later behaves normally.
     */
    if (GEOM && GEOM.fid === d.fid && GEOM.skipFocus) {
      GEOM.skipFocus = false;
      sendFeatureProps(d.fid);
      return;
    }
    // Two jobs, two retry budgets — see sendFeatureProps.
    focusFeature(d.fid, 0, d.padRight);
    sendFeatureProps(d.fid);
  } else if (d.type === "active") {
    ACTIVE_PAD_RIGHT = Number(d.padRight) || 0;
    // A changelog row was clicked — mirror it here. Deferred until geometry exists, because a
    // row can be clicked before `resolveChanges()` has caught up and there'd be nothing to fly to.
    PENDING_ACTIVE = d.id ?? null;
    if (map) setActive(PENDING_ACTIVE);
  } else if (d.type === "target") {
    // Switch the level (and building) under the map without reloading the SDK. All of the care —
    // idempotence, coalescing, the readiness gate — lives in requestTarget().
    requestTarget({ building: d.building, level: d.level });
  } else if (d.type === "camera" && d.cam && map) {
    // A mirrored move from the other Compare pane. Guarded so it can't echo back.
    applyingCam = true;
    try {
      map.jumpTo({ center: [d.cam.lng, d.cam.lat], zoom: d.cam.zoom, bearing: d.cam.bearing, pitch: d.cam.pitch });
    } finally { applyingCam = false; }
  } else if (d.type === "prefs") {
    if ("greyscale" in d) prefs.greyscale = !!d.greyscale;
    if ("hidePoiLabels" in d) prefs.hidePoiLabels = !!d.hidePoiLabels;
    if ("floorplan" in d) prefs.floorplan = !!d.floorplan;
    if ("floorplanTransparency" in d) {
      // Clamp at the boundary: this arrives over postMessage, and NaN or 3 must not become paint.
      const t = +d.floorplanTransparency;
      if (isFinite(t)) prefs.floorplanTransparency = Math.max(0, Math.min(1, t));
    }
    if ("basemap" in d) prefs.basemap = d.basemap;
    /**
     * ⚠️ **Absent means "yes, if you can"**, not "no". Four of the five screens build a `MapPrefs`
     * without this field — only Map Content fetches any GeoJSON — so treating a missing key as
     * `false` would switch the render off everywhere the app never had an opinion. `gjWanted()`
     * requires features as well, so the permissive default costs nothing where there are none.
     */
    if ("geojsonFloor" in d) {
      prefs.geojsonFloor = d.geojsonFloor !== false;
      // Off is immediate: the tiles come back on this frame rather than at the next idle, because
      // this one is a switch somebody just flicked and watched.
      if (!prefs.geojsonFloor && GJ.phase !== "off") gjTeardown("switched off");
    }
    applyPrefs();
  } else if (d.type === "dropzone") {
    // The app says whether this pane accepts file drops (upload surfaces only — a Compare pane
    // or a review map shouldn't invite an upload it can't take).
    DROP_ON = !!d.on;
  } else if (d.type === "peers") {
    PEERS = Array.isArray(d.peers) ? d.peers : [];
    drawPeers();
  } else if (d.type === "geom") {
    // One entry point for every toolbar command — the app never reaches into the editor's state.
    if (d.cmd === "begin") geomBegin(d.fid);
    /**
     * **Begin editing the feature a CHANGE resolved to** (2026-08-25) — how the review page arms
     * the editor.
     *
     * It exists because the app has never held these fids. A change is matched to a real feature
     * **by name**, here, in `resolveChanges`; the app's `Change.id` is an authored slug. So the
     * app names the change and this side supplies the fid, rather than the app guessing one and
     * `geomBegin` quietly editing nothing.
     */
    else if (d.cmd === "beginchange") {
      const r = RESOLVED.find(x => x.change && x.change.id === d.id);
      if (r && r.fid) {
        /**
         * ⚠️ **The session previews its own outcome, and it must be set BEFORE the redraw.**
         * Otherwise a confirmed removal is still ghosted at the moment its handles go down — and a
         * dashed outline with no fill is not a thing you can edit. See `previewFate`.
         */
        setEditingChange(d.id);
        /**
         * **The pinned card goes.** It carries a duplicate ✓ ✎ ✗ for the very change now open in a
         * 360px panel, and it would sit under it or argue with it. One surface at a time.
         */
        SELECTED = null; renderTip(); tip.classList.remove("pinned");
        applyPreviewHidden(); redraw();
        geomBegin(r.fid, r.rings);
        /**
         * **The panel needs the feature's own property bag, and the app has never held these fids** —
         * which is the whole reason `beginchange` exists. This side has the fid, and `featureprops`
         * is the message Map Content already listens to, so the review gets the panel filled by
         * reusing what is there rather than by growing a second protocol.
         */
        sendFeatureProps(r.fid);
      }
      else post("geomerror", { fid: "", message: "That change has no feature on this floor yet." });
    }
    else if (d.cmd === "end") {
      geomEnd(!!d.commit);
      // The session is over: whatever the row decided is what the map should show again.
      setEditingChange(null);
      applyPreviewHidden(); redraw();
    }
    else if (d.cmd === "commit") geomCommit();
    else if (d.cmd === "mode") geomSetMode(d.mode);
    else if (d.cmd === "snap") geomToggleSnap();
    else if (d.cmd === "undo") geomUndo();
    else if (d.cmd === "redo") geomRedo();
    else if (d.cmd === "reset") geomReset();
    else if (d.cmd === "simplify") geomSimplify();
    else if (d.cmd === "square") geomSquare();
    // `rotate` / `scale` used to arrive here from four stepped toolbar buttons. They are handles on
    // the transform box now (see geomBox), so there is nothing left for the app to command.
    // Split is a MODE, not an act: the toolbar arms it, the two clicks on the map do the cutting.
    else if (d.cmd === "split") geomSetMode(GEOM && GEOM.mode === "split" ? "vertices" : "split");
    /**
     * ⚠️ **Combine is an ACT, not a mode** — the one place it differs from Split.
     *
     * It was a mode for a few hours, with its own armed pick list, until shift-click made selection
     * a thing the whole editor has. There is nothing left for a Combine mode to do: the features
     * are already chosen before you reach for it, and the button's job is to say whether they can
     * be joined and then join them.
     */
    else if (d.cmd === "combine") geomApplyCombine();
    // The app owns the selection and tells the map what is in it — see geomSetSelection.
    else if (d.cmd === "select") geomSetSelection(d.fids);
    // The combined result is editable from the panel's list: take a member out, or put back
    // something the combine removed from the map.
    else if (d.cmd === "uncombine") geomUncombine(d.fid);
    else if (d.cmd === "unhide") geomUnhide(d.fid);
  } else if (d.type === "editing") {
    EDITING = Array.isArray(d.editing) ? d.editing : [];
    drawEditing();
  } else if (d.type === "editabletypes") {
    BLOCKED_TYPES = new Set(d.types || []);
  } else if (d.type === "quiettypes") {
    QUIET_TYPES = new Set(d.types || []);
  } else if (d.type === "levelpaths") {
    /**
     * The level's wayfinding nodes **and their adjacency** — see `cloud/levelPaths` in the app.
     *
     * The edges are built here rather than in the app because they are geometry, and geometry is
     * this file's job: the app has no projection, no source and nothing to draw into. An empty list
     * is not a failure — it means the section draws nodes and no corridors, which is what it did
     * before this existed.
     */
    WF_NODES = Array.isArray(d.nodes) ? d.nodes : [];
    wfBuildEdges();
    applyWayfinding();
  } else if (d.type === "section") {
    /**
     * Which rail section is on screen, as the one `mainType` it owns. `null` is Map Content.
     *
     * It changes what ANSWERS, not what is drawn — the floor plan stays underneath, because a
     * corridor over a void tells you nothing about where it goes.
     */
    SECTION_TYPE = d.mainType || null;
    HOVER_FEATURE = null;      // a card raised by the section you just left must not survive it
    renderTip();
  } else if (d.type === "hiddentypes") {
    /**
     * What this screen may not **draw** — the wayfinding network, geofences and positioning
     * devices, each of which has its own section of the left rail (Olcay, 2026-08-16).
     *
     * Kept de-hyphenated alongside the raw list because that is the form both render paths compare
     * in: a layer selects its rows by `source-layer`, which is the `mainType` with the hyphens
     * stripped, and doing that conversion per layer per idle would be the same answer computed a
     * few hundred times a second.
     */
    HIDDEN_TYPES = new Set(d.types || []);
    HIDDEN_FLAT = new Set([...HIDDEN_TYPES].map(flatType));
    applyHiddenTypes();
    // Rebuild the outline: a type that has just been hidden leaves its `__fp_` layer behind, and a
    // type that has just been SHOWN has no outline layer yet — `addFloorplan` only ever adds.
    for (const id of FP_LAYERS.slice()) {
      try { if (map && map.getLayer(id)) map.removeLayer(id); } catch (e) {}
      FP_LAYERS.splice(FP_LAYERS.indexOf(id), 1);
    }
    try { addFloorplan(); applyPrefs(); } catch (e) {}
  } else if (d.type === "levelgeom") {
    /**
     * The level's TRUE geometry, from Pointr Cloud — see `cloud/levelFeatures` in the app.
     *
     * ⚠️ This is the fix for the tile seam. A tile carries a feature **clipped to itself**, so a
     * feature bigger than a tile has no true outline anywhere in the tiles; this does, once, whole.
     * An empty list is not a failure — it means the fetch could not answer and `geomFind` should go
     * on reading the tiles, exactly as it always did.
     */
    LEVEL_GEOM = new Map();
    for (const f of (d.features || [])) if (f && f.fid && f.geometry) LEVEL_GEOM.set(f.fid, f.geometry);
    /**
     * The same payload, kept whole, because the **render** wants what the editor does not: the
     * property bags the SDK's cloned layers filter and label on. `level` comes with it and is not
     * read off `TARGET` — a slow fetch can land after the floor has moved on, and stamping these
     * features with the level they are actually from is the difference between them rendering and
     * being filtered out by the SDK's own `lvl` clause.
     */
    LEVEL_FEATS = Array.isArray(d.features) ? d.features : [];
    LEVEL_FEATS_LVL = typeof d.level === "number" ? d.level : TARGET.level;
    // A new level's features invalidate everything the last verdict was about, including a `failed`
    // one: the next floor is a fresh question and deserves to be asked again.
    if (GJ.phase !== "off") gjTeardown("new level geometry arrived");
    GJ.phase = "off";
    /**
     * The floor-plan outline follows the DRAFT from here, whether or not the render swap ever runs.
     * On the review screen the swap never does — see `fpMode` — and this is the whole of what makes
     * "Show floor-plan" show the plan being reviewed rather than the one already published.
     */
    FP_DRAFT = { names: [], lvl: null };
    const drew = fpBuildDraftSources();
    if (drew) addFloorplan();
    console.info("[geojson] map shell holds", LEVEL_GEOM.size, "unclipped feature geometries",
      LEVEL_FEATS.length ? "· level " + LEVEL_FEATS_LVL : "",
      drew ? "· floor-plan outline now traces the DRAFT (" + FP_DRAFT.names.length + " sources)"
           : "· floor-plan outline still traces the published tiles");
  } else if (d.type === "decidable") {
    CAN_DECIDE = !!d.on;
    renderTip();          // a card already open must lose its control immediately
  }
});

/* ── drag-and-drop floor-plan upload ─────────────────────────────────────────
   The iframe owns every drag event over the map, so the drop is caught HERE and only the file's
   name/size is posted up — the app decides what it means (confirmation overlay with the
   building/level the map is showing). preventDefault runs regardless of DROP_ON so a stray drop
   never makes the browser navigate away from the map page. The veil is visual only
   (pointer-events: none); depth-counting dragenter/leave is the classic fix for leave events
   firing on every child boundary. */
let DROP_ON = false, dragDepth = 0;
/**
 * May the user DECIDE from this map? (Olcay, 2026-08-14: *"the overlay that we can reject
 * flag or confirm ... only lives in review. Once flagged the flag icon should continue
 * showing on the map."*)
 *
 * The mark and the control are two different things. A flag is a **fact about the feature**
 * and travels with it everywhere; ✓ 🚩 ✗ is an **act of reviewing** and belongs only where a
 * review is happening. Browsing Map Content you see the flag and cannot change it.
 *
 * Told, not inferred, and defaulting to true — a pane that forgets to say stays as it was.
 * The parent sets it from whether it passed an `onDecision` handler at all, so the map can
 * never offer a control whose result nobody is listening for.
 */
let CAN_DECIDE = true;

/**
 * Other people's cursors, in MAP coordinates (Olcay, 2026-08-14).
 *
 * The app decides who belongs here — it knows the floor everyone is on, and presence is scoped to
 * the level, never the viewport. This page's only job is to project lng/lat into its own screen
 * and draw a pointer, which is why the position travels as coordinates: everyone is at a different
 * zoom and window size, and a pixel means nothing outside the viewport that produced it.
 */
let PEERS = [];
/** Features other people have open in the editor: [{ fid, who, colour }]. */
let EDITING = [];


/**
 * `fid` → the feature's **whole** geometry, as Pointr Cloud holds it, when the app has managed to
 * fetch it. Empty means "ask the tiles", which is what this file did on its own for two days.
 */
let LEVEL_GEOM = new Map();

/**
 * The feature under the cursor that is NOT part of a review — Olcay, 2026-08-14: *"when hovered we
 * should show the same overlay for each feature"*. A change already has its own card (with the
 * decision control where that is allowed); this is the same card for everything else, so hovering
 * the map answers "what is this?" everywhere rather than only over the diff.
 */
let HOVER_FEATURE = null;
const veil = document.getElementById("dropveil");
const hasFiles = ev => !!(ev.dataTransfer && Array.from(ev.dataTransfer.types || []).indexOf("Files") >= 0);
document.addEventListener("dragenter", ev => {
  if (!hasFiles(ev)) return;
  ev.preventDefault();
  dragDepth++;
  if (DROP_ON) veil.classList.add("on");
});
document.addEventListener("dragover", ev => { if (hasFiles(ev)) ev.preventDefault(); });
document.addEventListener("dragleave", ev => {
  if (!hasFiles(ev)) return;
  if (--dragDepth <= 0) { dragDepth = 0; veil.classList.remove("on"); }
});
document.addEventListener("drop", ev => {
  ev.preventDefault();
  dragDepth = 0;
  veil.classList.remove("on");
  const f = ev.dataTransfer && ev.dataTransfer.files && ev.dataTransfer.files[0];
  if (DROP_ON && f) post("filedrop", { name: f.name, size: f.size });
});
</script>
</body>
</html>
