 * The property bag rides this function rather than getting a request of its own for two reasons:
 * the scan that finds the geometry has the properties in its hand already, and — the load-bearing
 * one — this is the only place that **retries until the tiles land**. A separate lookup would need
 * its own copy of that retry, and would answer "no such feature" during the ~3s a level switch
 * takes, which is exactly when the panel is opening.
 *
 * `padRight` reserves the panel's own width so the feature frames in the map you can still SEE
 * (Olcay, 2026-08-12: *"don't resize map but center — offset the key element"*). Without it a
 * feature centres in the pane and then sits underneath the panel that is describing it.
 */
/**
 * Find one feature in the tiles that happen to be loaded: its extent and its property bag.
 * Returns `null` when the tiles holding it aren't in memory — which is a normal, frequent state,
 * not an error (see `FEATURE_BOUNDS`).
 */
function scanFeature(fid) {
  let minx=180, miny=90, maxx=-180, maxy=-90, n=0;
  let props = null;
  const eat = coords => {
    if (typeof coords[0] === "number") {
      const x = coords[0], y = coords[1]; n++;
      if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y;
    } else coords.forEach(eat);
  };
  try {
    for (const { source, sourceLayer } of indoorPairs()) {
      for (const f of map.querySourceFeatures(source, sourceLayer ? { sourceLayer } : undefined)) {
        if (!f.properties || f.properties.fid !== fid) continue;
        // A feature split across tiles arrives once per tile with the same properties, so the
        // first bag is as good as any; the geometry still accumulates over all of them.
        if (!props) props = Object.assign({}, f.properties);
        if (f.geometry && f.geometry.coordinates) eat(f.geometry.coordinates);
      }
    }
  } catch(e){}
  if (!props && !n) return null;
  return { props, bounds: n ? [minx, miny, maxx, maxy] : null };
}

/**
 * Report a feature's properties to the app — the POI panel's supply (§19).
 *
 * **Separate from `focusFeature` on purpose.** The two want different things from a retry: the
 * camera move needs to happen ONCE and must not fight the user's panning, while the properties may
 * legitimately need several attempts — a feature outside the loaded tiles has no bag to read until
 * the camera has flown there and the tiles have arrived. Sharing one retry meant a re-fit on every
 * attempt; splitting them lets the properties keep trying while the camera stays put.
 */
function sendFeatureProps(fid, tries) {
  tries = tries || 0;
  if (!map || fid == null) return;
  const hit = scanFeature(fid);
  if (hit && hit.props) { post("featureprops", { fid, props: hit.props }); return; }
  if (tries < 20) setTimeout(() => sendFeatureProps(fid, tries + 1), 500);
}

function focusFeature(fid, tries, padRight) {
  tries = tries || 0;
  padRight = padRight || 0;
  if (!map || fid == null) return;
  const hit = scanFeature(fid);
  /**
   * Loaded tiles first, then the cache recorded when the tree's rows were built.
   *
   * The fallback is what makes a far-away feature reachable at all: without it the camera could
   * only ever fly to somewhere it had already been. With it, the move happens immediately, the
   * tiles arrive because of the move, and `sendFeatureProps` picks the properties up on a retry.
   */
  const bounds = (hit && hit.bounds) || FEATURE_BOUNDS[fid] || null;
  if (!bounds) {
    /**
     * Neither loaded nor cached — the normal case straight after a LEVEL SWITCH, when the tree has
     * asked for the floor and the feature in one breath and the counts haven't run yet. Retry
     * rather than silently doing nothing, which is what made clicking a row on another floor look
     * broken.
     *
     * ⚠️ The window has to outlast a LEVEL SWITCH, and that is the bit worth measuring rather than
     * guessing: the switch re-applies ~600 layer filters on a ~3s cadence, so a 3.2s window
     * (8 × 400ms) expired just as the tiles began arriving and the map stayed put. 20 × 500ms
     * gives it 10s, comfortably longer than the switch itself.
     */
    if (tries < 20) setTimeout(() => focusFeature(fid, tries + 1, padRight), 500);
    return;
  }
  try {
    /**
     * ⚠️ **All four corners, not two.** A lng/lat box's opposite corners project to opposite
     * corners of the SCREEN box only while the bearing is zero; rotate the map and the two you
     * picked are a diagonal of something else entirely.
     */
    const pts = [[bounds[0], bounds[1]], [bounds[2], bounds[1]],
                 [bounds[2], bounds[3]], [bounds[0], bounds[3]]].map(c => map.project(c));
    const xs = pts.map(p => p.x), ys = pts.map(p => p.y);
    const x0 = Math.min(...xs), x1 = Math.max(...xs);
    const y0 = Math.min(...ys), y1 = Math.max(...ys);

    /**
     * The part of the map you can actually see and work in: the canvas, less whatever the
     * properties panel is covering on the right, less a margin — a feature pressed against the
     * bezel is technically visible and practically not.
     */
    const cv = map.getCanvas();
    const pan = focusPan({ x0, x1, y0, y1 }, focusView(cv.clientWidth, cv.clientHeight, padRight));
    if (!pan) return;                            // already where you can see it — leave the camera
    /**
     * A long slide at close zoom is a smear, and the usual cure — `flyTo`'s zoom-out-and-back arc —
     * is the very thing this must not do. So a move of more than about three screens is a **cut**
     * instead: arriving is less disorienting than being dragged.
     */
    const far = Math.hypot(pan[0], pan[1]) > 3 * Math.max(cv.clientWidth, cv.clientHeight);
    /**
     * ⚠️ **The sign, because getting it backwards sends the feature the other way** — and read out
     * of the shipped bundle rather than remembered: `panBy(p)` is `panTo(center, { offset: -p })`,
     * and `handleEaseTo` lands `center` at `centerPoint + offset`. So the content shifts by `-p`,
     * and a feature at screen `cx` ends at `cx - p`. `focusPan` therefore returns
     * `featureCentre - viewCentre`, which is what lands it in the middle.
     */
    map.panBy(pan, { duration: far ? 0 : 650, essential: true });
  } catch(e){}
}

/* FOCUS-ENGINE-START — extracted and tested by scratch/geometry.test.mjs; keep DOM- and map-free. */

/**
 * How close to the edge a feature may sit and still count as visible.
 *
 * A shape pressed against the bezel is technically on screen and practically not — you cannot see
 * what is around it, which is half of knowing where it is.
 */
const FOCUS_MARGIN = 48;

/**
 * The part of the map you can actually see and work in: the canvas, less whatever the properties
 * panel is covering on the right, less the margin. `null` when the panel leaves no usable map at
 * all, which is the one case where there is nothing sensible to do.
 */
function focusView(width, height, padRight) {
  const v = {
    x0: FOCUS_MARGIN, x1: width - (padRight || 0) - FOCUS_MARGIN,
    y0: FOCUS_MARGIN, y1: height - FOCUS_MARGIN,
  };
  return v.x1 > v.x0 && v.y1 > v.y0 ? v : null;
}

/**
 * How far to pan to bring `box` into `view`, or **`null` when the camera should not move at all**.
 *
 * That null is the point of the whole function. The best answer to "show me this" is very often no
 * movement, and moving anyway is how a map stops feeling like the user's — which is exactly the
 * complaint that produced this (Olcay, 2026-08-16).
 *
 * ⚠️ **A feature too big to fit is judged on its CENTRE, not its edges.** A concourse can never sit
 * inside the viewport, so the containment test says "not visible" every time and it would pan on
 * every single click — including the clicks where you were already looking straight at it.
 *
 * Screen space throughout, so it is indifferent to bearing and pitch: the caller projects the
 * feature's four corners and hands over the box they make.
 */
function focusPan(box, view) {
  if (!view) return null;
  const cx = (box.x0 + box.x1) / 2, cy = (box.y0 + box.y1) / 2;
  const fits = (box.x1 - box.x0) <= (view.x1 - view.x0) &&
               (box.y1 - box.y0) <= (view.y1 - view.y0);
  const settled = fits
    ? box.x0 >= view.x0 && box.x1 <= view.x1 && box.y0 >= view.y0 && box.y1 <= view.y1
    : cx >= view.x0 && cx <= view.x1 && cy >= view.y0 && cy <= view.y1;
  if (settled) return null;
  return [cx - (view.x0 + view.x1) / 2, cy - (view.y0 + view.y1) / 2];
}
/* FOCUS-ENGINE-END */

/**
 * How much of the map's right edge a panel is covering, as the app last reported it with `active`.
 *
 * ⚠️ **`focusChange` is NOT `focusFeature`.** The latter has taken a `padRight` since the properties
 * panel existed; this one is the review's path — click a row, fly to the change — and it framed
 * against the whole pane, so with a 360px panel open the feature it centred landed behind it.
 */
let ACTIVE_PAD_RIGHT = 0;
function focusChange(change) {
  if (!map) return;
  const hit = RESOLVED.find(r => r.change === change);
  if (!hit) return;                       // geometry not resolved yet — the map just doesn't move
  let minx=180, miny=90, maxx=-180, maxy=-90, n=0;
  hit.rings.forEach(r => r.forEach(([x,y]) => {
    n++; if(x<minx)minx=x; if(x>maxx)maxx=x; if(y<miny)miny=y; if(y>maxy)maxy=y; }));
  if (!n) return;
  try {
    map.fitBounds([[minx,miny],[maxx,maxy]], {
      // room for the card, which sits above the shape and would otherwise cover the neighbours
      // that tell you where you are
      // ⚠️ `top: 190` is room for the pinned card above the shape. While an editor is open there is
      // no card (see `beginchange`), but the reservation is harmless and one number is easier to
      // reason about than two.
      padding: { top: 190, bottom: 90, left: 90, right: 90 + ACTIVE_PAD_RIGHT },
      maxZoom: FOCUS_MAX_ZOOM,
      duration: 650,
      essential: true,                    // survives prefers-reduced-motion being set
    });
  } catch(e){}
}

/**
 * The pane *opens* top-down — a floor plan is read flat — but rotate/tilt stay available (right-
 * drag or ctrl-drag, two-finger on touch). Only the SDK's own unrequested pitch is reset, and only
 * until we've framed; after that the camera is the user's.
 *
 * Tilting flips the SDK into 3D-model mode, which hides the indoor fills/symbols — ensureIndoorVisible()
 * on `idle` puts them back, so rotation no longer costs you the floor plan.
 */
function flattenOnce() {
  try {
    if (map.getPitch() !== 0) map.setPitch(0);
    if (map.getBearing() !== 0) map.setBearing(0);
  } catch(e){}
}

// Fit to the changes once — and only once they've ALL resolved, otherwise the first tile to render
// frames a single shop at max zoom. `force` gives up waiting for a change that never appears.
function maybeFrame(force) {
  if (framed || !RESOLVED.length) return;
  if (!force && RESOLVED.length < CHANGES.length) return;
  framed = true;
  frameChanges();
}

/**
 * Resolve every change against the current floor, then frame them. Tiles stream in, so this takes
 * several passes, and the whole building has to stay in view while it runs — queryRenderedFeatures()
 * only sees the viewport, so framing first strands every change outside the new view.
 *
 * Shared by boot and by a level switch. A switched-to floor needs exactly this pass and never used
 * to get one, so its changes stayed unresolved and unframed. `done(partial)` — partial means we
 * gave up with changes still unresolved.
 *
 * A pass belongs to the switch generation that started it: if a newer switch begins mid-flight this
 * one stands down rather than resolving, framing and reporting a floor we have already left.
 */
function resolveAndFrame(done) {
  const gen = switchGen;
  const stale = () => gen !== switchGen;
  let attempts = 0, widened = false;
  poll(() => {
      if (stale()) return true;
      attempts++;
      resolveChanges(); addFloorplan(); redraw();
      if (RESOLVED.length >= CHANGES.length) return true;
      if (!widened && attempts > 8) { widened = true; fitBuilding(); }
      return false;
    },
    () => {
      if (stale()) return;
      maybeFrame(true);
      // scrollToBuilding()'s animation lands *after* our fitBounds and snaps back to the building
      // view, so re-fit once it has settled.
      setTimeout(() => { if (stale()) return; framed = false; maybeFrame(true); }, 1500);
      done(false);
    },
    "change features",
    () => { if (stale()) return; maybeFrame(true); done(true); });
}

/* ── level / building switch ─────────────────────────────────────────────── */

let switching = false;      // one switch in flight at a time
let pendingTarget = null;   // newest request received while one was in flight (coalesced, not queued)
let switchGen = 0;          // bumped per switch; an older resolve pass stands down (see resolveAndFrame)
let started = false;        // start() has run; before that boot owns the camera, tiles and level

/**
 * Can this target exist at all? `map` is assigned during boot polling, long before boot has
 * finished, so a switch must not be judged only by whether the map object is there.
 *
 * Answered from the SDK's building list without moving anything: Concourse C has no B2, and asking
 * for one would otherwise spin the poll's full 30s budget before reporting a failure we could have
 * known instantly.
 */
function targetExists(t) {
  const bs = siteBuildings();
  if (!bs.length) return true;                       // list not in yet — let the poll decide
  const b = bs.find(x => x.id === (t.building || TARGET.building));
  if (!b) return false;
  return typeof t.level !== "number" || b.levels.some(l => l.index === t.level);
}

/**
 * Ask the map for a building/level. Returns true if a switch actually started.
 *
 * Idempotent by design: the app re-sends its target whenever we post `ready`, so a request for
 * where we already are must be a no-op, or app and map feed each other in a loop — re-opening the
 * building and re-framing the camera under the user's hands.
 *
 * Requests arriving mid-switch are held, not dropped, and only the newest is kept: clicking down
 * four floors should land on the fourth, not replay all four. Dropping them was half of the
 * stuck-on-L2 bug — a switch sent inside the latch window vanished without a trace.
 */
function requestTarget(t) {
  if (!t) return false;
  // Held, not dropped. Gate on `started`, not on `map`: the map object is assigned during boot
  // polling, so gating on it lets a switch start mid-boot and race boot's own
  // openTarget → ensureTiles → applyLevel sequence. start() drains whatever is waiting.
  if (!started || switching) { pendingTarget = t; return false; }
  const sameBuilding = !t.building || t.building === TARGET.building;
  const sameLevel = typeof t.level !== "number" || t.level === TARGET.level;
  if (sameBuilding && sameLevel) return false;
  if (!targetExists(t)) {
    post("error", { message: "no level " + t.level + " on the requested building" });
    post("switched", { level: levelInfo(), ok: false });   // tells the app to snap its selector back
    return false;
  }

  switching = true;
  switchGen++;
  try {
    if (t.building) TARGET.building = t.building;
    if (typeof t.level === "number") TARGET.level = t.level;
    RESOLVED = [];
    resolvePasses = 0;
    framed = false;
    SELECTED = null; HOVERED = null; renderTip();
    openTarget();
    applyLevel();

    // Nudge on boot's ~3s cadence, NOT on every 250ms tick as this used to: updateLayersForCurrentLevel()
    // setFilter()s ~600 layers, and at 4Hz that invalidates tiles faster than they can be parsed. The
    // old switch path was therefore stopping the new floor from ever painting — i.e. stopping its own
    // painted-feature gate from ever coming true.
    let nudges = 0;
    poll(() => {
        if (levelApplied()) return true;
        if (++nudges % 12 === 0) applyLevel();
        return false;
      },
      () => endSwitch(true),
      "level " + TARGET.level + " to apply",
      () => endSwitch(false));
  } catch(e) {
    // The latch must never outlive its switch — that is the whole failure mode being fixed here.
    post("error", { message: "switch: " + e.message });
    if (switching) endSwitch(false);
    return false;
  }
  return true;
}

// Both branches release the latch and report, so the app always learns what the map settled on. On
// failure that is the floor it never left, which snaps the level selector back to the truth instead
// of leaving it pointing at a floor the map never reached.
function endSwitch(ok) {
  switching = false;
  const queued = pendingTarget;
  pendingTarget = null;
  // Superseded — don't spend a resolve pass on a floor we're already leaving.
  if (queued && requestTarget(queued)) return;
  // A failed switch must not leave TARGET pointing at a floor we never reached. Three things read
  // TARGET independently — the outline filter, ensureLevel()'s retry, and everything downstream of
  // levelInfo() — so a stale TARGET means they disagree, and the app gets told a level the map
  // isn't rendering. Roll back to what the SDK actually holds: intent lives in the app, the map
  // reports and holds reality, and the app can ask again if it still wants that floor.
  if (!ok) rollbackTarget();
  // Both branches re-point the outline: it follows TARGET, so leaving it behind would draw the
  // old floor's walls under the new one either way.
  addFloorplan(); applyPrefs(); redraw();
  if (ok) resolveAndFrame(() => post("features", { features: levelFeatureNames(), types: levelTypeCounts(), forLevel: { building: TARGET.building, level: TARGET.level } }));
  else post("switched", { level: levelInfo(), ok: false });
}

function rollbackTarget() {
  try {
    const uc = pw.getUiController(), b = uc.getCurrentBuilding();
    const idx = uc.getMapViewController().levelIndex;
    if (b && b.buildingInternalIdentifier) TARGET.building = b.buildingInternalIdentifier;
    if (typeof idx === "number") TARGET.level = idx;
  } catch(e){}
}

/* ── boot ───────────────────────────────────────────────────────────────── */

function start() {
  window.__map = map;                 // exposed for debugging
  // Announce as soon as the map is usable. Waiting until every change has resolved meant a screen
  // with no changes (Map Content, Editing Level) never got its prefs — so it stayed greyscale.
  post("ready", { level: levelInfo(), buildings: siteBuildings(), features: levelFeatureNames(), types: levelTypeCounts(), forLevel: { building: TARGET.building, level: TARGET.level } });
  window.__state = () => ({ changes: CHANGES, resolved: RESOLVED.map(r => r.change.name) });
  flattenOnce();
  addFloorplan();
  applyPrefs();
  resolveChanges();
  redraw();
  map.on("render", redraw);
  /**
   * **Hover anything editable** (Olcay, 2026-08-14). The diff shapes carry their own listeners;
   * this is for every other feature on the floor, hit-tested against the SDK's own vector layers.
   *
   * Only editable content responds — `EDITABLE_TYPES` is the tree's POI/Structural split, posted
   * by the app. Walls, roads and circulation space are the floor plan, not content somebody
   * curates, and lighting up 715 of them would make the hover meaningless.
   *
   * A change under the cursor wins and this stands aside: that card says strictly more (its type,
   * its detail, and where allowed its decision control).
   */
  map.on("mousemove", ev => {
    // Everyone else sees where you point, wherever you point — this is not gated on hovering
    // something, because a cursor resting on blank floor is still information.
    post("cursor", { lng: ev.lngLat.lng, lat: ev.lngLat.lat });
    /**
     * ⚠️ **While a shape is being edited, nothing else may claim the pointer** (Olcay, 2026-08-15:
     * *"edit-geometry nodes should prevent any overlay to trigger"*). The hover card was drawing
     * itself straight over the vertex handles — covering the very points you were reaching for, and
     * inviting a "Click to edit" on a feature you are already editing.
     */
    if (GEOM) {
      const dropCard = () => {
        if (HOVER_FEATURE) { HOVER_FEATURE = null; hoverMark(null); renderTip(); }
      };
      // Laying a cut: the far end follows the pointer. In lng/lat, like the rings — the map can be
      // panned mid-cut and the anchor has to stay on the floor, not on the screen.
      if (GEOM.mode === "split") {
        dropCard();
        map.getCanvas().style.cursor = "crosshair";
        if (GEOM.cutA) {
          /**
           * The cut gets the same guides as everything else — a wall is laid at a right angle far
           * more often than at 37°, and until now the only way to cut squarely was to aim by eye.
           * The anchor is the cut's first click, so the angle guide measures the cut itself.
           */
          const a = map.project(GEOM.cutA);
          const g = GEOM.snap
            ? resolveGuides([a.x, a.y], ev.point.x, ev.point.y,
                            GEOM.cutRefs || [], geomSnapping(ev.originalEvent),
                            GEOM.cutBases || [])
            : { x: ev.point.x, y: ev.point.y, guides: [] };
          const q = map.unproject([g.x, g.y]);
          GEOM.cutB = [q.lng, q.lat];
          GEOM.guides = g.guides;
          GEOM.guideAt = [g.x, g.y];
          geomDraw();
        }
        return;
      }
      /**
       * **The feature being edited owns the pointer — but only its own.**
       *
       * Olcay, 2026-08-15: *"edit-geometry nodes should prevent any overlay to trigger"* — the card
       * was drawing itself straight over the vertex handles you were reaching for. That is about
       * the shape you are editing. Over a DIFFERENT feature the card is the only thing that says
       * you may click it, and now that clicking one actually switches to it, suppressing it there
       * would hide the feature behind an invisible affordance.
       */
      /**
       * ⚠️ **A network in edit mode raises no card at all** (Olcay, 2026-08-16: *"in edit mode I
       * still see tooltip when on hover. We're already editing it."*).
       *
       * The rule above is per FEATURE — do not offer "click to edit" for the thing already open —
       * and a network breaks it, because every node of it is a different feature with a different
       * fid. Hovering the node beside the one you are on would offer to open what is already open,
       * over the handles you are reaching for. The subject here is the network, so the whole
       * network is "already open".
       */
      if (GEOM.kind === "network") {
        dropCard();
        // The edge under the pointer is what a hover means in here now — see the unlink mark.
        wfHoverEdge(ev.point);
        map.getCanvas().style.cursor = "";
        return;
      }
      // Hover only — a wall must not raise a card, but must still open on a click.
      const over = hoverableAt(ev.point);
      const overFid = over && over.properties && over.properties.fid;
      if (!overFid || overFid === GEOM.fid) {
        dropCard();
        map.getCanvas().style.cursor = "";
        return;
      }
      // …otherwise fall through and let the ordinary hover card do its job.
    }
    if (shown()) return;                              // a change's card owns the cursor
    const f = hoverableAt(ev.point);
    const fid = f && f.properties && f.properties.fid;
    if (!f) {
      /**
       * **A line is a way of pointing at a path too** (Olcay, 2026-08-16: *"line or path should
       * highlight the whole path"*). Nodes win where they overlap — they are the smaller, more
       * deliberate target, and they are what you can actually edit — so this only asks once
       * `hoverableAt` has found nothing.
       *
       * No card: an edge has no `fid`, so *"Click to edit"* would be a promise nothing here keeps.
       * The highlight is the whole of what a line has to say.
       */
      const line = wfEdgeAt(ev.point);
      if (HOVER_FEATURE) { HOVER_FEATURE = null; renderTip(); }
      wfHighlight(line);
      if (!line) highlightFeatures(null);
      // Not a pointer cursor: nothing here answers a click on a line, and a cursor that says
      // otherwise is a promise the map does not keep. The highlight is the feedback.
      map.getCanvas().style.cursor = "";
      return;
    }
    map.getCanvas().style.cursor = "pointer";
    if (HOVER_FEATURE && HOVER_FEATURE.fid === fid) {  // same feature, just moved — reposition only
      HOVER_FEATURE.x = ev.point.x; HOVER_FEATURE.y = ev.point.y + 18;
      renderTip();
      return;
    }
    HOVER_FEATURE = {
      fid,
      name: f.properties.name || "",
      typeLabel: prettyType(f.properties),
      x: ev.point.x,
      y: ev.point.y + 18,
      below: true,
    };
    hoverMark(fid, f.properties);
    renderTip();
  });

  // Leaving the canvas has to clear it — the container listener below only covers the card.
  map.on("mouseout", () => {
    if (!HOVER_FEATURE) return;
    HOVER_FEATURE = null; hoverMark(null); renderTip();
    map.getCanvas().style.cursor = "";
  });

  map.on("move", postCam);
  map.on("move", redraw);
  map.on("move", drawPeers);   // the cursor is at a coordinate, so panning must re-project it
  map.on("move", drawEditing); // and so is the chip pinned to a feature
  map.on("move", geomDraw);    // the outline is in lng/lat, so panning re-projects it
  map.on("idle", () => {
    reportStyleShape();     // once, then never again — see the note on it
    ensureLevel();
    ensureIndoorVisible();
    hideBuildingChrome(); // the SDK re-shows its layers after switches and 3D recoveries
    applyHiddenTypes();   // …and it re-shows the wayfinding network and geofences with them
    relaxPtrMinzoom();
    // One step of the render swap per idle — and, once it is live, the re-assertion that keeps the
    // tiles off and the clones' filters in step with the SDK's. See the GJ block.
    gjTick();
    if (resolveChanges()) { addFloorplan(); applyPrefs(); redraw(); }
  });
  // The SDK treats a map click as wayfinding navigation — clicking anywhere on the building
  // footprint re-focuses and zooms to it, which is hostile in a review pane. Swallow the click in
  // the capture phase before MapLibre's own listener sees it (mousedown/move still pan and zoom).
  // Overriding uiController.MapView_onMapClicked does NOT work — the SDK registered the original
  // function by reference. Dismissal is NOT done here: over the shapes a `click` is never produced
  // at all (see the shapes' mouseup listener), so it happens on mouseup below.
  document.getElementById("map").addEventListener("click", ev => { ev.stopPropagation(); }, true);

  /**
   * Press and release, the only two mouse events this map can rely on.
   *
   * The press is recorded wherever it lands — its target is not trustworthy — and the release
   * decides. A shape's own `mouseup` selects it (see `redraw`); this one handles the other half:
   * releasing on bare map dismisses a pinned card, which is the "click out" exit.
   */
  document.addEventListener("mousedown", ev => { DOWN_AT = [ev.clientX, ev.clientY]; }, true);
  /**
   * **Grabbing a node of the network being edited.**
   *
   * On the map's own canvas rather than on an SVG handle, because there are no SVG handles here:
   * a room has eight corners and a concourse network has hundreds, so the nodes are drawn by the
   * map's layers and hit-tested through the **buffer** layer — which is what the buffer was for.
   *
   * ⚠️ In the capture phase and stopping propagation, so MapLibre's own drag-pan never sees it.
   * Without that, dragging a node pans the floor underneath it and the node appears not to move.
   */
  map.getCanvas().addEventListener("mousedown", ev => {
    if (!GEOM || GEOM.kind !== "network" || ev.button !== 0) return;
    let hit = null;
    try {
      hit = (map.queryRenderedFeatures([ev.clientX, ev.clientY],
        { layers: map.getLayer(WF_NODE_HIT) ? [WF_NODE_HIT] : [] }) || [])[0];
    } catch (e) {}
    const fid = hit && hit.properties && hit.properties.fid;
    if (!fid) {
      /**
       * **An edge is grabbable too** (Olcay, 2026-08-17: *"I should be able to click an edge and it
       * should be highlighted as selected — I should then be able to move it which moves all the
       * connected nodes to it too."*).
       *
       * It needs no machinery of its own, because **an edge IS its two ends** — the same sentence
       * that did the whole job for a room's edges. Clicking one selects both nodes, which is what
       * makes it look selected; dragging it is the multi-node drag that already existed, so the
       * corridor keeps its length and angle and both ends come along.
       *
       * Only where no node was hit: a node is the smaller, more deliberate target and wins the
       * click where the two overlap.
       */
      const line = wfEdgeAt([ev.clientX, ev.clientY]);
      if (!line) return;
      ev.stopPropagation();
      const both = GEOM.sel.has(line[0]) && GEOM.sel.has(line[1]);
      if (ev.shiftKey) {                       // toggles the whole edge, and never starts a drag
        if (both) { GEOM.sel.delete(line[0]); GEOM.sel.delete(line[1]); }
        else { GEOM.sel.add(line[0]); GEOM.sel.add(line[1]); }
        wfSetSelected();
        post("geomstate", geomState());
        return;
      }
      if (!both) { GEOM.sel.clear(); GEOM.sel.add(line[0]); GEOM.sel.add(line[1]); wfSetSelected(); }
      // The end you grabbed nearer leads, so Snap and the guides answer for the end you aimed at.
      const lead = wfNearerEnd(line, [ev.clientX, ev.clientY]);
      /**
       * ⚠️ **The panel's subject is NOT moved here**, and that is deliberate — trap 9. The app holds
       * "which feature is open" in two pieces of state and reads a disagreement between them as
       * *nothing is open*, which sends the map `end` and destroys the edit. Repointing `GEOM.fid`
       * mid-**gesture**, from a `mousedown`, is precisely how that disagreement is manufactured. A
       * drag's lead is a fact about this gesture; which node the panel describes is a fact about the
       * click, and the click already moves it on `mouseup`.
       */
      geomDown(ev, { kind: "netnode", fid: lead });
      return;
    }
    ev.stopPropagation();
    /**
     * Shift toggles, and never starts a drag — the same rule a room's corners follow, so the one
     * modifier means one thing across the whole editor.
     */
    if (ev.shiftKey) {
      if (GEOM.sel.has(fid)) GEOM.sel.delete(fid); else GEOM.sel.add(fid);
      wfSetSelected();
      post("geomstate", geomState());
      return;
    }
    // Dragging an unselected node is a fresh single selection; dragging one already in the
    // selection takes the whole set with it.
    if (!GEOM.sel.has(fid)) { GEOM.sel.clear(); GEOM.sel.add(fid); wfSetSelected(); }
    // The node you grab becomes the one the panel is about — you are editing the network, and this
    // is where in it you are.
    if (fid !== GEOM.fid) {
      GEOM.fid = fid;
      wfSetEditing(GEOM.net, fid);
      post("geomstate", geomState());
    }
    geomDown(ev, { kind: "netnode", fid });
  }, true);
  document.addEventListener("mouseup", ev => {
    const tap = isTap(ev);
    DOWN_AT = null;                      // consumed either way
    /**
     * Dismiss only on a release **on the map itself**, stated positively.
     *
     * The first version excluded shapes and the card and dismissed on everything else — which
     * silently included the zoom buttons, so zooming with a card pinned would close it. `#hl`
     * (the shapes) and `#tip` and `#zoomctl` are all siblings of `#map`, so asking "is the
     * release inside #map?" excludes every one of them by construction, and keeps excluding any
     * chrome added later.
     */
    if (!tap || !document.getElementById("map").contains(ev.target)) return;
    /**
     * **Laying a cut takes the release first**, before anything else can read it as a selection or
     * a dismissal. Same `mouseup` + `isTap` as the rest of this file: a press that travelled was a
     * pan, so you can still drag the map into position between the two clicks of a cut.
     */
    if (GEOM && GEOM.mode === "split" && map) {
      const rect = map.getCanvas().getBoundingClientRect();
      geomCutClick(map.unproject([ev.clientX - rect.left, ev.clientY - rect.top]));
      return;
    }
    // A plain click on bare floor drops the corner selection — the counterpart to shift-marquee,
    // and the only way out of one besides Escape.
    if (GEOM && GEOM.sel && GEOM.sel.size && !ev.shiftKey) {
      GEOM.sel.clear();
      geomDraw(); post("geomstate", geomState());
      return;
    }
    if (SELECTED) select(SELECTED);      // click out — dismiss
    else if (HOVERED) hover(null);
    /**
     * **Opening a feature hangs off the release too**, and for the reason this file already
     * learned the hard way: `map.on("click")` never fires here. Verified 2026-08-14 — the canvas
     * receives a DOM `click`, but MapLibre's own click never reaches a handler, so "Click to edit"
     * did nothing. `mouseup` + `isTap` is the pattern every other selection here uses; this one
     * was written against what ought to work instead of what does.
     */
    /**
     * ⚠️ **This used to be gated on `!GEOM`, which made it impossible to switch features.**
     *
     * Selecting a feature IS edit mode here, so `GEOM` is set from the moment a panel opens — and
     * the guard therefore meant "once you have opened anything, clicking another feature does
     * nothing at all". Olcay, 2026-08-15: *"clicking other feature should switch to that feature
     * edit"*. Quite right; it never could.
     *
     * The gate it was reaching for is narrower, and is already handled elsewhere: a click on a
     * vertex handle never arrives here, because the handles live in the `#geom` overlay rather than
     * inside `#map`, and the guard above requires a release inside `#map`. A drag is excluded by
     * `isTap`. What is left is a genuine click on bare floor — and the only one worth ignoring is
     * one that lands on the feature already open.
     */
    else if (map && !shown()) {
      const rect = map.getCanvas().getBoundingClientRect();
      const pt = [ev.clientX - rect.left, ev.clientY - rect.top];
      const f = editableAt(pt);
      /**
       * ⚠️ **A line opens the editor too** (Olcay, 2026-08-17: *"edit only activates when I click on
       * node — it should also be triggered if I click on edge (line)"*).
       *
       * An edge has no `fid` of its own, so `editableAt` can never return one — but it does not need
       * to. **The thing being edited is the network**, and an edge names two of its nodes; opening
       * either of them opens the same network. The **nearer end** is the one taken, for the same
       * reason it leads a drag: it is the end you were pointing at.
       *
       * Only where there was no feature under the pointer, so a node always wins over the line it
       * sits on — the node is the smaller, more deliberate target.
       */
      let fid = f && f.properties && f.properties.fid;
      if (!fid) {
        const line = wfEdgeAt(pt);
        if (line) fid = wfNearerEnd(line, pt);
      }
      /**
       * ⚠️ **Shift means "add this to what I already have"**, and the check on the feature already
       * open has to be skipped for it (Olcay, 2026-08-16: *"shift click on the selected item would
       * deselect it"*). Shift-clicking the open feature is the gesture for taking it back OUT of a
       * selection — the one click the plain path is right to ignore is the one the additive path
       * exists for.
       *
       * The app decides what to do with it, because the app owns the selection. This side only
       * reports the click and which modifier was down.
       */
      /**
       * A click on a line while its own network is already open should not re-post — the editor is
       * where it needs to be. `GEOM.net` answers that for every node of it, where `GEOM.fid` only
       * ever answered for one.
       */
      const already = GEOM && (GEOM.fid === fid ||
        (GEOM.kind === "network" && GEOM.net >= 0 && wfNetOf(fid) === GEOM.net && !f));
      if (fid && (ev.shiftKey || !already))
        post("featureclick", { fid, props: plainProps(f ? f.properties : wfPropsOf(fid)),
                               additive: !!ev.shiftKey });
    }
  });

  // Zoom control (Figma 2103:22178). MapLibre's own eased zoom; no-ops until the map exists.
  document.getElementById("zoomin").addEventListener("click", () => { if (map) map.zoomIn(); });
  document.getElementById("zoomout").addEventListener("click", () => { if (map) map.zoomOut(); });

  /**
   * Every way a hover can end, each reporting to `endHoverUnless`.
   *
   * A path's own `mouseleave` can't be trusted on its own — `redraw()` rebuilds every path per
   * render frame (MapLibre renders continually for symbol fades), so the hovered element is often
   * destroyed before its leave event fires. Hence the surfaces below, which are stable.
   *
   * `#tip` and `#hl` are siblings of `#map`, so each needs its own listener: a `mousemove` on
   * `#map` fires only over *bare* map and never sees the card or the shapes.
   */
  const mapEl = document.getElementById("map");
  mapEl.addEventListener("mousemove", ev => endHoverUnless(ev.target));
  // leaving the map for the panel, the chrome, or another window — the case that used to strand
  // the card on screen indefinitely, because no further mousemove was ever coming
  mapEl.addEventListener("mouseleave", ev => endHoverUnless(ev.relatedTarget));
  // leaving the card itself; `relatedTarget` keeps a trip back to its own shape from flickering
  tip.addEventListener("mouseleave", ev => endHoverUnless(ev.relatedTarget));
  document.getElementById("hl").addEventListener("mouseleave", ev => endHoverUnless(ev.relatedTarget));
  // out of the document entirely (relatedTarget is null on the way out of the window)
  document.addEventListener("mouseout", ev => { if (!ev.relatedTarget) endHoverUnless(null); });
  window.addEventListener("blur", () => endHoverUnless(null));

  map.on("movestart", () => { if (HOVERED) hover(null); });

  // Escape deselects, like every other overlay in the app. Pinned only — a hover card needs no
  // dismissing, it dies when you look away.
  document.addEventListener("keydown", ev => {
    /**
     * **Undo and Redo on the keyboard** (Olcay, 2026-08-23). The item is called *faster editing*,
     * there is a whole specification for undo/redo, and both buttons sit in the bar — and until
     * today the only way to reach either was the mouse.
     *
     * ⚠️ **This binding has to exist TWICE, and that is not duplication.** The map is an IFRAME, so
     * a keystroke only arrives here while focus is inside it. With focus in the properties panel —
     * which is where it is the moment anyone edits a name — the parent gets the event instead, and
     * `MapContent` carries the other half. Bind one and the shortcut works from about half the
     * places a user actually is.
     *
     * `Cmd` on a Mac, `Ctrl` everywhere else. `Cmd+Shift+Z` and `Ctrl+Y` are both Redo because both
     * are people's muscle memory, and neither costs anything to accept.
     */
    const accel = ev.metaKey || ev.ctrlKey;
    const k = ev.key.toLowerCase();
    if (accel && GEOM && (k === "z" || k === "y")) {
      const redo = k === "y" || ev.shiftKey;
      ev.preventDefault();
      if (redo) geomRedo(); else geomUndo();
      return;
    }
    /**
     * **Delete removes the selected corners** (Olcay, 2026-08-15). Safe to bind bare, because this
     * document is the map and has no text input in it — the properties panel lives in the parent,
     * so typing a name there never reaches this listener.
     */
    if ((ev.key === "Delete" || ev.key === "Backspace") && GEOM && GEOM.sel.size &&
        (GEOM.kind === "area" || GEOM.kind === "network")) {
      ev.preventDefault();
      if (GEOM.kind === "network") geomDeleteNodes(); else geomDeleteSelected();
      return;
    }
    /**
     * **Delete on a hovered edge unlinks it** (Olcay, 2026-08-16). Below the selection on purpose:
     * an explicit selection outranks whatever the pointer happens to be resting on, so Delete never
     * does something other than what you just picked out.
     */
    if ((ev.key === "Delete" || ev.key === "Backspace") &&
        GEOM && GEOM.kind === "network" && !GEOM.sel.size && GEOM.cut) {
      ev.preventDefault();
      geomUnlinkEdge();
      return;
    }
    /**
     * **Enter combines the selection**, as a shortcut for the toolbar button rather than as the
     * only way in — that was true while Combine was an armed mode and is not any more.
     *
     * Safe to bind bare for the same reason Delete is: this document is the map and contains no
     * text input. The properties panel lives in the parent, so Enter in a name field never reaches
     * here.
     */
    if (ev.key === "Enter" && GEOM && GEOM.pick.length) {
      ev.preventDefault();
      geomApplyCombine();                          // refuses in its own words if it cannot
      return;
    }
    if (ev.key !== "Escape") return;
    // Escape peels one layer at a time, innermost first — and never the edit itself: dropping the
    // panel because somebody thought better of one click would take every unsaved change with it.
    if (GEOM && GEOM.mode === "split") {
      if (!geomCancelCut()) geomSetMode("vertices");
      return;
    }
    /**
     * **Escape drops the extra features first** (Olcay, 2026-08-16: *"escape would deselect it"*),
     * leaving the one you started from — and a second Escape then closes the panel, which is what
     * Escape has always done.
     *
     * Peeling rather than clearing outright, like every other Escape in this file. Closing the
     * whole panel because somebody wanted to undo one shift-click would take the other feature's
     * unsaved edits with it.
     */
    if (GEOM && GEOM.pick.length) {
      post("selectclear", { fid: GEOM.fid });
      return;
    }
    if (GEOM && GEOM.sel && GEOM.sel.size) {
      GEOM.sel.clear();
      geomDraw(); post("geomstate", geomState());
      return;
    }
    if (SELECTED) { select(SELECTED); return; }
    /**
     * **Nothing left to peel, so Escape leaves the edit** (Olcay, 2026-08-17: *"escape should exit
     * editing (confirmation overlay if any change)"*).
     *
     * ⚠️ The comment above this used to claim a second Escape closed the panel *"which is what
     * Escape has always done"*. It did not — there was no step that ever closed it, and the claim
     * had been sitting here unchallenged because the peels above it are what anyone testing would
     * hit first.
     *
     * Reported, not acted on: **only the app knows whether leaving needs asking first.** The
     * unsaved-work overlay lives there, along with the draft it is protecting, and a map that
     * closed the panel itself would walk straight around it.
     */
    post("escape", {});
  });

  /**
   * **Shift + drag across the map marquees the corners inside it** (Olcay, 2026-08-15: *"select
   * multiple points with lasso select or shift marquee select"*).
   *
   * A rectangle rather than a freehand lasso: it is one drag either way, but a rectangle can be
   * aimed — you can see what it will catch before you let go — and a lasso's own path has to be
   * hit-tested, which is a lot of machinery for corners that sit on a building grid anyway.
   *
   * ⚠️ Shift+drag was **MapLibre's box zoom**; `geomBegin` disables it for as long as the editor is
   * open. Without that, every marquee would also zoom the map out from under itself.
   *
   * Bubble phase, not capture: a handle's own `mousedown` calls `stopPropagation`, so a
   * shift-click ON a corner reaches its toggle and never starts a marquee.
   */
  document.addEventListener("mousedown", ev => {
    // Reshape only for a shape — corners are the subject of that mode and of no other. A network
    // has one mode and its nodes are always the subject, so it marquees whenever it is open.
    const net = GEOM && GEOM.kind === "network";
    if (!GEOM || (!net && (GEOM.kind !== "area" || GEOM.mode !== "vertices"))) return;
    if (!ev.shiftKey || ev.button !== 0) return;
    if (!document.getElementById("map").contains(ev.target)) return;
    ev.preventDefault();
    const rect = map.getCanvas().getBoundingClientRect();
    const at = e => {
      const q = map.unproject([e.clientX - rect.left, e.clientY - rect.top]);
      return [q.lng, q.lat];
    };
    GEOM.band = { a: at(ev), b: at(ev) };
    try { map.dragPan.disable(); } catch (e) {}
    const move = e => { if (GEOM && GEOM.band) { GEOM.band.b = at(e); geomDraw(); } };
    const up = () => {
      document.removeEventListener("mousemove", move);
      document.removeEventListener("mouseup", up);
      try { map.dragPan.enable(); } catch (e) {}
      if (!GEOM || !GEOM.band) return;
      // Additive: shift is already down, and shift-to-add is what it means everywhere else.
      if (GEOM.kind === "network") { wfSelectIn(GEOM.band.a, GEOM.band.b, true); wfSetSelected(); }
      else geomSelectIn(GEOM.band.a, GEOM.band.b, true);
      GEOM.band = null;
      geomDraw(); post("geomstate", geomState());
    };
    document.addEventListener("mousemove", move);
    document.addEventListener("mouseup", up);
  });

  resolveAndFrame(partial => post("ready", { changes: RESOLVED.length, level: levelInfo(), features: levelFeatureNames(),
    types: levelTypeCounts(), forLevel: { building: TARGET.building, level: TARGET.level },
    buildings: siteBuildings(), partial }));

  // Boot is done: switches may run from here. Anything that arrived while boot owned the map was
  // held rather than dropped on the floor, so drain it now.
  started = true;
  const queued = pendingTarget;
  pendingTarget = null;
  requestTarget(queued);
}

document.addEventListener("DOMContentLoaded", () => {
  const missing = missingConfig();
  if (missing.length) {
    document.getElementById("map").innerHTML =
      '<div style="position:absolute;inset:0;display:grid;place-items:center;padding:24px;' +
      'font:13px/1.6 \'Readex Pro\',system-ui,sans-serif;color:#5d626f;text-align:center">' +
      '<div><b style="color:#1F2328">Map configuration missing</b><br>No ' + missing.join(", ") +
      '.<br>The app passes these on the query string from its environment ' +
      '(VITE_POINTR_*). Opening this page directly needs them too.</div></div>';
    post("error", { message: "missing map config: " + missing.join(", ") });
    return;
  }
  try {
    const options = new PointrWebSDK.Options({
      container: "map",
      baseUrl: CONN.baseUrl,
      clientIdentifier: CONN.client,
      licenseKey: CONN.licence,
      mapMaxZoom: 21,
      pitch: 0,                         // a floor plan is read top-down; a pitched camera also
      bearing: 0,                       // flips the SDK into 3D-model mode (see lockFlat)
      siteInternalIdentifier: TARGET.site,
      buildingInternalIdentifier: TARGET.building,
      levelIndex: TARGET.level,
      /**
       * The persona this map is rendered for. The SDK matches it against each enabled persona's
       * `personaIdentifier` OR its `key`, so the plain key (`facilityManager`) is enough; it then
       * takes that persona's `styleUrl` as the map's style, and hides any POI whose `mapPersonas`
       * excludes the key. Left out entirely, the client's default persona applies.
       */
      ...(CONN.persona ? { personaIdentifier: CONN.persona } : {}),
      // this pane is a review viewport, not a wayfinding widget
      isSearchEnabled: false,
      isPoiDetailsEnabled: false,
      isZoomControlEnabled: false,
      isLanguageSelectorEnabled: false,
      isNavigationEnabled: false,
      isQuickAccessEnabled: false,
      isAppBannerEnabled: false,
    });
    pw = new PointrWebSDK.MapWidget(options);
    window.pw = pw;                   // exposed for debugging

    pw.start();

    // 1. map + site list ready → 2. open Dubai/Concourse B → 3. tile URL → 4. indoor features.
    // Gated on the SDK's `dataLoaded` event with a poll as backstop (`pw.isDataLoaded` stays false
    // even on a fully loaded widget, so it can't be trusted). boot() is idempotent.
    let booted = false;
    const sdkReady = () => {
      map = getMap();
      hookMapErrors();
      const mvc = (() => { try { return pw.uiController.mapViewController; } catch(e) { return null; } })();
      return !!(map && mvc && mvc.sites && mvc.sites.length);
    };
    const boot = () => {
      if (booted || !sdkReady()) return;
      booted = true;
      openTarget();
      applyLevel();
      ensureTiles(() => {
        try { pw.uiController.mapViewController.scrollToBuilding(TARGET.building); } catch(e){}
        applyLevel();                                  // now that the tiles are real, pin level 2
        // Nudge the level every ~3s, NOT every tick: updateLayersForCurrentLevel() setFilter()s
        // ~600 layers, and doing that at 4Hz invalidates tiles faster than they can be parsed —
        // the map then renders nothing at all.
        let nudges = 0;
        poll(() => {
          if (levelIsRendering()) return true;
          if (++nudges % 12 === 0) applyLevel();
          return false;
        }, start, "level " + TARGET.level + " features");
      });
    };
    try { pw.on("dataLoaded", boot); } catch(e){}
    poll(sdkReady, boot, "sdk data");
  } catch(e) { post("error", { message: e.message }); }
});

// live decisions + map view preferences from the app
/* ── geometry editing ─────────────────────────────────────────────────────────────────────────
 *
 * Direct manipulation of a feature's outline, in the map's own coordinate space.
 *
 * **Rings are held in lng/lat, never in pixels.** Every operation converts to screen space, does
 * its arithmetic there because that is where the cursor lives, and converts straight back. Holding
 * pixels would silently rewrite the shape on every zoom.
 *
 * **Edits are local**, like every other edit in this prototype — nothing is written to Pointr
 * Cloud. The app is told on commit so the panel and the tree can agree with the map.
 *
 * ⚠️ **`split` is deliberately absent.** Cutting a polygon properly means walking the ring,
 * inserting every intersection with the cut line and re-assembling two valid rings — and doing it
 * for concave shapes with multiple crossings. A version that only works on convex shapes would be
 * a trap, so it is recorded as unbuilt rather than shipped half-right.
 */
let GEOM = null;

const SNAP_PX = 10;
const HANDLE_R = 5;

/**
 * @param fallbackRings rings to open on when the tiles cannot answer — see the `!f` branch.
 */
function geomBegin(fid, fallbackRings) {
  /**
   * ⚠️ **Opening the feature that is already open does nothing at all.**
   *
   * Without this, a combine could never move the identity: the largest-by-area rule repoints the
   * panel at the surviving feature (see `geomApplyCombine`), the app's panel effect answers with a
   * fresh `begin` for that fid, and this function would rebuild the outline from the *published*
   * geometry — throwing the combine away in the same breath that reported it.
   *
   * It is the right rule regardless of Combine. `begin` is the app saying "the panel is on this
   * feature", which it may say more than once for the same feature; discarding an edit in progress
   * because the panel restated where it already was would be indefensible.
   */
  if (GEOM && GEOM.fid === fid && (GEOM.rings.length || GEOM.point || GEOM.nodes)) return;
  /**
   * ⚠️ **A wayfinding node opens its whole NETWORK, not itself** — Olcay, 2026-08-16: *"I should be
   * able to edit the whole network."*
   *
   * It is the same reasoning that made the network an entity in the first place. A path node on its
   * own is not a thing anybody wants to edit: it has no name worth changing and no shape, and its
   * only meaning is where it sits relative to the nodes around it. The thing being edited is the
   * network; the node you clicked is merely where in it you are.
   */
  const net = wfNetOf(fid);
  /**
   * ⚠️ **The fallback is not belt-and-braces, it is the removal case.**
   *
   * `geomFind` prefers `LEVEL_GEOM` — the **draft** — and a feature MapScale removed is by
   * definition not in the draft, so it falls through to the tiles. That should answer, because
   * `featuresWithFid` queries **source** data and a layer filter does not reach it. But a confirmed
   * removal is also *ghosted*, and `resolveChanges` warns in its own comment that a filtered feature
   * "stops being findable" — a warning that was earned. `beginchange` already holds the rings from
   * the resolve pass, so it hands them over rather than leaving this to an argument about
   * MapLibre's query semantics.
   */
  let f = net >= 0 ? { kind: "network", net, nodes: wfNetworkNodes(net) } : geomFind(fid);
  if (!f && fallbackRings && fallbackRings.length)
    f = { kind: "area", rings: fallbackRings.map(r => r.map(c => c.slice())),
          tiles: 1, src: "resolved" };
  if (!f) {
    /**
     * ⚠️ Clear the editor rather than just refusing. This used to `return` with `GEOM` untouched,
     * so opening a feature whose tiles had not loaded left the PREVIOUS feature's handles on the
     * map while the panel showed the new one — every drag then edited a shape nobody had selected.
     */
    GEOM = null;
    try { map.boxZoom.enable(); } catch (e) {}
    geomDraw();
    post("geomerror", { fid, message: "no geometry on this floor yet" });
    post("geomstate", { editing: false });
    return;
  }
  /**
   * ⚠️ **MapLibre owns shift+drag** — it is bound to `boxZoom`. The marquee needs it, so it is
   * taken away for as long as the editor is open and given straight back in `geomEnd`.
   */
  try { map.boxZoom.disable(); } catch (e) {}
  // The network stays lit for as long as you are in it, and its nodes grow into handles.
  if (f.kind === "network") wfSetEditing(f.net, fid); else wfSetEditing(null);
  GEOM = {
    fid,
    kind: f.kind,
    // `geomFind` already hands over rings this editor owns — see the note on it.
    rings: f.kind === "area" ? f.rings : [],
    point: f.kind === "point" ? f.point.slice() : null,
    /**
     * A network's nodes: `[{ fid, at }]`, every one of them a handle. Not rings — a network is a
     * **graph**, so there is no order to walk and nothing to close. The lines between them are
     * drawn by the map's own layers from the same data, which is why they follow a drag for free.
     */
    nodes: f.kind === "network" ? f.nodes : null,
    net: f.kind === "network" ? f.net : -1,
    /** The edge under the pointer, as `[from, to]` — what Delete would unlink. Hover-lived. */
    cut: null,
    history: [],
    future: [],
    snap: true,
    mode: "vertices",
    drag: null,
    /**
     * The selected vertices, as `"ri:ci"` keys (Olcay, 2026-08-15: *"select multiple points with
     * lasso select or shift marquee select and move them at the same time and delete should delete
     * them"*). A Set, so shift-toggling is O(1) and order never matters.
     *
     * Deliberately NOT part of the undo snapshot: it is what you have highlighted, not what the
     * shape is. Undo clears it instead, because indices shift under a restore and a selection
     * pointing at the wrong corners is worse than no selection.
     */
    sel: new Set(),
    /** The marquee being dragged, in lng/lat: `{ a, b }`. */
    band: null,
    /** The live rotate/scale readout while a transform handle is down: `{ text, x, y }`. */
    xform: null,
    /** What snapping has caught this frame, for the indicator: `{ x, y, kind }` in screen space. */
    snapHit: null,
    /** The guides in force this frame — see the guide engine. Drawn, never persisted. */
    guides: null,
    /** Where the guides put the point, in screen space — what the tracking line runs to. */
    guideAt: null,
    /**
     * Which piece each ring belongs to, parallel to `rings`. Everything starts as piece 0 — one
     * feature, one piece, however many rings it arrived with — and `geomApplyCut` mints new ids.
     * The count of distinct ids is how many pieces the feature is in.
     */
    pieceOf: [],
    nextPiece: 1,
    /** The cut being laid, both ends in lng/lat. `cutB` tracks the pointer until the second click. */
    cutA: null,
    cutB: null,
    /**
     * The features picked to be combined **into** this one: `[{ fid, rings, name }]`.
     *
     * The subject is never in here — it is always part of the combine by virtue of being open, so
     * listing it would let it be toggled off, and there is no combine without it.
     */
    pick: [],
    /**
     * Every fid this session's combines have absorbed. Reported on commit, because the app's tree
     * still shows those rows and somebody has to be told they are now part of something else.
     */
    absorbed: [],
    /**
     * Walls hidden because a combine put them between two rooms that are now one — `fids` is what
     * is hidden, `layers` is which of the SDK's layers were drawing them. Both are needed: once a
     * wall is filtered out it stops being a rendered feature, so the layer can never be found again.
     */
    hidden: { fids: [], labels: [], layers: [] },
    /**
     * Properties by fid, for every feature this edit has touched — the subject and everything a
     * combine has picked. `geomTakeIdentity` needs them to move the panel, and the moment it needs
     * them is the moment the feature may no longer be worth querying for.
     */
    propsOf: {},
    /**
     * Set when a combine has just moved the identity, and consumed by the `focusfeature` the app
     * answers with. It stops the camera flying to a shape that no longer exists.
     */
    skipFocus: false,
    /**
     * The transform box's angle, carried between frames so it can be unwrapped rather than
     * recomputed from scratch — see `unwrapGrid`. `null` until the box is first drawn.
     */
    boxTheta: null,
    /**
     * A live combine, as **what it was made of** rather than only what it produced:
     * `{ members: [{ fid, rings }] }`. Null once anything else has edited the shape — see
     * `geomPush`. It is what lets a row be taken back out of the combined result.
     */
    combine: null,
  };
  GEOM.pieceOf = GEOM.rings.map(() => 0);
  /**
   * ⚠️ **Say so when the outline is partly the tile grid.** The editor still opens — refusing would
   * make "edit all geometries" hollow for exactly the big structural features it was opened for,
   * and the *properties* are perfectly editable either way — but the person dragging a corner is
   * entitled to know that some of these corners are seams rather than walls.
   *
   * The real fix is to read the feature's true geometry from Pointr Cloud rather than from the
   * rendered tiles; see the standing item in the hand-off.
   */
  GEOM.clipped = f.kind === "area" && f.src === "tiles" && f.tiles > 1;
  console.info("[geometry] editing", fid, "· outline from",
               f.src === "geojson" ? "Pointr Cloud (whole)" : "the tiles (" + f.tiles + " piece(s))");
  if (GEOM.clipped) {
    console.warn("[geometry]", fid, "arrives in", f.tiles,
                 "tile-clipped pieces — its outline includes tile seams, not just walls");
    post("geomerror", { fid,
      message: "This feature is larger than one map tile, so its outline here is cut at the tile "
             + "seams. Those corners are not walls — editing the shape will write them in." });
  }
  // The subject's own properties, kept for the same reason a picked feature's are: undoing back
  // past a combine has to be able to put the panel back on this feature.
  const own = scanFeature(fid);
  if (own && own.props) GEOM.propsOf[fid] = own.props;
  GEOM.original = geomSnap();
  geomDraw();
  post("geomstate", geomState());
}

/**
 * A restore point. Rings ALONE are not enough once splitting exists: undoing a split has to put the
 * piece map back too, or the shape returns to one outline while the app still believes it is two.
 */
function geomSnap() {
  return {
    rings: JSON.parse(JSON.stringify(GEOM.rings)),
    point: GEOM.point ? GEOM.point.slice() : null,
    // A network's nodes are its geometry, so undo has to carry them like any other shape.
    nodes: GEOM.nodes ? JSON.parse(JSON.stringify(GEOM.nodes)) : null,
    pieceOf: GEOM.pieceOf.slice(),
    // The counter travels with the state, so undo rewinds it and redo replays it — otherwise a
    // split, an undo and another split would hand the same id to two different pieces.
    nextPiece: GEOM.nextPiece,
    /**
     * ⚠️ **The identity is part of the state, because a combine can move it** — the largest of the
     * combined rooms keeps its fid. Undoing back past that combine has to put the fid back too, or
     * the outline returns to one room while the panel goes on showing another.
     */
    fid: GEOM.fid,
    absorbed: GEOM.absorbed.slice(),
    hidden: { fids: GEOM.hidden.fids.slice(), labels: GEOM.hidden.labels.slice(),
              layers: GEOM.hidden.layers.slice() },
    // Carried so undo restores a composition that is still recomposable, rather than a shape that
    // merely looks the same and has forgotten what it was made of.
    combine: GEOM.combine
      ? { members: JSON.parse(JSON.stringify(GEOM.combine.members)) } : null,
  };
}

function geomRestore(s) {
  GEOM.rings = JSON.parse(JSON.stringify(s.rings));
  GEOM.point = s.point ? s.point.slice() : null;
  /**
   * ⚠️ **A network's undo puts the NODES back, not just their positions** — deleting one rewrites
   * its neighbours' links, so restoring coordinates alone would return the dots and leave the
   * corridors wrong. `wfReplaceNetwork` writes them into the level and everything else — the edges,
   * the components, the collections the map draws — is rebuilt from there.
   */
  if (s.nodes) {
    const now = (GEOM.nodes || []).map(n => n.fid);
    GEOM.nodes = JSON.parse(JSON.stringify(s.nodes));
    wfReplaceNetwork(now, GEOM.nodes);
    wfSetSelected();
  }
  GEOM.pieceOf = s.pieceOf.slice();
  GEOM.nextPiece = s.nextPiece;
  GEOM.absorbed = s.absorbed.slice();
  GEOM.combine = s.combine ? { members: JSON.parse(JSON.stringify(s.combine.members)) } : null;
  GEOM.hidden = { fids: s.hidden.fids.slice(), labels: s.hidden.labels.slice(),
                  layers: s.hidden.layers.slice() };
  // Every wall filter is rebuilt from `hidden` rather than patched, so undo and redo need no
  // bookkeeping of their own — see geomApplyHiddenFilter.
  geomApplyHiddenFilter();
  if (s.fid !== GEOM.fid) geomTakeIdentity(s.fid);
  // Indices move under a restore, so a kept selection would highlight the wrong corners.
  GEOM.sel.clear();
}

/* ── selection ─────────────────────────────────────────────────────────────── */

/* EDGE-ENGINE-START — extracted and tested by scratch/geometry.test.mjs. Pure: keys and indices.
   Olcay, 2026-08-16: *"I also like edge edit, meaning I can select edges to push out or move in —
   two nodes move accordingly. Multi edge select would be nice."* */

/** A corner's key: which ring, which corner. The whole of the selection's vocabulary. */
const selKey = (ri, ci) => ri + ":" + ci;

/**
 * The two corner keys an edge sits between — edge `ci` runs from corner `ci` to the next one.
 *
 * ⚠️ **The wrap is the whole subtlety.** A ring closes on a repeat of its first point, so the last
 * real corner's edge runs to `ring[len-1]`, which *is* `ring[0]`. Selection keys index the REAL
 * corners, and only those get a handle drawn — so the second key of the wrapping edge has to be
 * `0`. Naming the closing index instead gives a key that nothing draws and nothing drags: the edge
 * would look selected at one end and move at one end.
 */
function edgeKeys(ri, ci, ringLen) {
  const last = ringLen - 1;                       // the closing point's index
  return [selKey(ri, ci), selKey(ri, (ci + 1) % last)];
}

/**
 * **Where you took hold of a thing, relative to the thing** — and what it is therefore aiming at.
 *
 * ⚠️ The rule these two encode is the one every drag here used to get wrong: **a drag moves what you
 * grabbed by how far the pointer moved.** Putting it *at* the pointer instead is only invisible when
 * the target is small enough that you cannot grab it far from its centre. A corner handle is; an
 * **edge** is not — press halfway along a corridor and its end node teleports under the cursor
 * before you have moved a pixel.
 *
 * Snap and the guides are then asked about `aimPoint`, i.e. about **where the node would be**, which
 * is what they were always meant to answer: you are snapping the node to the wall, not the cursor.
 */
function grabOffset(start, lead) {
  return { dx: start.x - lead.x, dy: start.y - lead.y };
}
function aimPoint(pt, grab) {
  return { x: pt.x - grab.dx, y: pt.y - grab.dy };
}

/**
 * **An edge is selected when both of its ends are.** That is the entire model, and it is why edge
 * editing needed almost no new machinery: selecting an edge selects two corners, dragging it is the
 * multi-corner drag that already existed, and *multi*-edge selection is the same set with more in
 * it. It also means a marquee that catches two adjacent corners correctly reports the edge between
 * them, which nobody had to write.
 */
function selectedEdgeCount(rings, sel) {
  let n = 0;
  for (const [ri, ring] of (rings || []).entries()) {
    const last = ring.length - 1;
    for (let ci = 0; ci < last; ci++) {
      const [a, b] = edgeKeys(ri, ci, ring.length);
      if (sel.has(a) && sel.has(b)) n++;
    }
  }
  return n;
}
/* EDGE-ENGINE-END */

function geomSelectedEdges() {
  if (!GEOM || !GEOM.sel) return 0;
  if (GEOM.kind === "area") return selectedEdgeCount(GEOM.rings, GEOM.sel);
  /**
   * The same rule for a network — **an edge is selected when both of its ends are** — counted off
   * the edge list rather than off ring indices, because that is where a network's edges live.
   */
  if (GEOM.kind === "network" && WF_EDGES)
    return WF_EDGES.filter(e => GEOM.sel.has(e.properties.from) && GEOM.sel.has(e.properties.to)).length;
  return 0;
}

/**
 * Any structural change CLEARS the selection rather than trying to carry it.
 *
 * Dropping only the out-of-range keys would be worse than useless: removing one corner shifts every
 * later index down by one, so the surviving keys would still be *valid* and would now highlight
 * the wrong corners — and the next drag would move corners the user never picked. Clearing is
 * honest and takes one shift-drag to redo.
 */
function geomClearSel() {
  if (GEOM && GEOM.sel) GEOM.sel.clear();
}

/**
 * Everything inside the marquee. Screen space, because the marquee is a rectangle **on screen** —
 * in lng/lat it would be a quadrilateral the moment the map is rotated.
 */
function geomSelectIn(a, b, additive) {
  if (!GEOM || GEOM.kind !== "area") return;
  const pa = map.project(a), pb = map.project(b);
  const x0 = Math.min(pa.x, pb.x), x1 = Math.max(pa.x, pb.x);
  const y0 = Math.min(pa.y, pb.y), y1 = Math.max(pa.y, pb.y);
  if (!additive) GEOM.sel.clear();
  GEOM.rings.forEach((ring, ri) => {
    for (let ci = 0; ci < ring.length - 1; ci++) {
      const p = map.project(ring[ci]);
      if (p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1) GEOM.sel.add(selKey(ri, ci));
    }
  });
}

/**
 * The lasso, over a network's nodes. Keyed by `fid` rather than by `ring:corner`, because a network
 * has no rings and its nodes have names of their own — which also means a selection survives a
 * delete, where a ring's indices would all have shifted under it.
 */
function wfSelectIn(a, b, additive) {
  if (!GEOM || GEOM.kind !== "network") return;
  if (!additive) GEOM.sel.clear();
  const p0 = map.project(a), p1 = map.project(b);
  const x0 = Math.min(p0.x, p1.x), x1 = Math.max(p0.x, p1.x);
  const y0 = Math.min(p0.y, p1.y), y1 = Math.max(p0.y, p1.y);
  for (const n of GEOM.nodes || []) {
    const p = map.project(n.at);
    if (p.x >= x0 && p.x <= x1 && p.y >= y0 && p.y <= y1) GEOM.sel.add(n.fid);
  }
}

/**
 * **Unlink the edge under the pointer**: the two nodes stay, the walk between them stops existing.
 *
 * The smallest edit this graph has — and unlike deleting a node, nothing has to be contracted or
 * refused, because nothing is left with a hole in it. It can still split a network in two, which is
 * a real outcome and is reported rather than hidden.
 */
function geomUnlinkEdge() {
  if (!GEOM || GEOM.kind !== "network" || !GEOM.cut) return;
  const [a, b] = GEOM.cut;
  geomPush();
  const before = GEOM.nodes.map(n => n.fid);
  const res = unlinkNetworkNodes(GEOM.nodes, a, b);
  if (!res.removed) return;
  wfReplaceNetwork(before, res.nodes);
  GEOM.nodes = res.nodes.map(n => JSON.parse(JSON.stringify(n)));
  GEOM.cut = null;
  wfCutKey = null;
  try { map.setFilter(WF_CUT, WF_NONE); } catch (e) {}
  /**
   * ⚠️ The network may have just become two, and the one being edited is whichever the panel's node
   * is now in. Re-reading it is what keeps the highlight, the lasso and Delete all talking about
   * the same set of nodes.
   */
  const net = wfNetOf(GEOM.fid);
  if (net >= 0) { GEOM.net = net; GEOM.nodes = wfNetworkNodes(net); }
  wfSetEditing(GEOM.net, GEOM.fid);
  wfSetSelected();
  post("geomerror", { fid: GEOM.fid, message:
    res.removed > 1 ? "Unlinked — the two nodes no longer connect either way"
                    : "Unlinked — the one-way link between the two nodes is gone" });
  post("geomstate", geomState());
}

/**
 * **Delete the selected nodes from the network.**
 *
 * ⚠️ Not the same act as deleting a corner, and the difference is worth stating: a polygon with a
 * corner removed is still one polygon, while a network with a node removed can be **two networks**
 * and a corridor that ran through it now goes nowhere. `deleteNetworkNodes` contracts the ones that
 * merely carried a path on, so the corridor survives; a junction cannot be contracted without
 * inventing corridors through walls, so it is removed and what happened is **said**.
 */
function geomDeleteNodes() {
  if (!GEOM || GEOM.kind !== "network" || !GEOM.sel.size) return;
  geomPush();
  const before = GEOM.nodes.map(n => n.fid);
  const res = deleteNetworkNodes(GEOM.nodes, [...GEOM.sel]);
  wfReplaceNetwork(before, res.nodes);
  GEOM.nodes = res.nodes.map(n => JSON.parse(JSON.stringify(n)));
  GEOM.sel.clear();
  /**
   * ⚠️ **The panel may have been on one of them.** If the node the editor is anchored to has just
   * been deleted, the editor moves to whatever is left of the network rather than pointing at
   * nothing — and if nothing is left, the edit is over.
   */
  if (!res.nodes.some(n => n.fid === GEOM.fid)) {
    if (!res.nodes.length) return geomEnd(false);
    geomTakeIdentity(res.nodes[0].fid);
  }
  wfSetEditing(GEOM.net, GEOM.fid);
  wfSetSelected();
  post("geomerror", { fid: GEOM.fid, message:
    res.removed + " node" + (res.removed === 1 ? "" : "s") + " removed" +
    (res.bridged ? " · " + res.bridged + " corridor" + (res.bridged === 1 ? "" : "s") + " joined up" : "") +
    (res.refused ? " · ⚠️ " + res.refused + " junction" + (res.refused === 1 ? "" : "s") +
                   " could not be joined — the network may be in pieces" : "") });
  post("geomstate", geomState());
}

/**
 * Delete every selected vertex.
 *
 * ⚠️ **A ring cannot go below a triangle.** If the selection would take one under, the ring is left
 * alone rather than mangled — unless the feature has other rings, in which case deleting the whole
 * ring is what the user plainly meant. Whatever is refused is said out loud; silently keeping
 * points somebody asked to delete is how you lose trust in a delete key.
 */
function geomDeleteSelected() {
  if (!GEOM || GEOM.kind !== "area" || !GEOM.sel.size) return;
  const byRing = new Map();
  for (const k of GEOM.sel) {
    const [ri, ci] = k.split(":").map(Number);
    if (!byRing.has(ri)) byRing.set(ri, new Set());
    byRing.get(ri).add(ci);
  }
  const rings = [], pieceOf = [];
  let removed = 0, refused = 0;

  GEOM.rings.forEach((ring, ri) => {
    const keep = () => { rings.push(ring); pieceOf.push(GEOM.pieceOf[ri]); };
    const drop = byRing.get(ri);
    if (!drop) return keep();
    const open = ring.slice(0, -1);
    const kept = open.filter((_, ci) => !drop.has(ci));
    if (kept.length >= 3) {                    // still a shape — take the corners out
      removed += open.length - kept.length;
      kept.push(kept[0].slice());
      rings.push(kept); pieceOf.push(GEOM.pieceOf[ri]);
    } else if (GEOM.rings.length > 1) {        // selecting all of one piece means delete the piece
      removed += open.length;
    } else {                                   // the last shape: refuse rather than mangle
      refused++;
      keep();
    }
  });

  if (!removed) {
    post("geomerror", { fid: GEOM.fid,
      message: "a shape needs at least three corners — select fewer of them" });
    return;
  }
  geomPush();
  GEOM.rings = rings;
  GEOM.pieceOf = pieceOf;
  GEOM.sel.clear();
  if (refused) {
    post("geomerror", { fid: GEOM.fid,
      message: "one shape kept its corners — three is the minimum" });
  }
  geomDraw(); post("geomstate", geomState());
}

/** How many separate pieces the feature is in. `1` is a feature nobody has split. */
function geomPieces() {
  return GEOM ? new Set(GEOM.pieceOf).size : 1;
}

/**
 * Save the shape and carry on editing — what the panel's **Update** means now that geometry is
 * simply part of edit mode. Re-baselining is the point: without it the editor would still report
 * itself dirty against the outline you just replaced.
 */
function geomCommit() {
  if (!GEOM) return;
  post("geometry", { fid: GEOM.fid, rings: GEOM.rings, point: GEOM.point, pieces: geomPieces(),
                     nodes: GEOM.nodes, absorbed: GEOM.absorbed.slice() });
  GEOM.original = geomSnap();
  GEOM.history = [];
  GEOM.future = [];
  post("geomstate", geomState());
}

function geomEnd(commit) {
  if (!GEOM) return;
  if (commit) post("geometry", { fid: GEOM.fid, rings: GEOM.rings, point: GEOM.point,
                                 pieces: geomPieces(), nodes: GEOM.nodes,
                                 absorbed: GEOM.absorbed.slice() });
  /**
   * ⚠️ **Every hidden wall comes back.** They were hidden for the session's sake — nothing here is
   * persisted, and a floor plan permanently missing walls because somebody opened a panel once and
   * closed it would be a lie about the published map. Restoring runs whether or not the edit was
   * committed, because even a committed combine is local.
   */
  GEOM.hidden = { fids: [], labels: [], layers: [] };
  // Restores the SDK's filters and re-applies whatever the PREVIEW still wants hidden — see the
  // two-sources note in geomApplyHiddenFilter. Before that union this line put every rejected
  // addition back on the map the moment an edit session closed.
  geomApplyHiddenFilter();
  wfSetEditing(null);          // the nodes go back to being texture
  GEOM = null;
  // Shift+drag goes back to being MapLibre's box zoom — see geomBegin.
  try { map.boxZoom.enable(); } catch (e) {}
  geomDraw();
  post("geomstate", { editing: false });
}

/**
 * What kind of thing is this feature, and where is it?
 *
 * `{ kind: "area", rings }` or `{ kind: "point", point }`, or `null` if the floor has not loaded
 * it. **A great many POIs are points** (Olcay, 2026-08-15: *"if the geometry is point - there is no
 * way to reshape it"*) — a point has no outline to reshape, but it can certainly be moved, and
 * before this it could not even be opened without throwing.
 *
 * Rings win when a feature somehow has both: the outline is the editable thing.
 */
/**
 * ⚠️ **What this returns, the caller owns.** Both sources hand back shared structures otherwise —
 * `LEVEL_GEOM` holds one object per feature for the life of the level, and a tile feature's
 * coordinate arrays belong to the tile — so the copy has to happen somewhere, and one owner beats
 * two. Callers used to copy again on top, which meant serialising a concourse twice to open it.
 */
function geomFind(fid) {
  /**
   * **Pointr Cloud first, tiles only if it cannot answer.**
   *
   * The whole reason this branch exists is that a tile carries a feature *clipped to that tile*, so
   * a feature larger than one tile has no true outline in the tiles at all — see the note below and
   * `cloud/levelFeatures` in the app. This geometry is whole, arrives once, and has no seams.
   */
  const whole = LEVEL_GEOM.get(fid);
  if (whole) {
    if (whole.type === "Point") return { kind: "point", point: whole.coordinates.slice(), tiles: 0, src: "geojson" };
    if (whole.type === "MultiPoint" && whole.coordinates[0])
      return { kind: "point", point: whole.coordinates[0].slice(), tiles: 0, src: "geojson" };
    const rs = ringsOuter({ geometry: whole });
    // `tiles: 1` because it came whole — the seam warning is about tiles and does not apply here.
    if (rs.length) return { kind: "area", rings: rs.map(r => r.map(c => c.slice())), tiles: 1, src: "geojson" };
  }
  const rings = [];
  let point = null;
  /**
   * ⚠️ **How many TILES carried this feature** — not how many rings it has, which is a different
   * and innocent thing (a genuine MultiPolygon).
   *
   * `querySourceFeatures` returns one copy of a feature **per tile it touches**, and each copy is
   * **clipped to its own tile**. So a feature larger than a tile arrives in pieces with dead
   * straight edges along the seams, and accumulating them — which is what this does, and what
   * `scanFeature` documents itself doing — builds an outline that is partly the tile grid rather
   * than the building. Those false corners are draggable, they inflate the piece count, and a
   * commit would write the seams into the shape.
   *
   * It went unnoticed for as long as only POIs were editable, because a POI fits in one tile.
   * Opening every geometry to the editor (2026-08-16) made concourse-sized structural features
   * reachable, and they are exactly the ones that span tiles.
   */
  let tiles = 0;
  for (const f of featuresWithFid(fid)) {
    const g = f.geometry;
    if (g.type === "Point") { if (!point) point = g.coordinates.slice(); }
    else if (g.type === "MultiPoint") { if (!point && g.coordinates[0]) point = g.coordinates[0].slice(); }
    else {
      const got = ringsOuter(f);
      // Copied here, not by the caller — see the ownership note on this function.
      if (got.length) { tiles++; rings.push(...got.map(r => r.map(c => c.slice()))); }
    }
  }
  if (rings.length) return { kind: "area", rings, tiles, src: "tiles" };
  if (point) return { kind: "point", point, tiles: 0, src: "tiles" };
  return null;
}

function geomState() {
  // Once, not once per field: it runs the combine engine, which is real work.
  const can = GEOM ? geomCombinable() : null;
  return GEOM
    ? {
        editing: true, fid: GEOM.fid, mode: GEOM.mode, snap: GEOM.snap,
        canUndo: GEOM.history.length > 0, canRedo: GEOM.future.length > 0,
        // Compared against the baseline, not "did anything happen" — drag a point and put it back
        // and you have changed nothing, so Update must not light up.
        dirty: JSON.stringify(geomSnap()) !== JSON.stringify(GEOM.original),
        pieces: geomPieces(),
        // Has the first click of a cut landed? The toolbar says what the next click will do.
        cutting: GEOM.mode === "split" && !!GEOM.cutA,
        /**
